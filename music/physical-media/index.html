<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>physical media — magmacrunch media</title>
    <link rel="icon" type="image/jpeg" href="../../assets/logo.jpg">
    <link rel="stylesheet" href="../../style.css">
    <style>
        :root {
            --nav-accent: #39ff6e;
            --nav-glow: rgba(57,255,110,0.4);
            --nav-brand: #39ff6e;
            --nav-brand-glow: rgba(57,255,110,0.6);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 60px;
        }

        .breadcrumb {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--dim);
            letter-spacing: 0.1em;
            margin-top: -8px;
            margin-bottom: 16px;
            align-self: flex-start;
        }
        .breadcrumb a { color: var(--dim); text-decoration: none; transition: color 0.15s; }
        .breadcrumb a:hover { color: var(--green); }
        .breadcrumb .sep { margin: 0 8px; color: var(--green); opacity: 0.7; }
        .breadcrumb .current { color: var(--green); }

        .page-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(14px, 3vw, 24px);
            color: var(--green);
            text-shadow: 0 0 20px rgba(57,255,110,0.5);
            margin-bottom: 10px;
            letter-spacing: 0.08em;
            animation: fadeUp 0.5s ease both;
        }

        .page-subtitle {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--dim);
            letter-spacing: 0.12em;
            margin-bottom: 40px;
            animation: fadeUp 0.5s 0.05s ease both;
        }

        .section-divider {
            width: min(640px, 90vw);
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), var(--purple), var(--green), transparent);
            margin-bottom: 40px;
            position: relative;
            animation: fadeUp 0.5s 0.1s ease both;
        }
        .section-divider::after {
            content: '✦';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: var(--black);
            padding: 0 12px;
            color: var(--green);
            font-size: 10px;
        }

        .formats-wrap {
            width: min(640px, 90vw);
            display: flex;
            flex-direction: column;
            gap: 0;
            animation: fadeUp 0.5s 0.15s ease both;
        }

        .formats-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--green);
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .format-card {
            display: flex;
            gap: 0;
            border: 2px solid #1e1e2e;
            border-bottom: none;
            background: var(--deep);
            text-decoration: none;
            transition: border-color 0.15s, background 0.15s;
            position: relative;
            overflow: hidden;
        }
        .format-card:last-child { border-bottom: 2px solid #1e1e2e; }
        .format-card:hover {
            border-color: var(--green);
            background: #0c1a10;
        }

        .format-card::before {
            content: '';
            display: block;
            width: 4px;
            flex-shrink: 0;
            background: var(--green);
            transition: width 0.15s;
        }
        .format-card:hover::before { width: 7px; }

        .format-card-info {
            padding: 16px 20px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .format-card-text { flex: 1; }

        .format-card-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(8px, 1.4vw, 10px);
            color: var(--green);
            letter-spacing: 0.06em;
            line-height: 1.7;
            margin-bottom: 5px;
        }

        .format-card-meta {
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            color: var(--dim);
            line-height: 1.5;
        }

        .format-card-meta .tag {
            display: inline-block;
            background: var(--green);
            color: var(--black);
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            padding: 2px 6px;
            letter-spacing: 0.08em;
            margin-right: 6px;
            vertical-align: middle;
        }

        .format-card-meta .tag.soon {
            background: #444;
            color: #888;
        }

        .format-card-arrow {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--green);
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.15s, transform 0.15s;
            flex-shrink: 0;
        }
        .format-card:hover .format-card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .format-card.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .format-card.disabled::before { background: #444; }
        .format-card.disabled .format-card-title { color: #666; }
        .format-card.disabled .format-card-meta { color: #555; }

        footer {
            border-top-color: #1e1e2e !important;
        }
    </style>
</head>
<body>

<nav id="auto-nav" data-depth="../../"></nav>

<main>

    <div class="breadcrumb">
        <a href="../../index.html">home</a>
        <span class="sep">&rsaquo;</span>
        <a href="../index.html">music</a>
        <span class="sep">&rsaquo;</span>
        <span class="current">physical media</span>
    </div>

    <h1 class="page-title">// physical media //</h1>
    <p class="page-subtitle">physical &amp; obscure media series</p>

    <div class="section-divider"></div>

    <div class="formats-wrap">
        <div class="formats-label">// formats //</div>

        <a href="floppy-disk/index.html" class="format-card">
            <div class="format-card-info">
                <div class="format-card-text">
                    <div class="format-card-title">3.5" FLOPPY DISK</div>
                    <div class="format-card-meta">
                        <span class="tag">active</span>
                        est. july 2025
                    </div>
                </div>
                <span class="format-card-arrow">&#9654;</span>
            </div>
        </a>

        <div class="format-card disabled">
            <div class="format-card-info">
                <div class="format-card-text">
                    <div class="format-card-title">CD</div>
                    <div class="format-card-meta">
                        <span class="tag soon">soon</span>
                        coming soon
                    </div>
                </div>
            </div>
        </div>

        <div class="format-card disabled">
            <div class="format-card-info">
                <div class="format-card-text">
                    <div class="format-card-title">TAPE</div>
                    <div class="format-card-meta">
                        <span class="tag soon">soon</span>
                        coming soon
                    </div>
                </div>
            </div>
        </div>

    </div>

</main>

<footer>
    &copy; 2026 <span>magmacrunch media</span>
</footer>

<script src="../../nav.js"></script>

</body>
</html>
