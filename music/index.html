<script>
// ── ANIMATED WAVEFORM ──
(function () {
    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    const cols = [
        '#1A1E28', '#F8F8F8', '#A8A8A8',
        '#343848', '#F0B800', '#787878'
    ];
    const resolvedCols = ['#1A1E28','#F8F8F8','#A8A8A8','#343848','#F0B800','#787878'];

    // Each "bar" in the waveform
    const BAR_W = 3;
    const GAP   = 1;
    const COUNT = Math.floor(W / (BAR_W + GAP));

    // Seed heights with a mix of sine waves
    const phases  = Array.from({length: COUNT}, (_, i) => Math.random() * Math.PI * 2);
    const speeds  = Array.from({length: COUNT}, (_, i) => 0.018 + Math.random() * 0.024);
    const heights = Array.from({length: COUNT}, (_, i) => 0.3 + Math.random() * 0.7);
    const colorIdx = Array.from({length: COUNT}, (_, i) => i % resolvedCols.length);

    let t = 0;

    let animId;
    function draw() {
        ctx.clearRect(0, 0, W, H);
        const mid = H / 2;

        for (let i = 0; i < COUNT; i++) {
            const amp = heights[i] * (mid - 2);
            const y   = Math.sin(phases[i] + t * speeds[i] * 60) * amp;
            const barH = Math.max(2, Math.abs(y) * 2);
            const x   = i * (BAR_W + GAP);

            ctx.fillStyle = resolvedCols[colorIdx[i]];
            ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(phases[i] + t * speeds[i] * 60));
            ctx.fillRect(x, mid - barH / 2, BAR_W, barH);
        }
        ctx.globalAlpha = 1;
        t++;
        animId = requestAnimationFrame(draw);
    }

    draw();
    window.__pageCleanup = function() { cancelAnimationFrame(animId); };

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            cancelAnimationFrame(animId);
        } else {
            draw();
        }
    });
})();
</script>
