<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../../assets/archive.css">
    <link rel="stylesheet" href="ds-shared.css">
    <style>
        /* ══ PAGE: by-artist / dino-spumoni ══ */

        main { position: relative; padding: 0; }

        /* ── BREADCRUMB ── */
        body.ds-page .breadcrumb a { color: var(--ds-sky); }
        body.ds-page .breadcrumb a:hover { color: var(--ds-heading); }
        body.ds-page .breadcrumb .sep { color: var(--ds-sky); opacity: 0.6; }
        body.ds-page .breadcrumb .current { color: var(--ds-sky); }

        /* ── ARTIST HERO ── */
        .artist-hero {
            width: 100%;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            margin-bottom: 0;
        }
        .artist-hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 30%;
            filter: saturate(0.85) brightness(0.72);
        }
        .artist-hero-tint {
            position: absolute;
            inset: 0;
            background: rgba(64, 96, 160, 0.10);
            mix-blend-mode: screen;
        }
        .artist-hero-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(8,10,14,0.0)  0%,
                rgba(8,10,14,0.0)  85%,
                rgba(8,10,14,0.85) 100%
            );
        }
        .hero-inner {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            padding: 0 20px 36px;
            display: flex;
            flex-direction: column;
        }



        /* ── ARTIST HEADER ── */
        .artist-header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 0;
            animation: fadeUp 0.5s ease both;
        }
        .artist-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: var(--ds-mid);
            letter-spacing: 0.2em;
            margin-bottom: 12px;
            opacity: 0.85;
        }
        .artist-name {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(14px, 3vw, 24px);
            color: var(--ds-heading);
            line-height: 1.6;
            letter-spacing: 0.06em;
            text-shadow:
                0 0 28px rgba(104, 136, 168, 0.65),
                0 2px 10px rgba(0, 0, 0, 0.95);
            margin-bottom: 6px;
        }
        .artist-abbr {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: var(--ds-mid);
            letter-spacing: 0.15em;
            margin-top: -8px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        /* ── SUB-NAV CARDS ── */
        .sub-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 48px;
        }


        /* ── DIVIDER ── */
        .divider {
            width: 100%;
            max-width: 900px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--ds-mid), var(--ds-cta), var(--ds-mid), transparent);
            margin: 8px 0 40px;
            opacity: 0.4;
        }

        /* ── LAYOUT ── */
        .artist-body {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            animation: fadeUp 0.5s 0.1s ease both;
        }

        /* ── SECTION LABELS ── */
        .section-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--ds-mid);
            letter-spacing: 0.15em;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--ds-mid);
            opacity: 0.9;
        }

        /* ── BIO ── */
        .bio p {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            color: var(--ds-heading);
            line-height: 1.8;
            margin-bottom: 16px;
            opacity: 0.9;
        }
        .bio .link-row {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .ext-link {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: var(--ds-teal);
            text-decoration: none;
            letter-spacing: 0.1em;
            padding: 7px 12px;
            border: 1px solid var(--ds-teal);
            transition: background 0.15s, color 0.15s;
        }
        .ext-link:hover {
            background: var(--ds-teal);
            color: var(--ds-deep);
        }

        /* ── PHOTO STRIP ── */
        .photo-strip-section {
            width: 100%;
            max-width: 900px;
            margin-bottom: 48px;
            animation: fadeUp 0.5s 0.25s ease both;
        }
        .photo-strip-wrap { position: relative; width: 100%; }
        .photo-strip {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--ds-mid) #0a0a14;
            padding-bottom: 10px;
            cursor: grab;
        }
        .photo-strip:active { cursor: grabbing; }
        .photo-strip::-webkit-scrollbar { height: 3px; }
        .photo-strip::-webkit-scrollbar-track { background: #0a0a14; }
        .photo-strip::-webkit-scrollbar-thumb { background: var(--ds-mid); }
        .photo-item {
            flex-shrink: 0;
            position: relative;
            height: clamp(200px, 35vw, 380px);
            scroll-snap-align: start;
            overflow: hidden;
            border: 1px solid #1a1a2a;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .photo-item:hover { border-color: var(--ds-mid); }
        .photo-item.landscape { aspect-ratio: 16/9; }
        .photo-item.square    { aspect-ratio: 1/1; }
        .photo-item.wide      { aspect-ratio: 4/3; }
        .photo-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease, filter 0.3s ease;
            filter: saturate(0.85) brightness(0.88);
        }
        .photo-item:hover img {
            transform: scale(1.03);
            filter: saturate(1.0) brightness(1.0);
        }
        .photo-caption {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 22px 10px 8px;
            background: linear-gradient(to top, rgba(8,8,18,0.88) 0%, transparent 100%);
            font-family: 'Press Start 2P', monospace;
            font-size: 5px; color: var(--dim); letter-spacing: 0.1em;
            opacity: 0; transition: opacity 0.25s ease;
        }
        .photo-item:hover .photo-caption { opacity: 1; }
        .strip-scroll-hint {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px; color: var(--dim); letter-spacing: 0.15em;
            margin-top: 8px; opacity: 0.35; text-align: right;
            transition: opacity 0.4s;
        }
        .photo-strip-wrap.scrolled .strip-scroll-hint { opacity: 0; }

        /* ── PHOTO LIGHTBOX ── */
        .photo-lightbox {
            display: none; position: fixed; inset: 0;
            background: rgba(4,4,12,0.96); z-index: 1000;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .photo-lightbox.open { display: flex; }
        .lb-img-wrap { max-width: 90vw; max-height: 82vh; display: flex; align-items: center; justify-content: center; }
        .lb-img-wrap img { max-width: 90vw; max-height: 82vh; object-fit: contain; border: 1px solid #1a1a2a; }
        .lb-nav { display: flex; align-items: center; gap: 28px; margin-top: 16px; }
        .lb-btn { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--dim);
            background: none; border: 1px solid #1a1a2a; padding: 7px 14px; cursor: pointer;
            letter-spacing: 0.1em; transition: color 0.15s, border-color 0.15s; }
        .lb-btn:hover { color: var(--ds-mid); border-color: var(--ds-mid); }
        .lb-close { font-family: 'Press Start 2P', monospace; font-size: 7px; color: var(--dim);
            background: none; border: none; cursor: pointer; padding: 8px;
            letter-spacing: 0.1em; transition: color 0.15s; }
        .lb-close:hover { color: var(--ds-mid); }
        .lb-counter { font-family: 'Press Start 2P', monospace; font-size: 6px;
            color: var(--dim); letter-spacing: 0.12em; opacity: 0.55; min-width: 50px; text-align: center; }
        .lb-cap { font-family: 'Press Start 2P', monospace; font-size: 6px;
            color: var(--dim); letter-spacing: 0.1em; margin-top: 8px; opacity: 0.45; min-height: 14px; }

        /* ── YEARS BADGE ── */
        .years-badge {
            display: inline-block;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: var(--ds-heading);
            background: var(--ds-brand);
            padding: 4px 10px;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
        }

        /* ── MB LINK ── */
        .mb-link-wrap { width:100%; max-width:900px; padding:0 20px; margin-bottom: 40px; animation:fadeUp 0.5s 0.15s ease both; }
        .mb-link { font-family:'Press Start 2P',monospace; font-size:6px; color:var(--ds-sky); text-decoration:none; border:1px solid var(--ds-mid); padding:6px 12px; letter-spacing:0.08em; transition:color 0.15s,border-color 0.15s; display:inline-block; }
        .mb-link:hover { color:var(--ds-heading); border-color:var(--ds-heading); }

        /* ── FOOTER ── */
        footer { position: absolute; bottom: 0; left: 0; right: 0; border-top: none; z-index: 2; }
    </style>
</head>

<script src="../../../nav.js"></script>
<script>
// ── PHOTO STRIP: drag to scroll ──
(function() {
    const strip = document.getElementById('dsStrip');
    const wrap  = document.getElementById('dsStripWrap');
    let isDown = false, startX, scrollLeft;

    strip.addEventListener('mousedown', e => {
        isDown = true; strip.classList.add('dragging');
        startX = e.pageX - strip.offsetLeft;
        scrollLeft = strip.scrollLeft;
    });
    strip.addEventListener('mouseleave', () => { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mouseup',    () => { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mousemove',  e => {
        if (!isDown) return;
        e.preventDefault();
        strip.scrollLeft = scrollLeft - (e.pageX - strip.offsetLeft - startX) * 1.2;
    });
    strip.addEventListener('scroll', () => {
        if (strip.scrollLeft > 30) wrap.classList.add('scrolled');
    }, { passive: true });
})();

// ── PHOTO LIGHTBOX ──
(function() {
    const items   = document.querySelectorAll('#dsStrip .photo-item');
    const lb      = document.getElementById('dsLightbox');
    const lbImg   = document.getElementById('dsLbImg');
    const lbCap   = document.getElementById('dsLbCap');
    const lbCount = document.getElementById('dsLbCounter');
    const strip   = document.getElementById('dsStrip');

    const photos = Array.from(items).map(item => ({
        src:     item.querySelector('img').src,
        alt:     item.querySelector('img').alt,
        caption: item.querySelector('.photo-caption').textContent.trim()
    }));

    let current = 0;

    function open(index) {
        current = index;
        show();
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function close() {
        lb.classList.remove('open');
        document.body.style.overflow = '';
    }
    function show() {
        lbImg.src = photos[current].src;
        lbImg.alt = photos[current].alt;
        lbCap.textContent = photos[current].caption;
        lbCount.textContent = `${current + 1} / ${photos.length}`;
    }
    function nav(dir) {
        current = (current + dir + photos.length) % photos.length;
        show();
    }

    items.forEach(item => {
        item.addEventListener('click', () => {
            if (!strip.classList.contains('dragging'))
                open(parseInt(item.dataset.index));
        });
    });

    document.getElementById('dsLbClose').addEventListener('click', close);
    document.getElementById('dsLbPrev').addEventListener('click', () => nav(-1));
    document.getElementById('dsLbNext').addEventListener('click', () => nav(1));
    lb.addEventListener('click', e => { if (e.target === lb) close(); });
    document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape')      close();
        if (e.key === 'ArrowLeft')   nav(-1);
        if (e.key === 'ArrowRight')  nav(1);
    });
})();
</script>
