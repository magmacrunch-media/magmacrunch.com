<script>
const FLYERS = [
    { title: "@ The Spice Rack",     date: "Jun 14, 2025",  img: "../../../assets/flyers/svfp/spicerack-june2025-show_1.png",         status: "" },
    { title: "@ The Spice Rack",     date: "Jun 14, 2025",  img: "../../../assets/flyers/svfp/spicerack-june2025-show_2.png",         status: "" },
    { title: "@ The Spice Rack — Mud Wrasslin'", date: "Jul 4, 2025", img: "../../../assets/flyers/svfp/spicerack-july2025-show_got-shut-down.png", status: "shut-down" },
    { title: "Sound Fest",           date: "Jul 7–26, 2025", img: "../../../assets/flyers/svfp/sound-fest-july2025_cancelled.png",     status: "cancelled" },
    { title: "@ The Mansion",        date: "Jul 19, 2025",  img: "../../../assets/flyers/svfp/themansion-19july2025-show.png",         status: "" },
    { title: "@ The Mansion",        date: "Jul 25, 2025",  img: "../../../assets/flyers/svfp/themansion-25july2025-show.png",         status: "" },
    { title: "@ The Mansion",        date: "Sep 25, 2025",  img: "../../../assets/flyers/svfp/themansion-september2025-show.png",      status: "" },
    { title: "@ 8 Ball",             date: "Oct 18, 2025",  img: "../../../assets/flyers/svfp/8ball-october2025-show.png",             status: "" },
    { title: "@ Manny's",            date: "Oct 25, 2025",  img: "../../../assets/flyers/svfp/mannys-october2025-show.png",            status: "" },
    { title: "Zeno-Ween! @ Zeno's",  date: "Oct 30, 2025",  img: "../../../assets/flyers/svfp/zenos-october2025-show.png",             status: "" },
    { title: "@ Guild Hall, Swoyersville", date: "Nov 1, 2025", img: "../../../assets/flyers/svfp/swoyersville-november2025-show_v5.png", status: "" },
    { title: "@ The Slums, Reading", date: "Nov 15, 2025",  img: "../../../assets/flyers/svfp/reading-november2025-show_v2.png",       status: "" },
    { title: "@ Lancaster",          date: "Nov 2025",       img: "../../../assets/flyers/svfp/lancaster-november2025-show.png",        status: "" },
    { title: "@ Manny's",            date: "Dec 16, 2025",  img: "../../../assets/flyers/svfp/mannys-december2025-show.png",           status: "" },
];

const STATUS_LABELS = { "cancelled": "cancelled", "shut-down": "shut down on the night" };

const flyerStage   = document.getElementById('flyerStage');
const flyerDots    = document.getElementById('flyerDots');
const flyerTitle   = document.getElementById('flyerTitle');
const flyerDate    = document.getElementById('flyerDate');
const flyerTag     = document.getElementById('flyerTag');
const flyerCounter = document.getElementById('flyerCounter');
const flyerPrev    = document.getElementById('flyerPrev');
const flyerNext    = document.getElementById('flyerNext');

let flyerCurrent = 0;

const flyerImgs = FLYERS.map((f, i) => {
    const img = document.createElement('img');
    img.src = f.img; img.alt = f.title;
    img.loading = i === 0 ? 'eager' : 'lazy';
    if (i === 0) img.classList.add('visible');
    flyerStage.insertBefore(img, flyerPrev);
    return img;
});

const flyerDotEls = FLYERS.map((f, i) => {
    const dot = document.createElement('button');
    dot.className = 'flyer-dot' + (i === 0 ? ' active' : '');
    if (f.status === 'cancelled') dot.classList.add('is-cancelled');
    if (f.status === 'shut-down') dot.classList.add('is-shut-down');
    dot.setAttribute('aria-label', f.title);
    dot.addEventListener('click', () => flyerGoTo(i));
    flyerDots.appendChild(dot);
    return dot;
});

function flyerGoTo(index) {
    flyerImgs[flyerCurrent].classList.remove('visible');
    flyerDotEls[flyerCurrent].classList.remove('active');
    flyerCurrent = ((index % FLYERS.length) + FLYERS.length) % FLYERS.length;
    flyerImgs[flyerCurrent].classList.add('visible');
    flyerDotEls[flyerCurrent].classList.add('active');
    const f = FLYERS[flyerCurrent];
    flyerTitle.textContent = f.title;
    flyerDate.textContent  = f.date || '';
    flyerCounter.textContent = (flyerCurrent + 1) + ' / ' + FLYERS.length;
    if (f.status) {
        flyerTag.textContent = STATUS_LABELS[f.status] || f.status;
        flyerTag.className = 'flyer-tag ' + f.status;
    } else {
        flyerTag.textContent = '';
        flyerTag.className = 'flyer-tag';
    }
}

flyerPrev.addEventListener('click', () => flyerGoTo(flyerCurrent - 1));
flyerNext.addEventListener('click', () => flyerGoTo(flyerCurrent + 1));
flyerGoTo(0);
</script>
</body>
</html>
