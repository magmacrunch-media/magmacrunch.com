<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVFP — Sex Van Floor Plan — magmacrunch media</title>
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../../assets/archive.css">
    <link rel="stylesheet" href="svfp-shared.css">
    <style>
        

        main { position: relative; padding: 0; }

        /* ── SVFP THEME OVERRIDES ── */
        body.svfp-page .breadcrumb a          { color: #e87040; }
        body.svfp-page .breadcrumb a:hover    { color: var(--svfp-accent); }
        body.svfp-page .breadcrumb .sep       { color: #e87040; opacity: 0.8; }
        body.svfp-page .breadcrumb .current   { color: #e87040; font-weight: bold; }

        .artist-hero-tint {
            position: absolute; inset: 0;
            background: rgba(224, 48, 112, 0.10);
            mix-blend-mode: screen;
        }
        .artist-label { color: #f8b0ff; }
        .artist-abbr  { color: var(--svfp-body); }
        .years-badge  { background: #2850a0; color: #f5d0ff; }
        .artist-name  { color: #f8b0ff; text-shadow: 0 0 28px rgba(248,176,255,0.5), 0 2px 10px rgba(0, 0, 0, 0.95); }
        .section-label { color: var(--svfp-cta); border-color: var(--svfp-cta); }
        .section-divider { background: linear-gradient(90deg, transparent, var(--svfp-cta), var(--svfp-accent), var(--svfp-cta), transparent); }

        /* sub-nav cards: keep original color classes, add SVFP background overrides */
        body.svfp-page .sub-nav .nav-card { border-width: 2px; border-style: solid; }

        body.svfp-page .bio-wrap a                      { color: var(--svfp-brand); }
        body.svfp-page .bio-wrap a:hover                { color: var(--svfp-accent); }
        body.svfp-page .floppy-link a                   { color: var(--svfp-brand); }

        /* ── HERO ── */
        .artist-hero {
            width: 100%;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            margin-bottom: 0;
        }
        .artist-hero-img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center 35%;
            filter: saturate(0.95) brightness(0.72);
        }
        .artist-hero-tint {
            position: absolute; inset: 0;
            background: rgba(224, 48, 112, 0.10);
            mix-blend-mode: screen;
        }
        .artist-hero-gradient {
            position: absolute; inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(10,10,20,0.0)  0%,
                rgba(10,10,20,0.0)  85%,
                rgba(10,10,20,0.85) 100%
            );
        }

        /* hero inner: breadcrumb at top, artist header at bottom */
        .hero-inner {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            padding: 0 20px 36px;
            display: flex;
            flex-direction: column;
        }
        .hero-inner .sub-nav { max-width: 1100px; }

        

        /* ── ARTIST HEADER ── */
        .artist-header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 0;
            animation: fadeUp 0.5s ease both;
        }
        .artist-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: var(--svfp-heading);
            letter-spacing: 0.2em;
            margin-bottom: 12px;
            opacity: 0.85;
        }
        .artist-name {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(14px, 3vw, 24px);
            color: var(--svfp-accent);
            line-height: 1.6;
            letter-spacing: 0.06em;
            text-shadow:
                0 0 28px rgba(217, 70, 239, 0.65),
                0 2px 10px rgba(0, 0, 0, 0.95);
            margin-bottom: 6px;
        }
        .artist-abbr {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: var(--svfp-body);
            letter-spacing: 0.15em;
            margin-top: -8px;
            margin-bottom: 16px;
            opacity: 0.8;
        }
        .years-badge {
            display: inline-block;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: #f0ead8;
            background: var(--svfp-brand);
            padding: 4px 10px;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
        }

        /* ── SUB-NAV ── */
        .sub-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 0;
        }
        .sub-nav .row-break { flex-basis: 100%; height: 0; }

        .content-wrap { width: 100%; max-width: 900px; padding: 0 20px; }
        .section-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px; color: var(--svfp-cta);
            letter-spacing: 0.15em; margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--svfp-cta);
            opacity: 0.9;
        }

        /* ── DIVIDER ── */
        .section-divider {
            width: 100%; max-width: 900px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--svfp-cta), var(--svfp-accent), var(--svfp-cta), transparent);
            margin: 0 20px 40px; opacity: 0.3;
            animation: fadeUp 0.5s 0.05s ease both;
        }

        /* ── BROWSE ── */
        .subpage-wrap { animation: fadeUp 0.5s 0.16s ease both; margin-bottom: 40px; }
        .subpage-grid { display: flex; gap: 10px; flex-wrap: wrap; }

        /* ── RELEASE CAROUSEL (floated single-image) ── */
        .release-carousel-wrap {
            float: right;
            margin: 0 0 20px 28px;
            width: 200px;
        }
        .carousel-single-img {
            position: relative;
            width: 200px; height: 200px;
            border: 1px solid #2a1a3a;
            overflow: hidden; background: #0a0a14;
        }
        .carousel-single-img img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            opacity: 0; transition: opacity 0.4s ease;
            filter: saturate(0.88) brightness(0.9);
        }
        .carousel-single-img img.visible { opacity: 1; }
        .carousel-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(8,8,18,0.72); border: none; color: var(--dim);
            font-family: 'Press Start 2P', monospace; font-size: 7px;
            padding: 6px 7px; cursor: pointer; z-index: 2; line-height: 1;
            transition: color 0.15s, background 0.15s;
        }
        body.svfp-page .carousel-arrow:hover { color: var(--svfp-accent); background: rgba(8,8,18,0.95); }
        .carousel-arrow.prev { left: 0; }
        .carousel-arrow.next { right: 0; }
        .carousel-arrow.hidden, .carousel-pause.hidden { display: none; }
        .carousel-meta { margin-top: 8px; }
        .carousel-now-title {
            font-family: 'Press Start 2P', monospace; font-size: 5.5px;
            color: var(--svfp-brand); letter-spacing: 0.08em; line-height: 1.7; display: block;
        }
        .carousel-now-year {
            font-family: 'Press Start 2P', monospace; font-size: 5px;
            color: var(--dim); letter-spacing: 0.08em; opacity: 0.5;
            margin-top: 3px; display: block;
        }
        .carousel-controls { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .carousel-dots { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
        .carousel-dot {
            width: 5px; height: 5px; background: #2a2a3a; border: none;
            cursor: pointer; transition: background 0.2s; padding: 0;
        }
        .carousel-dot.active { background: var(--svfp-brand); }
        .carousel-pause {
            font-family: 'Press Start 2P', monospace; font-size: 5px;
            color: var(--dim); background: none; border: 1px solid #2a2a3a;
            padding: 3px 7px; cursor: pointer; letter-spacing: 0.06em;
            transition: color 0.15s, border-color 0.15s; white-space: nowrap;
        }
        .carousel-pause:hover { color: var(--svfp-brand); border-color: var(--svfp-brand); }
        /* clearfix so bio container wraps the float */
        .bio-wrap::after { content: ''; display: table; clear: both; }
        @media (max-width: 640px) {
            .release-carousel-wrap { float: none; width: 100%; margin: 0 0 24px 0; }
            .carousel-single-img { width: 100%; height: auto; aspect-ratio: 1; }
        }

        

        /* BIO */
        .bio-wrap { animation: fadeUp 0.5s 0.08s ease both; margin-bottom: 40px; }
        .bio-text { font-family: 'Courier Prime', monospace; font-size: 15px; color: var(--svfp-body); line-height: 1.75; opacity: 0.85; margin-bottom: 16px; }
        .bio-links { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .bio-link { display: inline-block; font-family: 'Press Start 2P', monospace; font-size: 6px; color: var(--dim); border: 1px solid #2a2a3a; padding: 5px 12px; text-decoration: none; letter-spacing: 0.06em; transition: color 0.15s, border-color 0.15s; }
        .bio-link:hover    { color: var(--svfp-brand); border-color: var(--svfp-brand); }
        .bio-link.stream { color: var(--svfp-accent); border-color: var(--svfp-accent); }
        .bio-link.stream:hover { background: var(--svfp-accent); color: var(--svfp-bg); }
        .floppy-link { font-family: 'Courier Prime', monospace; font-size: 13px; color: var(--svfp-heading); margin-top: 6px; }
        .floppy-link a { color: var(--svfp-brand); text-decoration: none; }
        .floppy-link a:hover { text-decoration: underline; }

        /* PAY2PLAY FLYER */
        .release-flyer-wrap { animation: fadeUp 0.5s 0.10s ease both; margin-bottom: 40px; }
        .release-flyer-link {
            display: block;
            width: 100%; max-width: 480px;
            margin: 0 auto;
            border: 1px solid #2a1a3a;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .release-flyer-link:hover {
            border-color: var(--svfp-cta);
            box-shadow: 0 0 24px rgba(224, 48, 112, 0.28);
        }
        .release-flyer-link img {
            width: 100%; display: block;
            filter: saturate(0.92) brightness(0.96);
            transition: filter 0.3s ease;
        }
        .release-flyer-link:hover img { filter: saturate(1.0) brightness(1.0); }
        .release-flyer-caption {
            margin-top: 10px; text-align: center;
        }
        .release-flyer-caption span {
            font-family: 'Press Start 2P', monospace; font-size: 5.5px;
            color: var(--dim); letter-spacing: 0.1em; opacity: 0.6;
        }
        .release-flyer-caption a {
            color: var(--svfp-cta); text-decoration: none; opacity: 0.85;
            transition: opacity 0.15s;
        }
        .release-flyer-caption a:hover { opacity: 1; }

        /* PHOTOS */
        .photos-wrap { animation: fadeUp 0.5s 0.12s ease both; margin-bottom: 40px; }
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .photo-slot {
            aspect-ratio: 1; background: #0d0d18;
            border: 1px solid #2a1a3a;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.35s ease, filter 0.35s ease; filter: saturate(0.85) brightness(0.88); }
        .photo-slot:hover img { transform: scale(1.06); filter: saturate(1.0) brightness(1.0); }
        .photo-slot-overlay {
            position: absolute; inset: 0;
            background: rgba(224, 48, 112, 0.0);
            transition: background 0.25s ease;
            pointer-events: none;
        }
        .photo-slot:hover .photo-slot-overlay { background: rgba(224, 48, 112, 0.12); }

        /* LIGHTBOX */
        .lightbox {
            display: none; position: fixed; inset: 0; z-index: 1000;
            background: rgba(5, 5, 14, 0.96);
            align-items: center; justify-content: center;
            animation: fadeUp 0.15s ease both;
        }
        .lightbox.open { display: flex; }
        .lightbox-img-wrap {
            position: relative; max-width: min(90vw, 900px);
            max-height: 88vh; display: flex; align-items: center; justify-content: center;
        }
        .lightbox-img-wrap img {
            max-width: 100%; max-height: 88vh;
            object-fit: contain; display: block;
            border: 1px solid #2a1a3a;
            filter: saturate(0.9) brightness(0.95);
        }
        .lightbox-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(8,8,18,0.82); border: 1px solid #2a1a3a;
            color: var(--dim); font-family: 'Press Start 2P', monospace; font-size: 8px;
            padding: 10px 12px; cursor: pointer; z-index: 2; line-height: 1;
            transition: color 0.15s, border-color 0.15s, background 0.15s;
        }
        .lightbox-btn:hover { color: var(--svfp-cta); border-color: var(--svfp-cta); background: rgba(8,8,18,0.98); }
        .lightbox-prev { left: -48px; }
        .lightbox-next { right: -48px; }
        .lightbox-close {
            position: fixed; top: 18px; right: 22px;
            background: none; border: none; color: var(--dim);
            font-family: 'Press Start 2P', monospace; font-size: 9px;
            cursor: pointer; z-index: 1001; padding: 8px;
            transition: color 0.15s;
        }
        .lightbox-close:hover { color: var(--svfp-cta); }
        .lightbox-counter {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace; font-size: 6px;
            color: var(--dim); letter-spacing: 0.1em; opacity: 0.55;
        }
        @media (max-width: 640px) {
            .lightbox-prev { left: 4px; }
            .lightbox-next { right: 4px; }
            .lightbox-btn { font-size: 6px; padding: 8px 9px; }
        }

        /* BROWSE */

        /* section divider already defined above */

        @media (max-width: 640px) {
            .artist-name { font-size: 13px; }
            .subpage-grid { flex-direction: column; }
            .photo-grid { grid-template-columns: repeat(2, 1fr); }
        }
        /* ── ASCII LOGO BANNER ── */
        .ascii-logo-wrap {
            width: 100%;
            max-width: 100%;
            margin-top: 48px;
            margin-bottom: 0;
            display: flex;
            justify-content: center;
            animation: fadeUp 0.5s 0.2s ease both;
            position: relative;
            overflow: hidden;
            background-image: url('../../../assets/photos/svfp/svfp-november2025-motel1.jpg');
            background-size: cover;
            background-position: center 40%;
            padding: 28px 20px;
        }
        .ascii-logo-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(8, 8, 18, 0.62);
        }
        .ascii-logo-link { text-decoration: none; display: block; position: relative; z-index: 1; }
        .ascii-logo {
            font-family: 'Courier Prime', monospace;
            font-size: clamp(4px, 0.9vw, 8px);
            line-height: 1.2;
            color: var(--svfp-cta);
            text-shadow: 0 0 8px rgba(224, 48, 112, 0.45);
            white-space: pre;
            display: inline-block;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .ascii-logo-link:hover .ascii-logo {
            color: #ffffff;
            text-shadow: 0 0 14px rgba(224, 48, 112, 0.7);
        }

        /* ── FOOTER ── */
        footer { position: absolute; bottom: 0; left: 0; right: 0; border-top: none; z-index: 2; }
    </style>
</head>
