        body.bbc-page.bbc-links-page .links-body .section-label:not(:first-child) { margin-top: 32px; }

        .mb-links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
        }
        .mb-link-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border: 1px solid var(--bbc-dark);
            text-decoration: none;
            transition: border-color 0.15s, background 0.15s;
        }
        .mb-link-item:hover {
            border-color: var(--bbc-mauve);
            background: rgba(160,120,136,0.05);
        }
        .mb-link-abbr {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--bbc-mauve);

        .mb-link-name {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            color: var(--bbc-cream);
