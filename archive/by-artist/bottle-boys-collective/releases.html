<script>
/* ═══════════════════════════════════════════════════════════
   collective_releases.js  (inline)
   Fetches releases for multiple artist IDs, deduplicates,
   sorts newest-first, then renders progressively.
   ═══════════════════════════════════════════════════════════ */
(function () {
    const C = window.COLLECTIVE_CONFIG;
    if (!C || !C.ids?.length) { console.error('COLLECTIVE_CONFIG missing or has no ids'); return; }

    const d      = C.depth  || '../../../';
    const accent = C.accent || 'rose';

    const COLOR_MAP = {
        about: 'c-about', photography: 'c-photography', events:'c-events', recordings:'c-recordings', releases:'c-releases', works:'c-works',
    };

    const BACK_COLOR_VAR = {
        'c-green':'var(--green)','c-cyan':'var(--cyan)','c-rose':'var(--rose)',
        'c-yellow':'var(--yellow)','c-orange':'var(--orange)','c-purple':'var(--purple)',
        'c-slate':'var(--slate)','c-blue':'var(--blue)','c-magenta':'var(--magenta)',
        'c-darkgreen':'var(--darkgreen)',
    };
    const backColorVar = BACK_COLOR_VAR[C.backColor] || 'var(--orange)';

    const ACCENT_RGB = {
        green:'57,255,110', cyan:'0,245,255', rose:'255,61,110', yellow:'255,224,58',
        orange:'255,124,31', purple:'196,95,255', slate:'136,153,170', blue:'70,120,255',
        magenta:'255,45,120',
    };
    const accentRgb = '144,80,48';
    const accentVar = '#905030';

    // ── styles ──
    const style = document.createElement('style');
    style.textContent = `
        main { flex:1; display:flex; flex-direction:column; align-items:center; padding:72px 20px 60px; }
        .catalog-wrap { width:100%; max-width:960px; animation:fadeUp 0.5s 0.1s ease both; }
        #status-bar { font-family:'Press Start 2P',monospace; font-size:7px; color:var(--bbc-cream); letter-spacing:0.1em; margin-bottom:16px; min-height:18px; }
        #count-bar { font-family:'Press Start 2P',monospace; font-size:8px; color:var(--bbc-mid); letter-spacing:0.08em; margin-bottom:24px; }
        .release-card { display:flex; gap:18px; border:1px solid var(--bbc-dark); background:transparent; padding:0; margin-bottom:14px; transition:border-color 0.15s; }
        .release-card:hover { border-color:var(--bbc-warm-light); }
        .album-art { width:120px; min-width:120px; height:120px; background:var(--bbc-surface); border-right:1px solid var(--bbc-dark); flex-shrink:0; overflow:hidden; }
        .album-art img { width:100%; height:100%; object-fit:cover; display:block; }
        .release-info { padding:16px 18px 16px 0; flex:1; }
        .release-info h3 { font-family:'Press Start 2P',monospace; font-size:12px; color:var(--bbc-cream); letter-spacing:0.05em; margin-bottom:12px; line-height:1.7; }
        .release-info h3 a { color:var(--bbc-warm-light); text-decoration:none; }
        .release-info h3 a:hover { color:var(--bbc-warm); }
        .disambiguation { font-family:'Courier Prime',monospace; font-size:11px; color:var(--bbc-mid); font-style:italic; }
        .release-info p { font-family:'Courier Prime',monospace; font-size:12px; color:var(--bbc-cream); opacity:0.8; margin-bottom:5px; line-height:1.5; }
        .release-info p strong { font-family:'Press Start 2P',monospace; font-size:8px; color:var(--bbc-mid); letter-spacing:0.08em; margin-right:6px; }
        .release-info a { color:var(--bbc-warm-light); text-decoration:none; }
        .release-info a:hover { color:var(--bbc-warm); }
        .tag { display:inline-block; background:var(--bbc-raised); border:1px solid var(--bbc-dark); padding:2px 7px; margin:2px; font-family:'Courier Prime',monospace; font-size:11px; color:var(--bbc-mid); }
        .error-msg { color:var(--bbc-warm-light); opacity:0.7; }
        @media (max-width:500px) { .album-art { width:72px; min-width:72px; height:72px; } }
    `;
    document.head.appendChild(style);

    // ── dynamic stub elements ──
    const tickerPhrases = [C.name, 'releases', ...(C.ticker || [])];
    const tickerEl = document.getElementById('ticker-content');
    if (tickerEl) tickerEl.innerHTML = [...tickerPhrases, ...tickerPhrases].map(p => `${p} <span class="sep">✦</span>`).join(' ');

    const breadcrumbEl = document.querySelector('.breadcrumb');
    if (breadcrumbEl) breadcrumbEl.innerHTML = `
        <a href="${d}archive/index.html">archive</a>
        <span class="sep">›</span>
        <a href="${d}archive/index.html">by artist</a>
        <span class="sep">›</span>
        <a href="index.html">bbc</a>`;

    const artistLabelEl = document.getElementById('artist-label');
    if (artistLabelEl) artistLabelEl.textContent = `// bottle boys collective //`;

    const subNavEl = document.getElementById('sub-nav');
    if (subNavEl) subNavEl.innerHTML = [
        `<a href="index.html" class="nav-card ${C.backColor || 'c-back'}">← back</a>`,
        ...(C.siblings || []).map(s =>
            `<a href="${s}.html" class="nav-card ${COLOR_MAP[s] || 'c-cyan'}">${s}</a>`)
    ].join('\n');

    // ── API helpers ──
    const delay = ms => new Promise(r => setTimeout(r, ms));

    function esc(str) {
        return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function fetchWithRetry(url, retries = 4) {
        for (let i = 0; i < retries; i++) {
            let res;
            try { res = await fetch(url); }
            catch (err) { if (i === retries-1) throw err; await delay(1000 * Math.pow(2, i)); continue; }
            if (res.status === 429 || res.status === 503) { await delay(1000 * Math.pow(2, i)); continue; }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }
        throw new Error(`fetchWithRetry failed: ${url}`);
    }

    async function fetchAllReleasesForArtist(artistId) {
        let all = [], offset = 0, total = 0;
        do {
            const data = await fetchWithRetry(`https://musicbrainz.org/ws/2/release?artist=${artistId}&limit=100&offset=${offset}&fmt=json`);
            total = data['release-count'];
            all = all.concat(data.releases);
            offset += 100;
            if (offset < total) await delay(1000);
        } while (offset < total);
        return all;
    }

    (async () => {
        const statusEl = document.getElementById('status-bar');
        const countBar = document.getElementById('count-bar');
        const list     = document.getElementById('releases-list');

        try {
            statusEl.textContent = 'fetching releases for all members…';

            // fetch all artists in parallel, then merge & deduplicate by release ID
            const perArtist = await Promise.all(C.ids.map(id => fetchAllReleasesForArtist(id)));
            const seen = new Set();
            const all  = [];
            for (const batch of perArtist) {
                for (const rel of batch) {
                    if (!seen.has(rel.id)) { seen.add(rel.id); all.push(rel); }
                }
            }

            if (all.length === 0) { statusEl.textContent = 'no releases found.'; return; }

            // sort newest first
            all.sort((a, b) => (b.date || '0000').localeCompare(a.date || '0000'));
            const total = all.length;
            countBar.textContent = `found ${total} release${total !== 1 ? 's' : ''} (newest first):`;

            let completed = 0, failed = 0;

            for (let i = 0; i < all.length; i++) {
                const rel = all[i];
                try {
                    const det = await fetchWithRetry(`https://musicbrainz.org/ws/2/release/${rel.id}?inc=artists+labels+recordings+release-groups&fmt=json`);

                    const artists    = det['artist-credit']?.map(ac => esc(ac.name)).join(', ') || 'various artists';
                    const format     = esc(det.media?.[0]?.format?.toLowerCase() || 'n/a');
                    const trackCount = det.media?.[0]?.['track-count'] ?? 'n/a';
                    const relType    = esc(det['release-group']?.['primary-type']?.toLowerCase() || 'unknown');
                    const disambig   = det.disambiguation ? `<span class="disambiguation"> (${esc(det.disambiguation)})</span>` : '';

                    const labelInfo = det['label-info'] || [];
                    const hasNonMagma = labelInfo.some(li => (li.label?.name || '').toLowerCase() !== 'magmacrunch media');
                    const catalogLabel = hasNonMagma ? 'label & catalog number' : 'catalog number';
                    const catalogNumber = labelInfo.map(li => {
                        const lName = li.label?.name || 'unknown';
                        const cat   = esc(li['catalog-number'] || 'n/a');
                        return lName.toLowerCase() === 'magmacrunch media' ? cat : `${esc(lName)}: ${cat}`;
                    }).join(', ') || 'n/a';

                    let tags = '';
                    if (det['release-group']?.id) {
                        try {
                            const rg = await fetchWithRetry(`https://musicbrainz.org/ws/2/release-group/${det['release-group'].id}?inc=tags&fmt=json`);
                            tags = rg.tags?.map(t => `<span class="tag">${esc(t.name)}</span>`).join('') || '';
                            await delay(500);
                        } catch {}
                    }

                    list.insertAdjacentHTML('beforeend', `
                        <div class="release-card">
                            <div class="album-art">
                                <img src="https://coverartarchive.org/release/${esc(rel.id)}/front-250" alt="" loading="lazy" onerror="this.style.display='none'">
                            </div>
                            <div class="release-info">
                                <h3>
                                    <a href="https://musicbrainz.org/release/${esc(det.id)}" target="_blank" rel="noopener">${esc(det.title)}</a>
                                    ${disambig}
                                </h3>
                                <p><strong>artist(s)</strong>${artists}</p>
                                <p><strong>type</strong>${relType}</p>
                                <p><strong>release date</strong>${esc(det.date || 'unknown')}</p>
                                <p><strong>${catalogLabel}</strong>${catalogNumber}</p>
                                <p><strong>format</strong>${format}</p>
                                <p><strong>tracks</strong>${trackCount}</p>
                                <p><strong>barcode</strong>${esc(det.barcode || 'n/a')}</p>
                                <p><strong>status</strong>${esc(det.status?.toLowerCase() || 'n/a')}</p>
                                ${tags ? `<div style="margin-top:8px"><strong style="font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim);letter-spacing:0.08em;margin-right:6px;">tags</strong>${tags}</div>` : ''}
                            </div>
                        </div>`);
                    completed++;
                } catch {
                    list.insertAdjacentHTML('beforeend', `
                        <div class="release-card">
                            <div class="album-art"></div>
                            <div class="release-info">
                                <h3>${esc(rel.title || 'unknown')}</h3>
                                <p class="error-msg">failed to load — <a href="https://musicbrainz.org/release/${esc(rel.id)}" target="_blank" rel="noopener">view on MusicBrainz</a></p>
                            </div>
                        </div>`);
                    failed++; completed++;
                }
                statusEl.textContent = `loading details… ${completed} of ${total}${failed ? ` (${failed} failed)` : ''}`;
                if (i < all.length - 1) await delay(1000);
            }

            statusEl.textContent = `all ${total} releases loaded!${failed ? ` (${failed} failed — try refreshing)` : ''}`;
        } catch (err) {
            statusEl.textContent = 'error loading releases — check your connection and refresh.';
            console.error('collective releases fetch failed:', err);
        }
    })();
})();
</script>
