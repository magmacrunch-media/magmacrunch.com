<script>
/* ═══════════════════════════════════════════════════════════
   collective_recordings.js  (inline)
   Like artist_recordings.js but fetches multiple artist IDs
   and merges + deduplicates the results before rendering.
   ═══════════════════════════════════════════════════════════ */
(function () {
    const C = window.COLLECTIVE_CONFIG;
    if (!C || !C.ids?.length) { console.error('COLLECTIVE_CONFIG missing or has no ids'); return; }

    const d      = C.depth  || '../../../';
    const accent = C.accent || 'cyan';

    const COLOR_MAP = {
        about: 'c-about', photography: 'c-photography', events: 'c-events', recordings: 'c-recordings', releases: 'c-releases', works: 'c-works',
    };

    const BACK_COLOR_VAR = {
        'c-green':'var(--green)','c-cyan':'var(--cyan)','c-rose':'var(--rose)',
        'c-yellow':'var(--yellow)','c-orange':'var(--orange)','c-purple':'var(--purple)',
        'c-slate':'var(--slate)','c-blue':'var(--blue)','c-magenta':'var(--magenta)',
        'c-darkgreen':'var(--darkgreen)',
    };
    const backColorVar = BACK_COLOR_VAR[C.backColor] || 'var(--orange)';

    const ACCENT_RGB = {
        green:'57,255,110', cyan:'0,245,255', rose:'255,61,110', yellow:'255,224,58',
        orange:'255,124,31', purple:'196,95,255', slate:'136,153,170', blue:'70,120,255',
        magenta:'255,45,120',
    };
    const accentRgb = '120,168,200';
    const accentVar = '#78a8c8';

    // ── styles ──
    const style = document.createElement('style');
    style.textContent = `
        main { flex:1; display:flex; flex-direction:column; align-items:center; padding:72px 20px 60px; }
        .catalog-wrap { width:100%; max-width:960px; animation:fadeUp 0.5s 0.1s ease both; }
        #status-bar { font-family:'Press Start 2P',monospace; font-size:7px; color:var(--bbc-cream); letter-spacing:0.1em; margin-bottom:16px; min-height:18px; }
        #count-bar { font-family:'Press Start 2P',monospace; font-size:8px; color:var(--bbc-mid); letter-spacing:0.08em; margin-bottom:24px; }
        .recording-card { border:1px solid var(--bbc-dark); background:transparent; padding:18px 20px; margin-bottom:12px; transition:border-color 0.15s; }
        .recording-card:hover { border-color:var(--bbc-warm); }
        .recording-card h3 { font-family:'Press Start 2P',monospace; font-size:12px; color:var(--bbc-cream); letter-spacing:0.05em; margin-bottom:12px; line-height:1.7; }
        .recording-card h3 a { color:var(--bbc-warm); text-decoration:none; }
        .recording-card h3 a:hover { color:var(--bbc-warm-light); }
        .video-label { font-family:'Courier Prime',monospace; font-size:12px; color:var(--bbc-warm); font-style:italic; margin-left:6px; }
        .disambiguation { font-family:'Courier Prime',monospace; font-size:12px; color:var(--bbc-mid); font-style:italic; }
        .recording-card p { font-family:'Courier Prime',monospace; font-size:14px; color:var(--bbc-cream); opacity:0.8; margin-bottom:5px; line-height:1.5; }
        .recording-card p strong { font-family:'Press Start 2P',monospace; font-size:8px; color:var(--bbc-mid); letter-spacing:0.08em; margin-right:6px; }
        .recording-card a { color:var(--bbc-warm); text-decoration:none; }
        .recording-card a:hover { color:var(--bbc-warm-light); }
        .tag { display:inline-block; background:var(--bbc-raised); border:1px solid var(--bbc-dark); padding:2px 7px; margin:2px; font-family:'Courier Prime',monospace; font-size:11px; color:var(--bbc-mid); }
        .error-msg { color:var(--bbc-warm-dark); opacity:0.7; }
    `;
    document.head.appendChild(style);

    // ── dynamic stub elements ──
    const tickerPhrases = [C.name, 'recordings', ...(C.ticker || [])];
    const tickerEl = document.getElementById('ticker-content');
    if (tickerEl) tickerEl.innerHTML = [...tickerPhrases, ...tickerPhrases].map(p => `${p} <span class="sep">✦</span>`).join(' ');

    const breadcrumbEl = document.querySelector('.breadcrumb');
    if (breadcrumbEl) breadcrumbEl.innerHTML = `
        <a href="${d}archive/index.html">archive</a>
        <span class="sep">›</span>
        <a href="${d}archive/index.html">by artist</a>
        <span class="sep">›</span>
        <a href="index.html">bbc</a>`;

    const artistLabelEl = document.getElementById('artist-label');
    if (artistLabelEl) artistLabelEl.textContent = `// ${C.name} //`;

    const subNavEl = document.getElementById('sub-nav');
    if (subNavEl) subNavEl.innerHTML = [
        `<a href="index.html" class="nav-card ${C.backColor || 'c-back'}">← back</a>`,
        ...(C.siblings || []).map(s =>
            `<a href="${s}.html" class="nav-card ${COLOR_MAP[s] || 'c-cyan'}">${s}</a>`)
    ].join('\n');

    // ── API helpers ──
    const delay = ms => new Promise(r => setTimeout(r, ms));

    function esc(str) {
        return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtLength(ms) {
        if (!ms) return 'n/a';
        return `${Math.floor(ms/60000)}:${String(Math.floor((ms%60000)/1000)).padStart(2,'0')}`;
    }

    async function fetchWithRetry(url, retries = 4) {
        for (let i = 0; i < retries; i++) {
            let res;
            try { res = await fetch(url); }
            catch (err) { if (i === retries-1) throw err; await delay(1500*(i+1)); continue; }
            if (res.status === 429 || res.status === 503) { await delay(2500*(i+1)); continue; }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }
    }

    // ── fetch all recording stubs for one artist (paginated) ──
    async function fetchAllForArtist(artistId, statusEl) {
        let all = [], offset = 0, hasMore = true;
        while (hasMore) {
            try {
                const data = await fetchWithRetry(`https://musicbrainz.org/ws/2/recording?artist=${artistId}&limit=100&offset=${offset}&fmt=json`);
                all = all.concat(data.recordings || []);
                statusEl.textContent = `fetching recordings… ${all.length} found (${artistId.slice(0,8)}…)`;
                if ((data.recordings || []).length === 100) { offset += 100; await delay(1000); }
                else hasMore = false;
            } catch { hasMore = false; }
        }
        return all;
    }

    (async () => {
        const statusEl = document.getElementById('status-bar');
        const countBar = document.getElementById('count-bar');
        const list     = document.getElementById('recordings-list');

        try {
            // fetch all artists in parallel, then merge & deduplicate by recording ID
            statusEl.textContent = 'fetching recordings for all members…';
            const perArtist = await Promise.all(C.ids.map(id => fetchAllForArtist(id, statusEl)));
            const seen = new Set();
            const all  = [];
            for (const batch of perArtist) {
                for (const rec of batch) {
                    if (!seen.has(rec.id)) { seen.add(rec.id); all.push(rec); }
                }
            }

            const total = all.length;
            if (total === 0) { statusEl.textContent = 'no recordings found.'; return; }

            // shuffle
            all.sort(() => Math.random() - 0.5);
            countBar.textContent = `found ${total} recording${total !== 1 ? 's' : ''} (shuffled):`;

            let completed = 0, failed = 0;

            for (let i = 0; i < all.length; i++) {
                const rec = all[i];
                try {
                    const det = await fetchWithRetry(`https://musicbrainz.org/ws/2/recording/${rec.id}?inc=artists+isrcs+tags+artist-rels+place-rels+releases+work-rels+aliases+recording-rels&fmt=json`);

                    const artists = det['artist-credit']?.map(ac =>
                        `<a href="https://musicbrainz.org/artist/${esc(ac.artist?.id)}" target="_blank" rel="noopener">${esc(ac.name)}</a>`
                    ).join(', ') || 'various artists';

                    const isVideo      = det.video === true;
                    const length       = fmtLength(det.length);
                    const isrcs        = det.isrcs?.map(esc).join(', ') || 'n/a';
                    const firstRelease = esc(det['first-release-date'] || 'unknown');
                    const disambig     = det.disambiguation ? `<span class="disambiguation"> (${esc(det.disambiguation)})</span>` : '';
                    const aliases      = det.aliases?.map(a => a.name).filter(n => n !== det.title).map(esc).join(', ') || '';

                    const works = det.relations?.filter(r => r['target-type'] === 'work' && r.type === 'performance')
                        .map(r => `<a href="https://musicbrainz.org/work/${esc(r.work?.id)}" target="_blank" rel="noopener">${esc(r.work?.title)}</a>${r.attributes?.includes('cover') ? ' [cover]' : ''}`).join(', ') || '';

                    const releases = det.releases?.map(r => {
                        const year = r.date ? ` (${esc(r.date.substring(0,4))})` : '';
                        return `<a href="https://musicbrainz.org/release/${esc(r.id)}" target="_blank" rel="noopener">${esc(r.title)}</a>${year}`;
                    }).join(', ') || '';

                    const recRels = det.relations?.filter(r => r['target-type'] === 'recording').map(r => {
                        let type = r.type;
                        if (r.type === 'remix')   type = r.direction === 'backward' ? 'remix of' : 'has remix';
                        if (r.type === 'live')    type = r.direction === 'backward' ? 'live version of' : 'has live version';
                        if (r.type === 'cover')   type = r.direction === 'backward' ? 'cover of' : 'has cover';
                        if (r.type === 'edit of') type = r.direction === 'backward' ? 'edit of' : 'has edit';
                        if (r.type === 'video')   type = r.direction === 'backward' ? 'music video for' : 'has music video';
                        const year = r.recording?.['first-release-date'] ? ` (${esc(r.recording['first-release-date'].substring(0,4))})` : '';
                        return `${esc(type)}: <a href="https://musicbrainz.org/recording/${esc(r.recording?.id)}" target="_blank" rel="noopener">${esc(r.recording?.title)}</a>${year}`;
                    }).join(', ') || '';

                    const perfMap = new Map();
                    det.relations?.filter(r => r['target-type'] === 'artist' && ['vocal','instrument','performer'].includes(r.type)).forEach(r => {
                        if (!perfMap.has(r.artist.id)) perfMap.set(r.artist.id, { name: r.artist.name, id: r.artist.id, roles: [] });
                        const p = perfMap.get(r.artist.id);
                        if (r.type === 'vocal') p.roles.push(...(r.attributes?.length ? r.attributes.map(a => a.toLowerCase().includes('vocal') ? a : a + ' vocals') : ['vocals']));
                        else if (r.type === 'instrument') p.roles.push(...(r.attributes?.length ? r.attributes : ['instrument']));
                        else p.roles.push(...(r.attributes?.length ? r.attributes : [r.type]));
                    });
                    const performers = Array.from(perfMap.values()).map(p =>
                        `<a href="https://musicbrainz.org/artist/${esc(p.id)}" target="_blank" rel="noopener">${esc(p.name)}</a>${p.roles.length ? ` (${p.roles.map(esc).join(', ')})` : ''}`
                    ).join(', ');

                    const production = det.relations?.filter(r => r['target-type'] === 'artist' && ['engineer','mix','producer','recording','mastering'].includes(r.type))
                        .map(r => `<a href="https://musicbrainz.org/artist/${esc(r.artist?.id)}" target="_blank" rel="noopener">${esc(r.artist?.name)}</a> (${esc(r.type)})`).join(', ') || '';

                    const recordedAt = det.relations?.filter(r => r['target-type'] === 'place' && r.type === 'recorded at')
                        .map(r => `<a href="https://musicbrainz.org/place/${esc(r.place?.id)}" target="_blank" rel="noopener">${esc(r.place?.name)}</a>${r.begin ? ` (${esc(r.begin)})` : ''}`).join(', ') || '';

                    const tags = det.tags?.map(t => `<span class="tag">${esc(t.name)}</span>`).join('') || '';

                    list.insertAdjacentHTML('beforeend', `
                        <div class="recording-card">
                            <h3>
                                <a href="https://musicbrainz.org/recording/${esc(det.id)}" target="_blank" rel="noopener">${esc(det.title)}</a>
                                ${isVideo ? '<span class="video-label">[music video]</span>' : ''}
                                ${disambig}
                            </h3>
                            ${aliases    ? `<p><strong>also known as</strong>${aliases}</p>` : ''}
                            <p><strong>artist(s)</strong>${artists}</p>
                            ${works      ? `<p><strong>work(s)</strong>${works}</p>` : ''}
                            ${recRels    ? `<p><strong>related recordings</strong>${recRels}</p>` : ''}
                            ${performers ? `<p><strong>performers</strong>${performers}</p>` : ''}
                            ${production ? `<p><strong>production</strong>${production}</p>` : ''}
                            ${recordedAt ? `<p><strong>recorded at</strong>${recordedAt}</p>` : ''}
                            <p><strong>first release</strong>${firstRelease}</p>
                            <p><strong>length</strong>${length}</p>
                            <p><strong>isrc</strong>${isrcs}</p>
                            ${releases   ? `<p><strong>appears on</strong>${releases}</p>` : ''}
                            ${tags       ? `<div style="margin-top:8px"><strong style="font-family:'Press Start 2P',monospace;font-size:6px;color:var(--dim);letter-spacing:0.08em;margin-right:6px;">tags</strong>${tags}</div>` : ''}
                        </div>`);
                    completed++;
                } catch {
                    list.insertAdjacentHTML('beforeend', `
                        <div class="recording-card">
                            <h3>${esc(rec.title || 'unknown')}</h3>
                            <p class="error-msg">failed to load — <a href="https://musicbrainz.org/recording/${esc(rec.id)}" target="_blank" rel="noopener">view on MusicBrainz</a></p>
                        </div>`);
                    failed++; completed++;
                }
                statusEl.textContent = `loading details… ${completed} of ${total}${failed ? ` (${failed} failed)` : ''}`;
                if (i < all.length - 1) await delay(1000);
            }

            statusEl.textContent = `all ${total} recordings loaded!${failed ? ` (${failed} failed — try refreshing)` : ''}`;
        } catch (err) {
            statusEl.textContent = 'error loading recordings — check your connection and refresh.';
            console.error('collective recordings fetch failed:', err);
        }
    })();
})();
</script>
</body>
