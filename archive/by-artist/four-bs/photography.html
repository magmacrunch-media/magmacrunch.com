<script src="../../../nav.js"></script>
<script>
(function() {
    const strip = document.getElementById('4bStrip');
    const wrap  = document.getElementById('4bStripWrap');
    const hint  = document.getElementById('4bScrollHint');
    let isDown = false, startX, scrollLeft;

    strip.addEventListener('mousedown', e => {
        isDown = true; strip.classList.add('dragging');
        startX = e.pageX - strip.offsetLeft;
        scrollLeft = strip.scrollLeft;
    });
    strip.addEventListener('mouseleave', () => { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mouseup',    () => { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mousemove',  e => {
        if (!isDown) return;
        e.preventDefault();
        strip.scrollLeft = scrollLeft - (e.pageX - strip.offsetLeft - startX) * 1.2;
    });
    strip.addEventListener('scroll', () => {
        if (strip.scrollLeft > 30) wrap.classList.add('scrolled');
    }, { passive: true });
})();
(function() {
    const items   = document.querySelectorAll('#4bStrip .photo-item');
    const lb      = document.getElementById('4bLightbox');
    const lbImg   = document.getElementById('4bLbImg');
    const lbCap   = document.getElementById('4bLbCap');
    const lbCount = document.getElementById('4bLbCounter');
    const strip   = document.getElementById('4bStrip');

    const photos = Array.from(items).map(item => ({
        src:     item.querySelector('img').src,
        alt:     item.querySelector('img').alt,
        caption: item.querySelector('.photo-caption').textContent.trim()
    }));

    let current = 0;

    function open(index) {
        current = index;
        show();
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function close() {
        lb.classList.remove('open');
        document.body.style.overflow = '';
    }
    function show() {
        lbImg.src = photos[current].src;
        lbImg.alt = photos[current].alt;
        lbCap.textContent = photos[current].caption;
        lbCount.textContent = `${current + 1} / ${photos.length}`;
        const wrap = lbImg.closest('.lb-img-wrap');
        wrap.classList.remove('vertical');
        if (lbImg.complete && lbImg.naturalWidth && lbImg.naturalHeight) {
            if (lbImg.naturalHeight > lbImg.naturalWidth) wrap.classList.add('vertical');
        }
        lbImg.onload = () => {
            if (lbImg.naturalHeight > lbImg.naturalWidth) wrap.classList.add('vertical');
            else wrap.classList.remove('vertical');
        };
    }
    function nav(dir) {
        current = (current + dir + photos.length) % photos.length;
        show();
    }

    items.forEach(item => {
        item.addEventListener('click', () => {
            if (!strip.classList.contains('dragging'))
                open(parseInt(item.dataset.index));
        });
    });

    document.getElementById('4bLbClose').addEventListener('click', close);
    document.getElementById('4bLbPrev').addEventListener('click', () => nav(-1));
    document.getElementById('4bLbNext').addEventListener('click', () => nav(1));
    lb.addEventListener('click', e => { if (e.target === lb) close(); });
    document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape')      close();
        if (e.key === 'ArrowLeft')   nav(-1);
        if (e.key === 'ArrowRight')  nav(1);
    });
})();
</script>
