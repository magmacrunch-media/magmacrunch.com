<div class="photo-lightbox" id="jmLightbox">
    <button class="lb-close" id="jmLbClose">[ close ]</button>
    <div class="lb-img-wrap"><img id="jmLbImg" src="" alt=""></div>
    <div class="lb-cap" id="jmLbCap"></div>
    <div class="lb-nav">
        <button class="lb-btn" id="jmLbPrev">← prev</button>
        <span class="lb-counter" id="jmLbCounter"></span>
        <button class="lb-btn" id="jmLbNext">next →</button>
    </div>
</div>

<script src="../../../nav.js"></script>
<script>
(function() {
    const strip = document.getElementById('jmStrip');
    const wrap  = document.getElementById('jmStripWrap');
    const hint  = document.getElementById('jmScrollHint');
    let isDown = false, startX, scrollLeft;

    strip.addEventListener('mousedown', e => { isDown = true; strip.classList.add('dragging'); startX = e.pageX - strip.offsetLeft; scrollLeft = strip.scrollLeft; });
    strip.addEventListener('mouseleave', () => { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mouseup',    () => { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mousemove',  e => { if (!isDown) return; e.preventDefault(); strip.scrollLeft = scrollLeft - (e.pageX - strip.offsetLeft - startX) * 1.2; });
    strip.addEventListener('scroll', () => { if (strip.scrollLeft > 30) wrap.classList.add('scrolled'); }, { passive: true });
})();
(function() {
    const items   = document.querySelectorAll('#jmStrip .photo-item');
    const lb      = document.getElementById('jmLightbox');
    const lbImg   = document.getElementById('jmLbImg');
    const lbCap   = document.getElementById('jmLbCap');
    const lbCount = document.getElementById('jmLbCounter');
    const strip   = document.getElementById('jmStrip');

    const photos = Array.from(items).map(item => ({
        src:     item.querySelector('img').src,
        alt:     item.querySelector('img').alt,
        caption: item.querySelector('.photo-caption').textContent.trim()
    }));

    let current = 0;

    function open(index) {
        current = index;
        show();
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function close() {
        lb.classList.remove('open');
        document.body.style.overflow = '';
    }
    function show() {
        lbImg.src = photos[current].src;
        lbImg.alt = photos[current].alt;
        lbCap.textContent = photos[current].caption;
        lbCount.textContent = `${current + 1} / ${photos.length}`;
    }
    function nav(dir) {
        current = (current + dir + photos.length) % photos.length;
        show();
    }

    items.forEach(item => {
        item.addEventListener('click', () => {
            if (!strip.classList.contains('dragging'))
                open(parseInt(item.dataset.index));
        });
    });

    document.getElementById('jmLbClose').addEventListener('click', close);
    document.getElementById('jmLbPrev').addEventListener('click', () => nav(-1));
    document.getElementById('jmLbNext').addEventListener('click', () => nav(1));
    lb.addEventListener('click', e => { if (e.target === lb) close(); });
    document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape')      close();
        if (e.key === 'ArrowLeft')   nav(-1);
        if (e.key === 'ArrowRight')  nav(1);
    });
})();
</script>
</body>
