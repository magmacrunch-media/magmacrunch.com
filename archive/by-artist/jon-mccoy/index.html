<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jon McCoy — archive — magmacrunch media</title>
    <link rel="icon" type="image/jpeg" href="../../../assets/logo.jpg">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../../assets/archive.css">
    <link rel="stylesheet" href="jm-shared.css">
    <style>
        /* ══ PAGE: by-artist / jon-mccoy ══ */

        main { position: relative; padding: 0; }

        /* ── BREADCRUMB ── */
        body.jm-page .breadcrumb a { color: var(--jm-muted); }
        body.jm-page .breadcrumb a:hover { color: var(--jm-cream); }
        body.jm-page .breadcrumb .sep { color: var(--jm-muted); opacity: 0.6; }
        body.jm-page .breadcrumb .current { color: var(--jm-muted); }

        /* ── ARTIST HERO ── */
        .artist-hero {
            width: 100%;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            margin-bottom: 0;
        }
        .artist-hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 55%;
            filter: saturate(0.9) brightness(0.72);
        }
        .artist-hero-tint {
            position: absolute;
            inset: 0;
            background: rgba(122, 144, 128, 0.08);
            mix-blend-mode: screen;
        }
        .artist-hero-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(14,16,20,0.0)  0%,
                rgba(14,16,20,0.0)  85%,
                rgba(14,16,20,0.85) 100%
            );
        }
        .hero-inner {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            padding: 0 20px 36px;
            display: flex;
            flex-direction: column;
        }

        /* ── ARTIST HEADER ── */
        .artist-header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 0;
            animation: fadeUp 0.5s ease both;
        }
        .artist-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: var(--jm-rose);
            letter-spacing: 0.2em;
            margin-bottom: 12px;
            opacity: 0.85;
        }
        .artist-name {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(14px, 3vw, 24px);
            color: var(--jm-cream);
            line-height: 1.6;
            letter-spacing: 0.06em;
            text-shadow:
                0 0 28px rgba(184, 152, 152, 0.65),
                0 2px 10px rgba(0, 0, 0, 0.95);
            margin-bottom: 6px;
        }
        .artist-abbr {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: var(--jm-rose);
            letter-spacing: 0.15em;
            margin-top: -8px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        /* ── DIVIDER ── */
        .divider {
            width: 100%;
            max-width: 900px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--jm-rose), var(--jm-taupe), var(--jm-rose), transparent);
            margin: 8px 0 40px;
            opacity: 0.4;
        }

        /* ── LAYOUT ── */
        .artist-body {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            animation: fadeUp 0.5s 0.1s ease both;
        }

        /* ── SECTION LABELS ── */
        .section-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--jm-rose);
            letter-spacing: 0.15em;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--jm-rose);
            opacity: 0.9;
        }

        /* ── BIO ── */
        .bio p {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            color: var(--jm-sand);
            line-height: 1.8;
            margin-bottom: 16px;
            opacity: 0.9;
        }
        .bio .link-row {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .ext-link {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: var(--jm-sage);
            text-decoration: none;
            letter-spacing: 0.1em;
            padding: 7px 12px;
            border: 1px solid var(--jm-sage);
            transition: background 0.15s, color 0.15s;
        }
        .ext-link:hover { background: var(--jm-sage); color: var(--jm-deep); }

        /* ── PHOTO CAROUSEL PLACEHOLDER ── */
        .carousel-wrap {
            width: 100%;
            max-width: 900px;
            margin-bottom: 48px;
            animation: fadeUp 0.5s 0.2s ease both;
        }
        .carousel-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--jm-rose);
            letter-spacing: 0.12em;
            margin-bottom: 14px;
            opacity: 0.8;
        }
        .carousel-empty {
            border: 1px dashed #1a2a2a;
            padding: 32px;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--jm-muted);
            letter-spacing: 0.1em;
            background: rgba(0,0,0,0.2);
        }

        /* ── MUSIC VIDEOS ── */
        .videos-wrap {
            width: 100%;
            max-width: 900px;
            margin-bottom: 48px;
            animation: fadeUp 0.5s 0.18s ease both;
        }
        .mini-video-list {
            width: 100%;
            border: 1px solid #1a1a2a;
        }
        .mini-video-entry {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            border-bottom: 1px solid #1a1a2a;
            cursor: pointer;
            min-height: 100px;
        }
        .mini-video-entry:last-child { border-bottom: none; }
        .mini-video-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: brightness(0.25) saturate(0.6);
            transition: filter 0.3s ease;
            z-index: 0;
        }
        .mini-video-entry:hover .mini-video-bg,
        .mini-video-entry.active .mini-video-bg { filter: brightness(0.15) saturate(0.4); }
        .mini-video-entry::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(8,8,8,0.5) 0%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }
        .mini-video-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            width: 100%;
        }
        .mini-thumb {
            flex-shrink: 0;
            width: 120px;
            aspect-ratio: 16/9;
            background: #000;
            border: 1px solid #2a2a3a;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .mini-video-entry:hover .mini-thumb { border-color: var(--jm-sage); }
        .mini-video-entry.active .mini-thumb { border-color: var(--jm-taupe); }
        .mini-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .mini-play-btn {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
        }
        .mini-play-icon {
            width: 28px; height: 28px;
            border: 2px solid var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, transform 0.2s, background 0.2s;
        }
        .mini-play-icon::after {
            content: '';
            display: block;
            width: 0; height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 9px solid var(--white);
            margin-left: 2px;
            transition: border-left-color 0.2s;
        }
        .mini-video-entry:hover .mini-play-icon {
            border-color: var(--jm-sage);
            background: rgba(122,144,128,0.2);
            transform: scale(1.1);
        }
        .mini-video-entry:hover .mini-play-icon::after { border-left-color: var(--jm-sage); }
        .mini-video-entry.active .mini-play-icon { border-color: var(--jm-taupe); }
        .mini-iframe-wrap {
            display: none;
            width: 120px;
            aspect-ratio: 16/9;
            flex-shrink: 0;
            border: 1px solid var(--jm-taupe);
        }
        .mini-iframe-wrap iframe { width: 100%; height: 100%; display: block; border: none; }
        .mini-video-entry.active .mini-thumb       { display: none; }
        .mini-video-entry.active .mini-iframe-wrap { display: block; }
        .mini-video-meta { flex: 1; min-width: 0; }
        .mini-video-year {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: var(--jm-sage);
            letter-spacing: 0.12em;
            margin-bottom: 6px;
            opacity: 0.8;
        }
        .mini-video-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(7px, 1.2vw, 10px);
            color: var(--jm-cream);
            letter-spacing: 0.05em;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .mini-yt-link {
            font-family: 'Press Start 2P', monospace;
            font-size: 5px;
            color: var(--jm-muted);
            text-decoration: none;
            border: 1px solid #2a2a3a;
            padding: 3px 8px;
            letter-spacing: 0.06em;
            transition: color 0.15s, border-color 0.15s;
            display: inline-block;
        }
        .mini-yt-link:hover { color: var(--jm-sage); border-color: var(--jm-sage); }

        @media (max-width: 640px) {
            .sub-nav { flex-direction: column; }
            .mini-thumb, .mini-iframe-wrap { width: 90px; }
        }

        /* ── FOOTER ── */
        footer { position: absolute; bottom: 0; left: 0; right: 0; border-top: none; z-index: 2; }
    </style>
</head>
