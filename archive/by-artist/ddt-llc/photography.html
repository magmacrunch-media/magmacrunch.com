<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDT LLC — photography — magmacrunch media</title>
    <link rel="icon" type="image/jpeg" href="../../../assets/logo.jpg">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../../assets/archive.css">
    <link rel="stylesheet" href="ddt-shared.css">
    <link rel="stylesheet" href="ddt-photography.css">
</head>
<body class="ddt-page ddt-photography-page">

<nav id="auto-nav" data-depth="../../../"></nav>

<main>
    <div class="breadcrumb">
        <a href="../../../archive/">archive</a>
        <span class="sep">›</span>
        <a href="../../../archive/by-artist/">by artist</a>
        <span class="sep">›</span>
        <a href="./">ddt</a>
    </div>

    <div class="page-header">
        <div class="artist-label">// DDT LLC //</div>
        <div class="page-title">PHOTOGRAPHY</div>
        <div class="sub-nav">
            <a href="./"         class="nav-card c-back">← back</a>
            <a href="about.html"        class="nav-card c-about">about</a>
            <a href="events.html"       class="nav-card c-events">events</a>
            <a href="links.html"        class="nav-card c-links">links</a>
            <a href="releases.html"      class="nav-card c-releases">releases</a>
        </div>
    </div>

    <div class="divider"></div>

    <div class="photo-strip-section">
        <div class="photo-strip-wrap" id="ddtStripWrap">
            <div class="photo-strip" id="ddtStrip">
                <div class="photo-item wide" data-index="0">
                    <img src="../../../assets/photos/ddt/ddt-llc.png" alt="DDT LLC">
                    <div class="photo-caption">ddt llc</div>
                </div>
                <div class="photo-item wide" data-index="1">
                    <img src="../../../assets/photos/ddt/13315308_10206838407101887_4489703493977700708_n.jpg" alt="DDT LLC">
                    <div class="photo-caption">ddt llc</div>
                </div>
                <div class="photo-item wide" data-index="2">
                    <img src="../../../assets/photos/ddt/IMG_3102.JPG" alt="DDT LLC" loading="lazy">
                    <div class="photo-caption">IMG 3102</div>
                </div>
                <div class="photo-item wide" data-index="3">
                    <img src="../../../assets/photos/ddt/IMG_3104.JPG" alt="DDT LLC" loading="lazy">
                    <div class="photo-caption">IMG 3104</div>
                </div>
                <div class="photo-item wide" data-index="4">
                    <img src="../../../assets/photos/ddt/IMG_3105.JPG" alt="DDT LLC" loading="lazy">
                    <div class="photo-caption">IMG 3105</div>
                </div>
            </div>
            <div class="strip-scroll-hint" id="ddtScrollHint">scroll →</div>
        </div>
    </div>

    <div class="photo-lightbox" id="ddtLightbox">
        <button class="lb-close" id="ddtLbClose">[ close ]</button>
        <div class="lb-img-wrap"><img id="ddtLbImg" src="" alt=""></div>
        <div class="lb-cap" id="ddtLbCap"></div>
        <div class="lb-nav">
            <button class="lb-btn" id="ddtLbPrev">← prev</button>
            <span class="lb-counter" id="ddtLbCounter"></span>
            <button class="lb-btn" id="ddtLbNext">next →</button>
        </div>
    </div>
</main>

<footer>&copy; 2026 <span>magmacrunch media</span></footer>

<script src="../../../nav.js"></script>
<script>
(function() {
    var strip = document.getElementById('ddtStrip');
    var wrap  = document.getElementById('ddtStripWrap');
    var isDown = false, startX, scrollLeft;
    strip.addEventListener('mousedown', function(e) { isDown = true; strip.classList.add('dragging'); startX = e.pageX - strip.offsetLeft; scrollLeft = strip.scrollLeft; });
    strip.addEventListener('mouseleave', function() { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mouseup',    function() { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mousemove',  function(e) { if (!isDown) return; e.preventDefault(); strip.scrollLeft = scrollLeft - (e.pageX - strip.offsetLeft - startX) * 1.2; });
    strip.addEventListener('scroll', function() { if (strip.scrollLeft > 30) wrap.classList.add('scrolled'); }, { passive: true });
})();

(function() {
    var items   = document.querySelectorAll('#ddtStrip .photo-item');
    var lb      = document.getElementById('ddtLightbox');
    var lbImg   = document.getElementById('ddtLbImg');
    var lbCap   = document.getElementById('ddtLbCap');
    var lbCount = document.getElementById('ddtLbCounter');
    var strip   = document.getElementById('ddtStrip');
    var photos  = Array.from(items).map(function(item) { return { src: item.querySelector('img').src, alt: item.querySelector('img').alt, caption: item.querySelector('.photo-caption').textContent.trim() }; });
    var current = 0;
    function open(index) { current = index; show(); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function close() { lb.classList.remove('open'); document.body.style.overflow = ''; }
    function show() {
        lbImg.src = photos[current].src;
        lbImg.alt = photos[current].alt;
        lbCap.textContent = photos[current].caption;
        lbCount.textContent = (current + 1) + ' / ' + photos.length;
        var wrap = lbImg.closest('.lb-img-wrap');
        wrap.classList.remove('vertical');
        if (lbImg.complete && lbImg.naturalWidth && lbImg.naturalHeight) {
            if (lbImg.naturalHeight > lbImg.naturalWidth) wrap.classList.add('vertical');
        }
        lbImg.onload = function() {
            if (lbImg.naturalHeight > lbImg.naturalWidth) wrap.classList.add('vertical');
            else wrap.classList.remove('vertical');
        };
    }
    function nav(dir) { current = (current + dir + photos.length) % photos.length; show(); }
    items.forEach(function(item) { item.addEventListener('click', function() { if (!strip.classList.contains('dragging')) open(parseInt(item.dataset.index)); }); });
    document.getElementById('ddtLbClose').addEventListener('click', close);
    document.getElementById('ddtLbPrev').addEventListener('click', function() { nav(-1); });
    document.getElementById('ddtLbNext').addEventListener('click', function() { nav(1); });
    lb.addEventListener('click', function(e) { if (e.target === lb) close(); });
    document.addEventListener('keydown', function(e) { if (!lb.classList.contains('open')) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') nav(-1); if (e.key === 'ArrowRight') nav(1); });
})();
</script>
</body>
</html>
