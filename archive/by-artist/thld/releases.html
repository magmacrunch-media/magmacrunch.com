<script>
(function () {
    const C = window.COLLECTIVE_CONFIG;
    if (!C || !C.ids?.length) { console.error('COLLECTIVE_CONFIG missing or has no ids'); return; }

    const d      = C.depth  || '../../../';
    const accent = C.accent || 'rose';

    const COLOR_MAP = {
        about: 'c-about', events: 'c-events', 'music-videos': 'c-music-videos', photography: 'c-photography', recordings: 'c-recordings', releases: 'c-releases', works: 'c-works',
    };

    const ACCENT_RGB = {
        green:'57,255,110', cyan:'224,122,47', rose:'201,75,26', yellow:'240,192,96',
        orange:'224,122,47', purple:'106,88,120', slate:'74,112,104', blue:'90,120,64',
        magenta:'255,45,120', accent:'201,75,26',
    };
    const accentRgb = ACCENT_RGB[accent] || '201,75,26';
    const accentVar = `var(--thld-${accent})`;

    const style = document.createElement('style');
    document.head.appendChild(style);

    const tickerPhrases = [C.name, 'releases', ...(C.ticker || [])];
    const tickerEl = document.getElementById('ticker-content');
    if (tickerEl) tickerEl.innerHTML = [...tickerPhrases, ...tickerPhrases].map(p => `${p} <span class="sep">✦</span>`).join(' ');

    const breadcrumbEl = document.querySelector('.breadcrumb');
    if (breadcrumbEl) breadcrumbEl.innerHTML = `
        <a href="${d}archive/index.html">archive</a>
        <span class="sep">›</span>
        <a href="${d}archive/by-artist/index.html">by artist</a>
        <span class="sep">›</span>
        <a href="index.html">${C.abbr.toLowerCase()}</a>`;

    const artistLabelEl = document.getElementById('artist-label');
    if (artistLabelEl) artistLabelEl.textContent = `// ${C.name} //`;

    const subNavEl = document.getElementById('sub-nav');
    if (subNavEl) subNavEl.innerHTML = [
        `<a href="index.html" class="nav-card c-back c-accent">← back</a>`,
        ...(C.siblings || []).map(s =>
            `<a href="${s}.html" class="nav-card ${COLOR_MAP[s] || 'c-cyan'}">${s}</a>`)
    ].join('\n');

    const delay = ms => new Promise(r => setTimeout(r, ms));
    function esc(str) {
        return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    async function fetchWithRetry(url, retries = 4) {
        for (let i = 0; i < retries; i++) {
            let res;
            try { res = await fetch(url); }
            catch (err) { if (i === retries-1) throw err; await delay(1000 * Math.pow(2, i)); continue; }
            if (res.status === 429 || res.status === 503) { await delay(1000 * Math.pow(2, i)); continue; }
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }
        throw new Error(`fetchWithRetry failed: ${url}`);
    }
    async function fetchAllReleasesForArtist(artistId) {
        let all = [], offset = 0, total = 0;
        do {
            const data = await fetchWithRetry(`https://musicbrainz.org/ws/2/release?artist=${artistId}&limit=100&offset=${offset}&fmt=json`);
            total = data['release-count'];
            all = all.concat(data.releases);
            offset += 100;
            if (offset < total) await delay(1000);
        } while (offset < total);
        return all;
    }
    (async () => {
        const statusEl = document.getElementById('status-bar');
        const countBar = document.getElementById('count-bar');
        const list     = document.getElementById('releases-list');
        try {
            statusEl.textContent = 'fetching releases for all members…';
            const perArtist = await Promise.all(C.ids.map(id => fetchAllReleasesForArtist(id)));
            const seen = new Set();
            const all  = [];
            for (const batch of perArtist) {
                for (const rel of batch) {
                    if (!seen.has(rel.id)) { seen.add(rel.id); all.push(rel); }
                }
            }
            if (all.length === 0) { statusEl.textContent = 'no releases found.'; return; }
            all.sort((a, b) => (b.date || '0000').localeCompare(a.date || '0000'));
            const total = all.length;
            countBar.textContent = `found ${total} release${total !== 1 ? 's' : ''} (newest first):`;
            let completed = 0, failed = 0;
            for (let i = 0; i < all.length; i++) {
                const rel = all[i];
                try {
                    const det = await fetchWithRetry(`https://musicbrainz.org/ws/2/release/${rel.id}?inc=artists+labels+recordings+release-groups&fmt=json`);
                    const artists    = det['artist-credit']?.map(ac => esc(ac.name)).join(', ') || 'various artists';
                    const format     = esc(det.media?.[0]?.format?.toLowerCase() || 'n/a');
                    const trackCount = det.media?.[0]?.['track-count'] ?? 'n/a';
                    const relType    = esc(det['release-group']?.['primary-type']?.toLowerCase() || 'unknown');
                    const disambig   = det.disambiguation ? `<span class="disambiguation"> (${esc(det.disambiguation)})</span>` : '';
                    const labelInfo = det['label-info'] || [];
                    const hasNonMagma = labelInfo.some(li => (li.label?.name || '').toLowerCase() !== 'magmacrunch media');
                    const catalogLabel = hasNonMagma ? 'label & catalog number' : 'catalog number';
                    const catalogNumber = labelInfo.map(li => {
                        const lName = li.label?.name || 'unknown';
                        const cat   = esc(li['catalog-number'] || 'n/a');
                        return lName.toLowerCase() === 'magmacrunch media' ? cat : `${esc(lName)}: ${cat}`;
                    }).join(', ') || 'n/a';
                    let tags = '';
                    if (det['release-group']?.id) {
                        try {
                            const rg = await fetchWithRetry(`https://musicbrainz.org/ws/2/release-group/${det['release-group'].id}?inc=tags&fmt=json`);
                            tags = rg.tags?.map(t => `<span class="tag">${esc(t.name)}</span>`).join('') || '';
                            await delay(500);
                        } catch {}
                    }
                    list.insertAdjacentHTML('beforeend', `
                        <div class="release-card">
                            <div class="album-art">
                                <img src="https://coverartarchive.org/release/${esc(rel.id)}/front-250" alt="" loading="lazy" onerror="this.style.display='none'">
                            </div>
                            <div class="release-info">
                                <h3>
                                    <a href="https://musicbrainz.org/release/${esc(det.id)}" target="_blank" rel="noopener">${esc(det.title)}</a>
                                    ${disambig}
                                </h3>
                                <p><strong>artist(s)</strong>${artists}</p>
                                <p><strong>type</strong>${relType}</p>
                                <p><strong>release date</strong>${esc(det.date || 'unknown')}</p>
                                <p><strong>${catalogLabel}</strong>${catalogNumber}</p>
                                <p><strong>format</strong>${format}</p>
                                <p><strong>tracks</strong>${trackCount}</p>
                                <p><strong>barcode</strong>${esc(det.barcode || 'n/a')}</p>
                                <p><strong>status</strong>${esc(det.status?.toLowerCase() || 'n/a')}</p>
                                ${tags ? `<div style="margin-top:8px"><strong style="font-family:'Press Start 2P',monospace;font-size:6px;color:var(--thld-muted);letter-spacing:0.08em;margin-right:6px;">tags</strong>${tags}</div>` : ''}
                            </div>
                        </div>`);
                    completed++;
                } catch {
                    list.insertAdjacentHTML('beforeend', `
                        <div class="release-card">
                            <div class="album-art"></div>
                            <div class="release-info">
                                <h3>${esc(rel.title || 'unknown')}</h3>
                                <p class="error-msg">failed to load — <a href="https://musicbrainz.org/release/${esc(rel.id)}" target="_blank" rel="noopener">view on MusicBrainz</a></p>
                            </div>
                        </div>`);
                    failed++; completed++;
                }
                statusEl.textContent = `loading details… ${completed} of ${total}${failed ? ` (${failed} failed)` : ''}`;
                if (i < all.length - 1) await delay(1000);
            }
            statusEl.textContent = `all ${total} releases loaded!${failed ? ` (${failed} failed — try refreshing)` : ''}`;
        } catch (err) {
            statusEl.textContent = 'error loading releases — check your connection and refresh.';
            console.error('collective releases fetch failed:', err);
        }
    })();
})();
</script>
<script>
const RELEASES = [
    { title: "HELLO, WORLD / LOVE, SPACE",        year: "2015", img: "../../../assets/album-art/hello-world-love-space.jpg" },
    { title: "Its Twenty-Sixteen",                 year: "2016", img: "../../../assets/album-art/its-2016.jpg" },
    { title: "Pine",                               year: "2016", img: "../../../assets/album-art/pine.jpg" },
    { title: "Lights",                             year: "2016", img: "../../../assets/album-art/lights.jpg" },
    { title: "Adenosine",                          year: "2016", img: "../../../assets/album-art/adenosine.jpg" },
    { title: "Seeing Stars",                       year: "2016", img: "../../../assets/album-art/seeing-stars.jpg" },
    { title: "TEXAS TOAST MAGMA CRUNCH",           year: "2016", img: "../../../assets/album-art/texas-toast-magma-crunch.jpg" },
    { title: "THLD432",                            year: "2016", img: "../../../assets/album-art/THLD432.jpg" },
    { title: "Martial Law in Garrison Oaks",       year: "2018", img: "../../../assets/album-art/martial-law-in-garrison-oaks.jpg" },
    { title: "Hazardous Metals in Ambient Air",    year: "2018", img: "../../../assets/album-art/hazardous-metals-in-ambient-air.jpg" },
    { title: "Pompous Fanfare for All Occasions",  year: "2019", img: "../../../assets/album-art/pompous-fanfare-for-all-occasions.jpg" },
    { title: "THLD432'",                          year: "2020", img: "../../../assets/album-art/THLD432-prime.jpg" },
];

const imgWrap  = document.getElementById('thldCarouselImg');
const dotsWrap = document.getElementById('thldDots');
const nowTitle = document.getElementById('thldNowTitle');
const nowYear  = document.getElementById('thldNowYear');
const pauseBtn = document.getElementById('thldPause');
const prevBtn  = document.getElementById('thldPrev');
const nextBtn  = document.getElementById('thldNext');

let current = 0, autoTimer = null, paused = false;
const INTERVAL = 3000;
const single = RELEASES.length === 1;

const imgs = RELEASES.map((r, i) => {
    const img = document.createElement('img');
    img.src = r.img; img.alt = r.title;
    img.loading = i === 0 ? 'eager' : 'lazy';
    if (i === 0) img.classList.add('visible');
    imgWrap.insertBefore(img, imgWrap.querySelector('.carousel-arrow'));
    return img;
});

const dots = single ? [] : RELEASES.map((r, i) => {
    const dot = document.createElement('button');
    dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', r.title);
    dot.addEventListener('click', () => goTo(i, true));
    dotsWrap.appendChild(dot);
    return dot;
});

function goTo(index, userInitiated = false) {
    imgs[current].classList.remove('visible');
    dots[current].classList.remove('active');
    current = ((index % RELEASES.length) + RELEASES.length) % RELEASES.length;
    imgs[current].classList.add('visible');
    dots[current].classList.add('active');
    nowTitle.textContent = RELEASES[current].title;
    nowYear.textContent  = RELEASES[current].year;
    if (userInitiated) { clearInterval(autoTimer); if (!paused) startAuto(); }
}

function startAuto() { autoTimer = setInterval(() => goTo(current + 1), INTERVAL); }

prevBtn.addEventListener('click', () => goTo(current - 1, true));
nextBtn.addEventListener('click', () => goTo(current + 1, true));

pauseBtn.addEventListener('click', () => {
    paused = !paused;
    if (paused) { clearInterval(autoTimer); pauseBtn.textContent = '▶'; }
    else { startAuto(); pauseBtn.textContent = '⏸'; }
});

imgWrap.addEventListener('mouseenter', () => clearInterval(autoTimer));
imgWrap.addEventListener('mouseleave', () => { if (!paused) startAuto(); });

goTo(0);
startAuto();

if (single) {
    prevBtn.classList.add('hidden');
    nextBtn.classList.add('hidden');
    pauseBtn.classList.add('hidden');
}
</script>
</body>
