<script>
(function() {
    const strip = document.getElementById('cprStrip');
    const wrap  = document.getElementById('cprStripWrap');
    let isDown = false, startX, scrollLeft;
    strip.addEventListener('mousedown', e => { isDown = true; strip.classList.add('dragging'); startX = e.pageX - strip.offsetLeft; scrollLeft = strip.scrollLeft; });
    strip.addEventListener('mouseleave', () => { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mouseup',    () => { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mousemove',  e => { if (!isDown) return; e.preventDefault(); strip.scrollLeft = scrollLeft - (e.pageX - strip.offsetLeft - startX) * 1.2; });
    strip.addEventListener('scroll', () => { if (strip.scrollLeft > 30) wrap.classList.add('scrolled'); }, { passive: true });
})();

(function() {
    const items   = document.querySelectorAll('#cprStrip .photo-item');
    const lb      = document.getElementById('cprLightbox');
    const lbImg   = document.getElementById('cprLbImg');
    const lbCap   = document.getElementById('cprLbCap');
    const lbCount = document.getElementById('cprLbCounter');
    const strip   = document.getElementById('cprStrip');
    const photos  = Array.from(items).map(item => ({ src: item.querySelector('img').src, alt: item.querySelector('img').alt, caption: item.querySelector('.photo-caption').textContent.trim() }));
    let current = 0;
    function open(index) { current = index; show(); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function close() { lb.classList.remove('open'); document.body.style.overflow = ''; }
    function show() { lbImg.src = photos[current].src; lbImg.alt = photos[current].alt; lbCap.textContent = photos[current].caption; lbCount.textContent = `${current + 1} / ${photos.length}`; }
    function nav(dir) { current = (current + dir + photos.length) % photos.length; show(); }
    items.forEach(item => { item.addEventListener('click', () => { if (!strip.classList.contains('dragging')) open(parseInt(item.dataset.index)); }); });
    document.getElementById('cprLbClose').addEventListener('click', close);
    document.getElementById('cprLbPrev').addEventListener('click', () => nav(-1));
    document.getElementById('cprLbNext').addEventListener('click', () => nav(1));
    lb.addEventListener('click', e => { if (e.target === lb) close(); });
    document.addEventListener('keydown', e => { if (!lb.classList.contains('open')) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') nav(-1); if (e.key === 'ArrowRight') nav(1); });
})();
</script>
<script src="../../../nav.js"></script>
