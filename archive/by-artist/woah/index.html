<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woah. — magmacrunch media</title>
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../../assets/archive.css">
    <link rel="stylesheet" href="woah-shared.css">
    <style>
        main { position: relative; padding: 0; }

        /* ── BREADCRUMB ── */
        body.woah-page .breadcrumb a { color: var(--woah-sunset); }
        body.woah-page .breadcrumb a:hover { color: var(--woah-blush); }
        body.woah-page .breadcrumb .sep { color: var(--woah-rose-sky); opacity: 0.6; }
        body.woah-page .breadcrumb .current { color: var(--woah-sunset); }

        /* ── HERO ── */
        .artist-hero {
            width: 100%;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            margin-bottom: 0;
        }
        .artist-hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 45%;
            filter: saturate(0.8) brightness(0.62);
        }
        .artist-hero-tint {
            position: absolute;
            inset: 0;
            background: rgba(120, 128, 144, 0.10);
            mix-blend-mode: screen;
        }
        .artist-hero-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(14,12,16,0.0)  0%,
                rgba(14,12,16,0.0)  85%,
                rgba(14,12,16,0.85) 100%
            );
        }
        .hero-inner { position:relative; z-index:1; width:100%; max-width:900px; padding:0 20px 36px; display:flex; flex-direction:column; }

        /* ── ARTIST HEADER ── */
        .artist-header { width:100%; max-width:900px; margin-bottom:0; animation:fadeUp 0.5s ease both; }
        .artist-label { font-family:'Press Start 2P',monospace; font-size:6px; color:var(--woah-rose-sky); letter-spacing:0.2em; margin-bottom:12px; opacity:0.85; }
        .artist-name { font-family:'Press Start 2P',monospace; font-size:clamp(14px,3vw,24px); color:var(--woah-pink-sky); line-height:1.6; letter-spacing:0.06em; text-shadow:0 0 28px rgba(200, 120, 136, 0.55),0 2px 10px rgba(0,0,0,0.95); margin-bottom:6px; }
        .artist-note { font-family:'Press Start 2P',monospace; font-size:6px; color:var(--woah-ocean); letter-spacing:0.1em; margin-bottom:24px; opacity:0.7; }
        .artist-note a { color:var(--woah-blush); text-decoration:none; opacity:0.9; transition:color 0.15s; }
        .artist-note a:hover { color:var(--woah-pink-sky); }
        .years-badge { display:inline-block; font-family:'Press Start 2P',monospace; font-size:6px; color:var(--woah-bg); background:var(--woah-sunset); padding:4px 10px; letter-spacing:0.1em; margin-bottom:20px; }

        /* ── SUB-NAV ── */
        .sub-nav { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:0; }

        .section-divider { width:100%; max-width:900px; height:1px; background:linear-gradient(90deg,transparent,var(--woah-rose-sky),var(--woah-coastal),var(--woah-sunset),transparent); margin:0 20px 40px; opacity:0.35; animation:fadeUp 0.5s 0.05s ease both; }
        .bio-wrap { width:100%; max-width:900px; padding:0 20px; margin-bottom:48px; animation:fadeUp 0.5s 0.1s ease both; }
        .section-label { font-family:'Press Start 2P',monospace; font-size:7px; color:var(--woah-sunset); letter-spacing:0.15em; margin-bottom:16px; padding-bottom:8px; border-bottom:1px solid var(--woah-sunset); opacity:0.9; }
        .bio-text { font-family:'Courier Prime',monospace; font-size:15px; color:var(--woah-blush); line-height:1.75; opacity:0.85; }
        .bio-text a { color:var(--woah-coastal); text-decoration:underline; text-decoration-color:rgba(120, 136, 176, 0.4); transition:color 0.15s; }
        .bio-text a:hover { color:var(--woah-pink-sky); }
        .videos-wrap { width:100%; max-width:900px; padding:0 20px; margin-bottom:48px; animation:fadeUp 0.5s 0.15s ease both; }
        .mini-video-list { width:100%; border:1px solid var(--woah-dusk); }
        .mini-video-entry { position:relative; width:100%; display:flex; align-items:center; overflow:hidden; border-bottom:1px solid var(--woah-dusk); cursor:pointer; min-height:100px; }
        .mini-video-entry:last-child { border-bottom:none; }
        .mini-video-bg { position:absolute; inset:0; background-size:cover; background-position:center; filter:brightness(0.22) saturate(0.5); transition:filter 0.3s ease; z-index:0; }
        .mini-video-entry:hover .mini-video-bg, .mini-video-entry.active .mini-video-bg { filter:brightness(0.12) saturate(0.3); }
        .mini-video-entry::after { content:''; position:absolute; inset:0; background:linear-gradient(to right,rgba(42,40,48,0.55) 0%,transparent 100%); z-index:1; pointer-events:none; }
        .mini-video-content { position:relative; z-index:2; display:flex; align-items:center; gap:16px; padding:14px 18px; width:100%; }
        .mini-thumb { flex-shrink:0; width:120px; aspect-ratio:16/9; background:#000; border:1px solid var(--woah-dusk); position:relative; overflow:hidden; transition:border-color 0.2s; }
        .mini-video-entry:hover .mini-thumb { border-color:var(--woah-coastal); }
        .mini-video-entry.active .mini-thumb { border-color:var(--woah-sunset); }
        .mini-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
        .mini-play-btn { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.3); }
        .mini-play-icon { width:28px; height:28px; border:2px solid var(--woah-pink-sky); border-radius:50%; display:flex; align-items:center; justify-content:center; transition:border-color 0.2s,transform 0.2s,background 0.2s; }
        .mini-play-icon::after { content:''; display:block; width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:9px solid var(--woah-pink-sky); margin-left:2px; transition:border-left-color 0.2s; }
        .mini-video-entry:hover .mini-play-icon { border-color:var(--woah-sunset); background:rgba(200, 120, 136, 0.15); transform:scale(1.1); }
        .mini-video-entry:hover .mini-play-icon::after { border-left-color:var(--woah-sunset); }
        .mini-iframe-wrap { display:none; width:120px; aspect-ratio:16/9; flex-shrink:0; border:1px solid var(--woah-sunset); }
        .mini-iframe-wrap iframe { width:100%; height:100%; display:block; border:none; }
        .mini-video-entry.active .mini-thumb { display:none; }
        .mini-video-entry.active .mini-iframe-wrap { display:block; }
        .mini-video-meta { flex:1; min-width:0; }
        .mini-video-year { font-family:'Press Start 2P',monospace; font-size:6px; color:var(--woah-coastal); letter-spacing:0.12em; margin-bottom:6px; opacity:0.8; }
        .mini-video-title { font-family:'Press Start 2P',monospace; font-size:clamp(7px,1.2vw,10px); color:var(--woah-pink-sky); letter-spacing:0.05em; line-height:1.6; margin-bottom:8px; }
        .mini-yt-link { font-family:'Press Start 2P',monospace; font-size:5px; color:var(--woah-ocean); text-decoration:none; border:1px solid var(--woah-dusk); padding:3px 8px; letter-spacing:0.06em; transition:color 0.15s,border-color 0.15s; display:inline-block; }
        .mini-yt-link:hover { color:var(--woah-sunset); border-color:var(--woah-sunset); }
        .carousel-wrap { width:100%; max-width:900px; padding:0 20px; margin-bottom:48px; animation:fadeUp 0.5s 0.2s ease both; }
        .carousel-empty { border:1px dashed var(--woah-dusk); padding:32px; text-align:center; font-family:'Press Start 2P',monospace; font-size:7px; color:var(--woah-ocean); letter-spacing:0.1em; background:rgba(120, 128, 144, 0.05); }
        .subpage-links { width:100%; max-width:900px; padding:0 20px; animation:fadeUp 0.5s 0.25s ease both; }
        .subpage-grid { display:flex; gap:12px; flex-wrap:wrap; }
        .mb-link-wrap { width:100%; max-width:900px; padding:0 20px; margin-bottom: 40px; animation:fadeUp 0.5s 0.15s ease both; }
        .mb-link { font-family:'Press Start 2P',monospace; font-size:6px; color:var(--woah-ocean); text-decoration:none; border:1px solid var(--woah-dusk); padding:6px 12px; letter-spacing:0.08em; transition:color 0.15s,border-color 0.15s; display:inline-block; }
        .mb-link:hover { color:var(--woah-sunset); border-color:var(--woah-sunset); }
        @media (max-width:640px) { .page-title{font-size:15px;} .subpage-grid{flex-direction:column;} .mini-thumb,.mini-iframe-wrap{width:90px;} }

        /* ── FOOTER ── */
        footer { position: absolute; bottom: 0; left: 0; right: 0; border-top: none; z-index: 2; }
    </style>
</head>
<body class="woah-page">
<nav id="auto-nav" data-depth="../../../"></nav>
<main>

    <div class="breadcrumb">
        <a href="../../../archive/">archive</a>
        <span class="sep">›</span>
        <a href="../../../archive/by-artist/">by artist</a>
        <span class="sep">›</span>
        <span class="current">woah.</span>
    </div>

    <div class="artist-hero">
        <img class="artist-hero-img" src="../../../assets/photos/woah/woah_from_spotify.jpg" alt="Woah.">
        <div class="artist-hero-tint"></div>
        <div class="artist-hero-gradient"></div>
        <span class="photo-credit">photo: Ben Nikitas</span>

        <div class="hero-inner">
            <div class="artist-header">
                <div class="artist-label">// artist archive //</div>
                <div class="artist-name">WOAH.</div>

                <div class="sub-nav">
                    <a href="about.html"        class="nav-card c-about">about</a>
                    <a href="links.html"        class="nav-card c-links">links</a>
                    <a href="music-videos.html" class="nav-card c-music-videos">music videos</a>
                    <a href="photography.html"  class="nav-card c-photography">photography</a>
                    <a href="recordings.html"   class="nav-card c-recordings">recordings</a>
                    <a href="releases.html"     class="nav-card c-releases">releases</a>
                    <a href="works.html"        class="nav-card c-works">works</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>&copy; 2026 <span>magmacrunch media</span></footer>
<script src="../../../nav.js"></script>
<script>
const VIDEOS = [
    { title: "Summer Day",                  year: "2024", id: "QgJfLXhV15Y" },
    { title: "Eternity spent in an arcade", year: "2024", id: "lTmHfMZAimQ" },
    { title: "Driving",                     year: "2024", id: "vmUJ2O3xwJw" },
];

const miniList = document.getElementById('miniVideoList');
let activeEntry = null;

VIDEOS.forEach(v => {
    const thumbUrl = `https://img.youtube.com/vi/${v.id}/maxresdefault.jpg`;
    const embedUrl = `https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0`;
    const watchUrl = `https://www.youtube.com/watch?v=${v.id}`;

    const entry = document.createElement('div');
    entry.className = 'mini-video-entry';
    entry.innerHTML = `
        <div class="mini-video-bg" style="background-image:url('${thumbUrl}');"></div>
        <div class="mini-video-content">
            <div class="mini-thumb">
                <img src="${thumbUrl}" alt="${v.title}" loading="lazy" referrerpolicy="no-referrer"
                     onerror="if(!this.dataset.tried){this.dataset.tried='hq';this.src='https://img.youtube.com/vi/${v.id}/hqdefault.jpg';}else if(this.dataset.tried==='hq'){this.dataset.tried='mq';this.src='https://img.youtube.com/vi/${v.id}/mqdefault.jpg';}">
                <div class="mini-play-btn"><div class="mini-play-icon"></div></div>
            </div>
            <div class="mini-iframe-wrap"></div>
            <div class="mini-video-meta">
                <div class="mini-video-year">${v.year}</div>
                <div class="mini-video-title">${v.title}</div>
                <a class="mini-yt-link" href="${watchUrl}" target="_blank" rel="noopener"
                   onclick="event.stopPropagation()">▶ open on youtube</a>
            </div>
        </div>`;

    entry.addEventListener('click', function () {
        if (this.classList.contains('active')) return;
        if (activeEntry && activeEntry !== this) {
            activeEntry.classList.remove('active');
            activeEntry.querySelector('.mini-iframe-wrap').innerHTML = '';
        }
        this.classList.add('active');
        activeEntry = this;
        this.querySelector('.mini-iframe-wrap').innerHTML =
            `<iframe src="${embedUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    });

    miniList.appendChild(entry);
});
</script>
</body>
</html>
