<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Street Apt. — magmacrunch media</title>
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../../assets/archive.css">
    <link rel="stylesheet" href="gs-shared.css">
    <style>
        /* ══ PAGE: by-place / green-street-apt ══ */

        main { position: relative; padding: 0; }

        /* ── BREADCRUMB ── */
        body.gs-page .breadcrumb a { color: var(--gs-muted); }
        body.gs-page .breadcrumb a:hover { color: var(--gs-cream); }
        body.gs-page .breadcrumb .sep { color: var(--gs-muted); opacity: 0.6; }
        body.gs-page .breadcrumb .current { color: var(--gs-muted); }

        /* ── HERO ── */
        .artist-hero {
            width: 100%;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            margin-bottom: 0;
        }
        .artist-hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 40%;
            filter: saturate(0.7) brightness(0.50);
        }
        .artist-hero-tint {
            position: absolute;
            inset: 0;
            background: rgba(120, 136, 80, 0.08);
            mix-blend-mode: screen;
        }
        .artist-hero-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(14,12,10,0.0)  0%,
                rgba(14,12,10,0.0)  85%,
                rgba(14,12,10,0.85) 100%
            );
        }

        /* ── HERO INNER ── */
        .hero-inner {
            position: relative;
            z-index: 1;
            text-align: left;
            padding: 0 20px 36px;
            width: 100%;
            max-width: 900px;
            animation: fadeUp 0.5s ease both;
        }

        .artist-header {
            width: 100%;
            margin-bottom: 0;
            animation: fadeUp 0.5s ease both;
        }

        /* ── ARTIST HEADER ── */
        .artist-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--gs-blush);
            letter-spacing: 0.2em;
            margin-bottom: 12px;
            opacity: 0.85;
        }

        .artist-name {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(14px, 3vw, 24px);
            color: var(--gs-cream);
            line-height: 1.6;
            letter-spacing: 0.06em;
            text-shadow:
                0 0 28px rgba(120, 136, 160, 0.65),
                0 2px 10px rgba(0, 0, 0, 0.95);
            margin-bottom: 6px;
        }

        .artist-abbr {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: var(--gs-light);
            letter-spacing: 0.15em;
            margin-top: -8px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        /* ── DIVIDER ── */
        .divider {
            width: 100%;
            max-width: 900px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gs-brand), var(--gs-accent), var(--gs-brand), transparent);
            margin: 8px 0 40px;
            opacity: 0.4;
        }

        /* ── MB LINK ── */
        .mb-link-wrap { width:100%; max-width:900px; padding:0 20px; margin-bottom: 40px; animation:fadeUp 0.5s 0.15s ease both; }
        .mb-link { font-family:'Press Start 2P',monospace; font-size:6px; color:var(--gs-muted); text-decoration:none; border:1px solid var(--gs-dark); padding:6px 12px; letter-spacing:0.08em; transition:color 0.15s,border-color 0.15s; display:inline-block; }
        .mb-link:hover { color:var(--gs-accent); border-color:var(--gs-accent); }

        @media (max-width:640px) { .artist-name{font-size:13px;} .sub-nav{flex-direction:column;} }

        /* ── FOOTER ── */
        footer { position: absolute; bottom: 0; left: 0; right: 0; border-top: none; z-index: 2; }
    </style>
</head>
<body class="gs-page">
<nav id="auto-nav" data-depth="../../../"></nav>
<main>
    <div class="breadcrumb">
        <a href="../../../archive/">archive</a>
        <span class="sep">›</span>
        <a href="../../by-place/">by place</a>
        <span class="sep">›</span>
        <span class="current">green street</span>
    </div>

    <div class="artist-hero">
        <img class="artist-hero-img" src="../../../assets/photos/green_st_apt/green-street-apt.jpg" alt="Green Street Apt.">
        <div class="artist-hero-tint"></div>
        <div class="artist-hero-gradient"></div>
        <span class="photo-credit">photo: Jake McCoy</span>

        <div class="hero-inner">
            <div class="artist-header">
                <div class="artist-label">// place archive //</div>
                <div class="artist-name">GREEN STREET APT.</div>
                <div class="artist-abbr">BURLINGTON, VERMONT (2017-2019)</div>

                <div class="sub-nav">
                    <a href="about.html"        class="nav-card c-about">about</a>
                    <a href="links.html"        class="nav-card c-links">links</a>
                    <a href="personnel.html"    class="nav-card c-personnel">personnel</a>
                    <a href="photography.html"  class="nav-card c-photography">photography</a>
                    <a href="recordings.html"   class="nav-card c-recordings">recordings</a>
                    <a href="works.html"        class="nav-card c-works">works</a>
                </div>
            </div>
        </div>

    </div>

</main>
<footer>&copy; 2026 <span>magmacrunch media</span></footer>
<script src="../../../nav.js"></script>
</body>
</html>
