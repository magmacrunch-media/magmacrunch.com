<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogwood Manor — magmacrunch media</title>
    <link rel="icon" type="image/jpeg" href="../../../assets/logo.jpg">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../../assets/archive.css">
    <link rel="stylesheet" href="fm-shared.css">
    <style>
        main { position: relative; padding: 0; }

        body.fm-page .breadcrumb a { color: var(--fm-muted); }
        body.fm-page .breadcrumb a:hover { color: var(--fm-cream); }
        body.fm-page .breadcrumb .sep { color: var(--fm-muted); opacity: 0.6; }
        body.fm-page .breadcrumb .current { color: var(--fm-muted); }

        .artist-hero {
            width: 100%;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            overflow: hidden;
            margin-bottom: 0;
        }
        .artist-hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 75%;
            filter: saturate(1.0) brightness(0.60);
        }
        .artist-hero-tint {
            position: absolute;
            inset: 0;
            background: rgba(160, 48, 200, 0.08);
            mix-blend-mode: screen;
        }
        .artist-hero-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(12,8,16,0.0)  0%,
                rgba(12,8,16,0.0)  85%,
                rgba(12,8,16,0.85) 100%
            );
        }

        .hero-inner {
            position: relative;
            z-index: 1;
            text-align: left;
            padding: 0 20px 36px;
            width: 100%;
            max-width: 900px;
            animation: fadeUp 0.5s ease both;
        }

        .artist-header {
            width: 100%;
            margin-bottom: 0;
            animation: fadeUp 0.5s ease both;
        }

        .artist-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--fm-brand);
            letter-spacing: 0.2em;
            margin-bottom: 12px;
            opacity: 0.85;
        }

        .artist-name {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(14px, 3vw, 24px);
            color: var(--fm-cream);
            line-height: 1.6;
            letter-spacing: 0.06em;
            text-shadow:
                0 0 28px rgba(160, 48, 200, 0.65),
                0 2px 10px rgba(0, 0, 0, 0.95);
            margin-bottom: 6px;
        }

        .artist-abbr {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: var(--fm-brand);
            letter-spacing: 0.15em;
            margin-top: -8px;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .divider {
            width: 100%;
            max-width: 900px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--fm-brand), var(--fm-amber), var(--fm-brand), transparent);
            margin: 8px 0 40px;
            opacity: 0.4;
        }

        .section-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--fm-sage);
            letter-spacing: 0.15em;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--fm-sage);
            opacity: 0.9;
        }

        .place-body {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
            color: var(--fm-light);
            font-size: 16px;
            line-height: 1.7;
        }
        .place-body p { margin-bottom: 1.5em; }

        .mb-link-wrap { width:100%; max-width:900px; padding:0 20px; margin-bottom: 40px; animation:fadeUp 0.5s 0.15s ease both; }
        .mb-link { font-family:'Press Start 2P',monospace; font-size:6px; color:var(--fm-muted); text-decoration:none; border:1px solid var(--fm-deep); padding:6px 12px; letter-spacing:0.08em; transition:color 0.15s,border-color 0.15s; display:inline-block; }
        .mb-link:hover { color:var(--fm-amber); border-color:var(--fm-amber); }

        @media (max-width:640px) { .artist-name{font-size:13px;} .sub-nav{flex-direction:column;} }

        /* ── FOOTER ── */
        footer { position: absolute; bottom: 0; left: 0; right: 0; border-top: none; z-index: 2; }
    </style>
</head>

                    <a href="events.html"     class="nav-card c-events">events</a>
                    <a href="personnel.html"  class="nav-card c-personnel">personnel</a>
                    <a href="recordings.html" class="nav-card c-recordings">recordings</a>

            </div>
        </div>

        </div>

    </div>

    <div class="divider"></div>

    </div>
</main>
<footer>&copy; 2026 <span>magmacrunch media</span></footer>
