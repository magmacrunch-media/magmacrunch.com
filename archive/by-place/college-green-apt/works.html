<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/jpeg" href="../../../assets/logo.jpg">

    <link rel="stylesheet" href="../../../assets/archive.css">
    <link rel="stylesheet" href="cg-shared.css">

    <style>
        :root { --section-accent: var(--cg-cta); }
        body.cg-page.cg-works-page .breadcrumb a { color: var(--section-accent); }
        body.cg-page.cg-works-page .breadcrumb a:hover { color: var(--cg-cream); }
        body.cg-page.cg-works-page .breadcrumb .sep { color: var(--section-accent); opacity: 0.6; }
        body.cg-page.cg-works-page .breadcrumb .current { color: var(--section-accent); }
        body.cg-page.cg-works-page .place-label { color: var(--section-accent); }
        body.cg-page.cg-works-page .page-title { color: var(--section-accent); text-shadow: 0 0 20px rgba(192,120,56,0.45); }
        body.cg-page.cg-works-page .nav-card.c-back { color: var(--section-accent); border-color: var(--section-accent); }
        body.cg-page.cg-works-page .nav-card.c-back:hover { background: var(--section-accent); color: var(--black, #080808); }
    </style>
    <script>
    window.PLACE_CONFIG = {
        id:        'c6c69d44-8408-4a0a-9dbf-8b3ee903bc5f',
        name:      'College Green Apt.',
        abbr:      'college green',
        backColor: 'c-works',
        siblings:  ['personnel', 'recordings', 'works'],
        depth:     '../../../',
    };
        window.PLACE_CONFIG.accent = 'cg-cta';
    </script>
</head>
<body class="cg-page cg-works-page">
<nav id="auto-nav" data-depth="../../../"></nav>
<main>
    <div class="breadcrumb"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var nav = document.getElementById('sub-nav');
    if (nav && !nav.querySelector('a[href="about.html"]')) {
        var aboutLink = document.createElement('a');
        aboutLink.href = 'about.html';
        aboutLink.className = 'nav-card c-about';
        aboutLink.textContent = 'about';
        nav.insertBefore(aboutLink, nav.children[1]);
    }
});
</script>
