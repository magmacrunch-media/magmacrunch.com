<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>by place — magmacrunch archive</title>
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../templates/contributor-theme.css">
    <style>
        :root {
            --nav-brand:    #dd4ec0;
            --nav-brand-glow: rgba(221,78,192,0.7);
            --nav-accent:   #9a1879;
            --nav-glow:     rgba(154,24,121,0.4);
        }
        /* Neutral near-black ground — same family as every place subpage
           (--mh-bg #0c0d0f, --ih-bg #0c0e10, --fm-bg #0c0810, --tm-bg #0c0f0d)
           and identical to the by-artist index. */
        body.ctb-page {
            --ctb-void:     #0a0a0c;
            --ctb-darkest:  #46002f;
            --ctb-dark:     #6c0950;
            --ctb-mid-dark: #9a1879;
            --ctb-deep:     #b01b8c;
            --ctb-bright:   #bf2c9d;
            --ctb-muted:    #db85bd;
            --ctb-cyan:     #dd4ec0;
            --ctb-light:    #ff7dd0;
            --ctb-pale:     #ffaae0;
            background:     #0a0a0c;

            /* contributor-theme.css hard-codes these two on body.ctb-page, which
               outranks the :root block above — without repeating them here the
               nav brand glows cyan and the nav bar casts a teal shadow. */
            --nav-brand-glow: rgba(221,78,192,0.7);
            --nav-glow:       rgba(154,24,121,0.4);

            --ground:       #0a0a0c;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 60px;
        }

        .breadcrumb {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #db85bd;
            letter-spacing: 0.1em;
            margin-top: -8px;
            margin-bottom: 16px;
            align-self: flex-start;
        }
        .breadcrumb a { text-decoration: none; transition: color 0.15s; }
        .breadcrumb .sep { margin: 0 8px; opacity: 0.7; }
        .page-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            margin-bottom: 8px;
            letter-spacing: 0.1em;
        }
        .page-subtitle {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            margin-bottom: 32px;
            letter-spacing: 0.12em;
        }
        /* ── Neutral page chrome ───────────────────────────────────────────────
           The magenta that used to live here sat close to Frogwood's pink and
           Marvin Gardens' burgundy, so the title read as a ninth tile. Bone
           greys instead — the grid carries all the color. Matches by-artist.
           These need the body.ctb-page prefix: contributor-theme.css styles the
           breadcrumb, subtitle and title at that specificity (and hard-codes a
           cyan halo on the title) and outranks bare rules. */
        body.ctb-page .breadcrumb,
        body.ctb-page .breadcrumb a,
        body.ctb-page .page-subtitle       { color: #8a8580; }
        body.ctb-page .breadcrumb a:hover,
        body.ctb-page .breadcrumb .sep,
        body.ctb-page .breadcrumb .current { color: #c8c4bc; }
        body.ctb-page .page-title {
            color: #c8c4bc;
            text-shadow: 0 0 16px rgba(200,196,188,0.3);
        }
        .grid-wrap {
            width: min(900px, 95vw);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        /* ── Per-place card themes ─────────────────────────────────────────────
           Each tile carries three colors drawn from that place's own
           <prefix>-shared.css, matching the theme its header comment names:
           --accent drives the border, tint and hover glow, and all three fill
           the segmented bar along the card's bottom edge. --ink is the title.
           Prefix is t- (not c-) so check-archive-format.js is unaffected. */
        .card    { --accent:#9a1879; --a2:#b01b8c; --a3:#dd4ec0; --ink:#ffaae0; } /* fallback */
        .t-cg    { --accent:#8878a8; --a2:#607850; --a3:#c07838; --ink:#f0e8d8; } /* dusty violet · green · warm  */
        .t-fm    { --accent:#4080f0; --a2:#a030c8; --a3:#f040a0; --ink:#f8e8d8; } /* cobalt · violet · pink       */
        .t-gs    { --accent:#c07838; --a2:#7888a8; --a3:#607850; --ink:#f8f4e8; } /* copper · slate · green       */
        .t-ih    { --accent:#7090b8; --a2:#a86848; --a3:#608850; --ink:#dce8f0; } /* steel · terracotta · green   */
        .t-mg    { --accent:#a02858; --a2:#7848a0; --a3:#c87830; --ink:#e0c0d0; } /* burgundy · violet · amber    */
        .t-mh    { --accent:#c87878; --a2:#6878a0; --a3:#7ab8a0; --ink:#f0c8c0; } /* dusty rose · slate · sage    */
        .t-tc    { --accent:#c8a040; --a2:#a83840; --a3:#507840; --ink:#f5f0e0; } /* gold · red · green           */
        .t-tm    { --accent:#8a9878; --a2:#c07848; --a3:#7ab0c0; --ink:#d4d8c8; } /* leaf · warm · cool blue      */

        .card {
            border: 2px solid;
            padding: 16px;
            text-decoration: none;
        }
        /* body.ctb-page prefix required — contributor-theme.css targets
           `body.ctb-page .card` and outranks a bare `.card`. Each color-mix is
           preceded by a plain fallback for engines that discard it. */
        body.ctb-page .card {
            background-color: #141014;
            background-color: color-mix(in srgb, var(--accent) 9%, var(--ground));
            /* three-segment bar along the bottom edge — plain vars, so it still
               renders where color-mix does not */
            background-image: linear-gradient(90deg,
                var(--accent) 0 33.334%,
                var(--a2)     33.334% 66.667%,
                var(--a3)     66.667% 100%);
            background-repeat: no-repeat;
            background-size: 100% 4px;
            background-position: left bottom;
            border-color: #3a3238;
            border-color: color-mix(in srgb, var(--accent) 55%, var(--ground));
            transition: border-color 0.15s, box-shadow 0.15s,
                        background-color 0.15s, background-size 0.15s;
        }
        body.ctb-page .card:hover,
        body.ctb-page .card:focus-visible {
            background-color: color-mix(in srgb, var(--accent) 16%, var(--ground));
            background-size: 100% 7px;
            border-color: var(--accent);
            box-shadow:   0 0 18px -2px var(--accent);
            box-shadow:   0 0 18px -2px color-mix(in srgb, var(--accent) 45%, transparent);
            outline: none;
        }
        .card-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        body.ctb-page .card .card-title { color: var(--ink); }

        /* Unbuilt places read as absent, not as a ninth theme */
        .card-soon {
            border: 2px dashed;
            padding: 16px;
        }
        body.ctb-page .card-soon { border-color: #2a2a30; background: #0d0d10; }
        body.ctb-page .card-soon .card-title { color: #6a6a72; }
        body.ctb-page .card-soon .card-sub {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: #55555c;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>
