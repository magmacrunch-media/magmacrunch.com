<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>by place — magmacrunch archive</title>
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../templates/contributor-theme.css">
    <style>
        :root {
            --nav-brand:    #dd4ec0;
            --nav-brand-glow: rgba(221,78,192,0.7);
            --nav-accent:   #9a1879;
            --nav-glow:     rgba(154,24,121,0.4);
        }
        /* Neutral near-black ground — same family as every place subpage
           (--mh-bg #0c0d0f, --ih-bg #0c0e10, --fm-bg #0c0810, --tm-bg #0c0f0d)
           and identical to the by-artist index. */
        body.ctb-page {
            --ctb-void:     #0a0a0c;
            --ctb-darkest:  #46002f;
            --ctb-dark:     #6c0950;
            --ctb-mid-dark: #9a1879;
            --ctb-deep:     #b01b8c;
            --ctb-bright:   #bf2c9d;
            --ctb-muted:    #db85bd;
            --ctb-cyan:     #dd4ec0;
            --ctb-light:    #ff7dd0;
            --ctb-pale:     #ffaae0;
            background:     #0a0a0c;

            --ground:       #0a0a0c;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 60px;
        }

        .breadcrumb {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #db85bd;
            letter-spacing: 0.1em;
            margin-top: -8px;
            margin-bottom: 16px;
            align-self: flex-start;
        }
        .breadcrumb a { color: #db85bd; text-decoration: none; transition: color 0.15s; }
        .breadcrumb a:hover { color: #dd4ec0; }
        .breadcrumb .sep { margin: 0 8px; color: #dd4ec0; opacity: 0.7; }
        .breadcrumb .current { color: #dd4ec0; }
        .page-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            margin-bottom: 8px;
            letter-spacing: 0.1em;
        }
        /* contributor-theme.css hard-codes a cyan halo here; override at matching specificity */
        body.ctb-page .page-title {
            color: #dd4ec0;
            text-shadow: 0 0 16px rgba(221,78,192,0.6);
        }
        .page-subtitle {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #db85bd;
            margin-bottom: 32px;
            letter-spacing: 0.12em;
        }
        .grid-wrap {
            width: min(900px, 95vw);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        /* ── Per-place card themes ─────────────────────────────────────────────
           Each tile carries the signature color of the place it opens, taken
           from the theme that place's own <prefix>-shared.css declares in its
           header comment. Retuning a place means editing one hex.
           Prefix is t- (not c-) so check-archive-format.js is unaffected. */
        .card    { --accent: #9a1879; --ink: #ffaae0; }  /* fallback                              */
        .t-cg    { --accent: #8878a8; --ink: #f0e8d8; }  /* --cg-heading      / --cg-text-bright  */
        .t-fm    { --accent: #4080f0; --ink: #f8e8d8; }  /* --fm-cobalt       / --fm-cream        */
        .t-gs    { --accent: #c07838; --ink: #f8f4e8; }  /* --gs-accent       / --gs-heading      */
        .t-ih    { --accent: #7090b8; --ink: #dce8f0; }  /* --ih-brand        / --ih-cream        */
        .t-mg    { --accent: #a02858; --ink: #e0c0d0; }  /* --mg-brand        / --mg-text-body    */
        .t-mh    { --accent: #c87878; --ink: #f0c8c0; }  /* --mh-coral        / --mh-pale         */
        .t-tc    { --accent: #c8a040; --ink: #f5f0e0; }  /* --tc-gold         / --tc-offwhite     */
        .t-tm    { --accent: #8a9878; --ink: #d4d8c8; }  /* --tm-leaf         / --tm-cream        */

        .card {
            border: 2px solid;
            padding: 16px;
            text-decoration: none;
        }
        /* body.ctb-page prefix required — contributor-theme.css targets
           `body.ctb-page .card` and outranks a bare `.card`. Each color-mix is
           preceded by a plain fallback for engines that discard it. */
        body.ctb-page .card {
            background:   #141014;
            background:   color-mix(in srgb, var(--accent) 9%,  var(--ground));
            border-color: #3a3238;
            border-color: color-mix(in srgb, var(--accent) 55%, var(--ground));
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        body.ctb-page .card:hover,
        body.ctb-page .card:focus-visible {
            background:   color-mix(in srgb, var(--accent) 16%, var(--ground));
            border-color: var(--accent);
            box-shadow:   0 0 18px -2px var(--accent);
            box-shadow:   0 0 18px -2px color-mix(in srgb, var(--accent) 45%, transparent);
            outline: none;
        }
        .card-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }
        body.ctb-page .card .card-title { color: var(--ink); }

        /* Unbuilt places read as absent, not as a ninth theme */
        .card-soon {
            border: 2px dashed;
            padding: 16px;
        }
        body.ctb-page .card-soon { border-color: #2a2a30; background: #0d0d10; }
        body.ctb-page .card-soon .card-title { color: #6a6a72; }
        body.ctb-page .card-soon .card-sub {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: #55555c;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
    </style>
</head>

        <a href="irvin-house/" class="card t-ih"><div class="card-title">Irvin House</div></a>
        <a href="marvin-gardens-g12/" class="card t-mg"><div class="card-title">Marvin Gardens G12</div></a>
        <a href="melrose-house/" class="card t-mh"><div class="card-title">Melrose House</div></a>
        <a href="the-tuna-can/" class="card t-tc"><div class="card-title">The Tuna Can</div></a>

        <div class="card-soon"><div class="card-title">Riverside Estate</div><div class="card-sub">coming soon</div></div>

</main>
