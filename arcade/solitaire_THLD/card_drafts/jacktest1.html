<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THOLD — Jack of Spades Pixel Perfect</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0000;
    --card-bg: #f4f4f0; /* Slight off-white for a retro paper feel */
    --yel: #ffcc00;
    --ora: #dd4400;
  }
  body {
    background: var(--black);
    font-family: 'Press Start 2P', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    width: 256px; /* 4x scale of the 64x88 viewBox */
    height: 352px;
    background: var(--card-bg);
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(255, 119, 0, 0.2);
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

<div class="card">
  <svg viewBox="0 0 64 88" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="half-card">
        <text x="4" y="10" font-family="'Press Start 2P'" font-size="6" fill="#111111">J</text>
        <text x="4" y="20" font-family="'Press Start 2P'" font-size="8" fill="#111111">♠</text>

        <path d="M 14 6 L 50 6 L 50 44 L 14 44 Z" fill="none" stroke="#111111" stroke-width="1"/>

        <rect x="26" y="12" width="12" height="4" fill="var(--yel)"/>
        <rect x="24" y="16" width="16" height="4" fill="var(--ora)"/>
        <rect x="24" y="20" width="16" height="2" fill="#111111"/>

        <rect x="26" y="22" width="10" height="10" fill="#111111"/> <rect x="22" y="22" width="4" height="2" fill="#111111"/>  <rect x="20" y="24" width="6" height="2" fill="#111111"/>  <rect x="22" y="26" width="4" height="2" fill="#111111"/>  <rect x="22" y="28" width="4" height="2" fill="#111111"/>  <rect x="24" y="30" width="8" height="4" fill="#111111"/>  <rect x="20" y="34" width="24" height="10" fill="var(--yel)"/>
        <rect x="18" y="38" width="28" height="6" fill="#111111"/>
        
        <text x="28" y="42" font-family="'Press Start 2P'" font-size="4" fill="var(--card-bg)">♠</text>
      </g>
    </defs>

    <use href="#half-card" x="0" y="0" />

    <use href="#half-card" x="0" y="0" transform="rotate(180 32 44)" />
    
    <rect x="14" y="43.5" width="36" height="1" fill="#111111"/>

  </svg>
</div>

</body>
</html>
