<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THOLD — J♠ v24 fresh start</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --black:#0a0000; --deep-red:#3b0000;
  --og:#ff7700; --yel:#ffcc00; --ylp:#ffe680; --ora:#dd4400;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--black);font-family:'Press Start 2P',monospace;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;padding:32px 16px 80px;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.18) 3px,rgba(0,0,0,0.18) 4px),
    radial-gradient(ellipse 80% 60% at 50% 100%,rgba(180,40,0,0.35) 0%,transparent 70%);
}
h1,.sub,section,.row{position:relative;z-index:1;}
h1{color:var(--yel);font-size:clamp(9px,2vw,13px);text-align:center;
   letter-spacing:2px;margin-bottom:6px;
   text-shadow:2px 2px 0 #cc2200,4px 4px 0 #3b0000;}
.sub{font-family:'VT323',monospace;color:var(--og);font-size:18px;
     letter-spacing:3px;text-align:center;margin-bottom:40px;}
section{width:100%;max-width:1200px;margin-bottom:48px;}
.lbl{font-size:7px;color:var(--og);letter-spacing:3px;text-transform:uppercase;
     margin-bottom:20px;padding-bottom:8px;border-bottom:2px solid var(--deep-red);}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
.clbl{font-size:6px;color:var(--ora);letter-spacing:1px;}
.note{font-family:'VT323',monospace;font-size:14px;color:var(--og);
      text-align:center;line-height:1.5;max-width:200px;}
.card{border-radius:6px;overflow:hidden;
      box-shadow:3px 3px 0 var(--black),6px 6px 0 rgba(0,0,0,0.5);
      transition:transform .12s,box-shadow .12s;}
.card:hover{transform:translateY(-8px) scale(1.03);
            box-shadow:3px 14px 0 var(--black),6px 18px 0 rgba(0,0,0,0.4);}
</style>
</head>
<body>

<h1>TEXAS HOLD'EM LAVA DOME</h1>

<!--
╔══════════════════════════════════════════════════════════════════╗
║  LAYOUT PLAN — all coordinates are in the defs space (0..110)   ║
║  Figure is placed with: translate(9,11) scale(0.85)              ║
║  So defs coords map to card coords as:                          ║
║    card_x = 9 + def_x * 0.85                                    ║
║    card_y = 8 + def_y * 0.85                                    ║
║                                                                  ║
║  PIP ZONES on card canvas (after placement):                    ║
║    Corner text:  card x=2, y=8+15  (outside inner border)       ║
║    Small pip:    card x=11..21, y=11..25  (10×14)               ║
║    Large pip:    card x=11..33, y=18..44  (22×26)               ║
║                                                                  ║
║  Working back to def coords:                                     ║
║    card x=11 → def x = (11-9)/0.85 = 2.4                        ║
║    card x=33 → def x = (33-9)/0.85 = 28.2                       ║
║    card y=18 → def y = (18-8)/0.85 = 11.8                       ║
║    card y=44 → def y = (44-8)/0.85 = 42.4                       ║
║                                                                  ║
║  ⚠ KEEP DEF X < 28 ENTIRELY EMPTY in the figure ⚠              ║
║    Nothing in the figure should be drawn at def x < 28.         ║
║    The axe/weapon lives on the RIGHT: def x = 88..106           ║
║    Face/head: def x = 44..88 (centred, more room)               ║
║    Hair: def x = 28..58 (left edge starts at 28, safe)          ║
╚══════════════════════════════════════════════════════════════════╝
-->
