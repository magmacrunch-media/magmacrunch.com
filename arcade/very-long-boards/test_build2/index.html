<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SNES Downhill Skate</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    h1 {
      color: #f4c430;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 12px #f4c43088;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      border: 3px solid #333;
      border-radius: 4px;
      box-shadow: 0 0 40px #000a;
      cursor: crosshair;
    }

    #controls-hint {
      color: #555;
      font-size: 0.72rem;
      margin-top: 8px;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <h1>⛷ Downhill Shred</h1>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <p id="controls-hint">Arrow keys / WASD to play &nbsp;|&nbsp; touch zones: left / centre(brake) / right</p>

  <script type="module" src="main.js"></script>
</body>
</html>
