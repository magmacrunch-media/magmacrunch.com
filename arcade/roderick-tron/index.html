<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RODERICK TRON — magmacrunch media</title>
    <link rel="icon" href="../../arcade/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/arcade-base.css?v=de5e0d7b">
    <link rel="stylesheet" href="css/base.css?v=2c415a70">
    <link rel="stylesheet" href="css/start-screen.css?v=7df00463">
    <link rel="stylesheet" href="css/game.css?v=69772323">
    <link rel="stylesheet" href="css/modals.css?v=d677e624">
</head>
<body>
<a href="../" class="mc-back">magmacrunch arcade</a>

<!-- Title Screen -->
<div id="titleScreen" class="title-screen">
    <h1>RODERICK<br>TRON</h1>
    <p class="subtitle">rooftop requiem</p>
    <div class="controls-hint">
        SPACE / ↑ &mdash; jump (hold to go higher)<br>
        Z &mdash; fire a note
    </div>
    <div class="start-prompt">PRESS SPACE</div>
    <p class="copyright">&copy; 2026 MAGMACRUNCH MEDIA</p>
</div>

<!-- Game Canvas -->
<div id="gameContainer" class="game-container">
    <canvas id="gameCanvas" width="480" height="270"></canvas>
</div>

<!-- HUD -->
<div id="hud" class="hud">
    <div class="hud-left">
        <div class="hud-score" id="scoreDisplay">0m</div>
        <div class="hud-lives" id="livesDisplay"></div>
    </div>
    <div class="hud-right">
        <div class="hud-speed" id="speedDisplay">♩ ♪</div>
        <div class="hud-combo" id="comboDisplay"></div>
    </div>
</div>

<!-- Game Over Overlay -->
<div id="gameOverOverlay" class="game-over-overlay">
    <div class="game-over-box">
        <h2>FIN</h2>
        <div class="final-score" id="finalScore">0m</div>
        <div class="final-distance" id="finalDistance"></div>
        <div class="high-scores" id="highScoresSection">
            <h3>HIGH SCORES</h3>
            <div id="highScoresList"></div>
        </div>
        <div class="initials-prompt" id="initialsPrompt" style="display:none;">
            <label>ENTER INITIALS</label>
            <input type="text" class="initials-input" id="initialsInput" maxlength="3" autocomplete="off">
            <button class="initials-submit" id="initialsSubmit">OK</button>
        </div>
        <div class="prompt">PRESS SPACE TO RETRY</div>
    </div>
</div>

<script src="js/config.js?v=96af430b"></script>
<script src="js/input.js?v=74c953ef"></script>
<script src="js/player.js?v=4cf03df8"></script>
<script src="js/world.js?v=9c63a4ea"></script>
<script src="js/entities.js?v=817bb481"></script>
<script src="js/renderer.js?v=135b92ef"></script>
<script src="js/main.js?v=a097642b"></script>
</body>
</html>
