<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess — magmacrunch media</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/arcade-base.css?v=de5e0d7b">
    <link rel="stylesheet" href="css/base.css?v=60bde792">
    <link rel="stylesheet" href="css/board.css?v=0f6b505d">
    <link rel="stylesheet" href="css/modals.css?v=4ce07254">
    <link rel="stylesheet" href="css/responsive.css?v=58740b9c">
</head>
<body>

    <a href="../" class="mc-back">magmacrunch arcade</a>

    <div class="scanlines"></div>

    <div class="container"></div>

    <!-- Chess-specific modals (outside template) -->

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-titlebar">
                <span>SETTINGS</span>
                <button id="closeSettings" class="modal-close">✕</button>
            </div>
            <div class="modal-body">
                <form id="settingsForm">
                    <div class="settings-group">
                        <div class="settings-group-title">AI DIFFICULTY</div>
                        <div class="settings-options">
                            <div class="settings-option">
                                <input type="radio" name="difficulty" id="diffEasy" value="easy">
                                <label for="diffEasy">Easy (depth 2)</label>
                            </div>
                            <div class="settings-option">
                                <input type="radio" name="difficulty" id="diffMedium" value="medium" checked>
                                <label for="diffMedium">Medium (depth 3)</label>
                            </div>
                            <div class="settings-option">
                                <input type="radio" name="difficulty" id="diffHard" value="hard">
                                <label for="diffHard">Hard (depth 4)</label>
                            </div>
                        </div>
                    </div>
                    <div class="settings-group">
                        <div class="settings-group-title">TIME CONTROL</div>
                        <div class="settings-options">
                            <div class="settings-option">
                                <input type="radio" name="timeControl" id="tcNone" value="none" checked>
                                <label for="tcNone">No Timer</label>
                            </div>
                            <div class="settings-option">
                                <input type="radio" name="timeControl" id="tcBlitz" value="blitz">
                                <label for="tcBlitz">Blitz (5 min)</label>
                            </div>
                            <div class="settings-option">
                                <input type="radio" name="timeControl" id="tcRapid" value="rapid">
                                <label for="tcRapid">Rapid (15 min)</label>
                            </div>
                            <div class="settings-option">
                                <input type="radio" name="timeControl" id="tcClassical" value="classical">
                                <label for="tcClassical">Classical (30 min)</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" id="closeSettingsBtn">START GAME</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Promotion Modal -->
    <div id="promotionModal" class="modal-overlay">
        <div class="modal-content promotion-content">
            <div class="modal-titlebar">
                <span>PROMOTE PAWN</span>
            </div>
            <div class="modal-body">
                <div class="promotion-title">Choose a piece:</div>
                <div class="promotion-pieces" id="promotionPieces"></div>
            </div>
        </div>
    </div>

    <!-- Timer + Side Panel (injected into game-layout by main.js) -->
    <template id="chessGameExtra">
        <div class="timer-container" id="timerContainer" style="display: none;">
            <div class="timer player" id="playerTime">5:00</div>
            <div class="timer ai" id="aiTime">5:00</div>
        </div>
        <div class="side-panel">
            <div class="move-history-panel">
                <div class="move-history-header"><span>MOVE HISTORY</span></div>
                <div class="move-history-list" id="moveHistoryList"></div>
            </div>
            <div id="chatPanel" class="chat-panel" style="display: none;">
                <div class="chat-header"><span>CHAT</span></div>
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." maxlength="200">
                    <button id="chatSendBtn" class="chat-send-btn">▶</button>
                </div>
            </div>
        </div>
    </template>

    <script src="../shared/board-game-template.js?v=b6a8871d"></script>
    <script>
    BoardGameTemplate.render({
        title: 'CHESS',
        subtitle: '// NEON EDITION //',
        footer: ['CLASSIC CHESS \u00a0·\u00a0 VS AI OPPONENT', 'ALGEBRAIC NOTATION \u00a0·\u00a0 PIXEL ART PIECES'],
        buttons: [
            { id: 'startGameBtn', label: 'CLICK OR PRESS SPACE TO START', cls: 'primary', icon: '▶\u00a0\u00a0' },
            { id: 'multiplayerBtn', label: 'MULTIPLAYER' },
            { id: 'startSettingsBtn', label: 'SETTINGS' },
            { id: 'helpBtn', label: 'HOW TO PLAY' },
            { id: 'creditsBtn', label: 'CREDITS' }
        ],
        gameControls: [
            { id: 'newGameBtn', label: 'NEW GAME' },
            { id: 'settingsBtn', label: 'SETTINGS' },
            { id: 'menuBtn', label: 'MENU' }
        ],
        gameOverMsg: 'Checkmate!',
        instructions: '<h3>Chess Rules</h3>' +
            '<p>Chess is a classic two-player strategy board game. The goal is to checkmate your opponent\'s king.</p>' +
            '<h4>Setup</h4><ul>' +
            '<li>You are <strong style="color: #00f5ff;">CYAN</strong> (white pieces)</li>' +
            '<li>AI is <strong style="color: #ff2d78;">MAGENTA</strong> (black pieces)</li>' +
            '<li>White always moves first</li></ul>' +
            '<h4>Piece Movement</h4><ul>' +
            '<li><strong>King</strong>: One square in any direction</li>' +
            '<li><strong>Queen</strong>: Any number of squares in any direction</li>' +
            '<li><strong>Rook</strong>: Any number of squares horizontally/vertically</li>' +
            '<li><strong>Bishop</strong>: Any number of squares diagonally</li>' +
            '<li><strong>Knight</strong>: L-shape (2+1), can jump over pieces</li>' +
            '<li><strong>Pawn</strong>: Forward 1 (or 2 from start), captures diagonally</li></ul>' +
            '<h4>Special Moves</h4><ul>' +
            '<li><strong>Castling</strong>: King moves 2 squares toward rook, rook jumps over</li>' +
            '<li><strong>En Passant</strong>: Pawn captures opponent\'s pawn that just moved 2 squares</li>' +
            '<li><strong>Promotion</strong>: Pawn reaches opposite end, promotes to Queen/Rook/Bishop/Knight</li></ul>' +
            '<h4>Check & Checkmate</h4><ul>' +
            '<li><strong>Check</strong>: King is under attack</li>' +
            '<li><strong>Checkmate</strong>: King is in check and cannot escape</li>' +
            '<li><strong>Stalemate</strong>: No legal moves but king is NOT in check (draw)</li></ul>',
        credits: '<h3>Chess — Neon Edition</h3>' +
            '<h4>Game Design & Development</h4><p>Jake A. McCoy</p>' +
            '<h4>Publisher</h4><p><strong>magmacrunch media</strong></p>' +
            '<h4>Built With</h4><p>Vanilla HTML, CSS & JavaScript · Press Start 2P font · Neon retro aesthetic</p>' +
            '<h4>About</h4><p>Classic chess with a neon arcade twist. Play against the AI opponent with configurable difficulty and time controls!</p>'
    });

    // Inject chess-specific extras into game-layout
    (function () {
        var extra = document.getElementById('chessGameExtra');
        var layout = document.querySelector('.game-layout');
        if (extra && layout) {
            var clone = extra.content.cloneNode(true);
            // Insert timer before board-area, side-panel after board-area
            var boardArea = layout.querySelector('.board-area');
            var timerContainer = clone.querySelector('.timer-container');
            var sidePanel = clone.querySelector('.side-panel');
            if (timerContainer) layout.insertBefore(timerContainer, boardArea);
            if (sidePanel) layout.appendChild(sidePanel);
        }
    })();
    </script>

    <!-- Game scripts. These are static on purpose: BoardGameTemplate.render()
         builds markup only — scripts it injected via insertAdjacentHTML never
         executed, which is why this game did not run at all. render() must
         still come first, since these bind to the DOM it creates. -->
    <script src="../shared/adenosine-multiplayer.js?v=6694ae95"></script>
    <script>const { MP, MSG, MP_PALETTE } = AdMP;</script>
    <script src="../shared/mp-server.js?v=f66f285b"></script>
    <script>var MP_DEFAULT_SERVER = mpServerFor('chess', 8769);</script>
    <script src="js/config.js?v=ec11e83b"></script>
    <script src="js/board.js?v=da64e5b2"></script>
    <script src="js/ai.js?v=842300a6"></script>
    <script src="js/game.js?v=caefbbce"></script>
    <script src="js/multiplayer.js?v=5b0bdd27"></script>
    <script src="js/main.js?v=7693e898"></script>
    <link rel="stylesheet" href="../shared/chat-widget.css?v=4fb80289">
    <script src="../shared/adenosine-chat.js?v=6b88200d"></script>
<script src="../shared/chat-server.js?v=2efa8028"></script>
    <script>const { ChatWidget } = AdChat;</script>
    <script>ChatWidget.connect(MC_CHAT_OPTS);</script>

</body>
</html>
