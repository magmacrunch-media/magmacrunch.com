<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkers — magmacrunch media</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

    <a href="../" class="mc-back">magmacrunch arcade</a>

    <div class="scanlines"></div>

    <div class="container"></div>

    <script src="../shared/board-game-template.js?v=b6a8871d"></script>
    <script>
    BoardGameTemplate.render({
        title: 'CHECKERS',
        subtitle: '// NEON EDITION //',
        footer: ['CLASSIC CHECKERS \u00a0·\u00a0 VS AI OPPONENT', 'MANDATORY JUMPS \u00a0·\u00a0 KING PROMOTION'],
        buttons: [
            { id: 'startGameBtn', label: 'CLICK OR PRESS SPACE TO START', cls: 'primary', icon: '▶\u00a0\u00a0' },
            { id: 'onlineBtn', label: 'PLAY ONLINE', icon: '🌐\u00a0\u00a0' },
            { id: 'helpBtn', label: 'HOW TO PLAY' },
            { id: 'creditsBtn', label: 'CREDITS' }
        ],
        gameControls: [
            { id: 'newGameBtn', label: 'NEW GAME' },
            { id: 'menuBtn', label: 'MENU' }
        ],
        instructions: '<h3>Checkers Rules</h3>' +
            '<p>Checkers is a classic two-player board game. The goal is to capture all of your opponent\'s pieces or block them from making any moves.</p>' +
            '<h4>Setup</h4><ul>' +
            '<li>You are <strong style="color: #00f5ff;">CYAN</strong> — your pieces start at the bottom</li>' +
            '<li>AI is <strong style="color: #ff2d78;">MAGENTA</strong> — its pieces start at the top</li>' +
            '<li>Pieces can only move on dark squares</li>' +
            '<li>Regular pieces move diagonally forward only</li></ul>' +
            '<h4>Movement</h4><ul>' +
            '<li>Click a piece to select it — legal moves will highlight</li>' +
            '<li>Click a highlighted square to move there</li>' +
            '<li>Regular pieces move diagonally forward one square</li>' +
            '<li>Kings (promoted pieces) can move forward and backward</li></ul>' +
            '<h4>Capturing</h4><ul>' +
            '<li>Jump over an opponent\'s piece to capture it</li>' +
            '<li>Jumps are <strong>mandatory</strong> — you must jump if possible</li>' +
            '<li>Multiple jumps in one turn are allowed (and required!)</li></ul>' +
            '<h4>King Promotion</h4><ul>' +
            '<li>When a piece reaches the opposite end, it becomes a <strong>King</strong></li>' +
            '<li>Kings can move both forward and backward diagonally</li></ul>' +
            '<h4>Winning</h4><ul>' +
            '<li>Capture all of your opponent\'s pieces</li>' +
            '<li>Or block all of your opponent\'s legal moves</li></ul>',
        credits: '<h3>Checkers — Neon Edition</h3>' +
            '<h4>Game Design & Development</h4><p>Jake A. McCoy</p>' +
            '<h4>Publisher</h4><p><strong>magmacrunch media</strong></p>' +
            '<h4>Built With</h4><p>Vanilla HTML, CSS & JavaScript · Press Start 2P font · Neon retro aesthetic</p>' +
            '<h4>About</h4><p>Classic checkers with a neon arcade twist. Play against the AI opponent and master the art of multiple jumps!</p>'
    });
    </script>

    <!-- Game scripts. These are static on purpose: BoardGameTemplate.render()
         builds markup only — scripts it injected via insertAdjacentHTML never
         executed, which is why this game did not run at all. render() must
         still come first, since these bind to the DOM it creates. -->
    <script src="../shared/adenosine-multiplayer.js?v=b9b133a3"></script>
    <script>const { MP, MSG, MP_PALETTE } = AdMP;</script>
    <script src="../shared/mp-server.js?v=f66f285b"></script>
    <script>var MP_DEFAULT_SERVER = mpServerFor('checkers', 8770);</script>
    <script src="js/config.js?v=4b5e5751"></script>
    <script src="js/board.js?v=3c9607f2"></script>
    <script src="js/ai.js?v=0b387ae7"></script>
    <script src="js/game.js?v=e847d52d"></script>
    <script src="js/multiplayer.js?v=3cc7165b"></script>
    <script src="js/main.js?v=d8643bfc"></script>
    <link rel="stylesheet" href="../shared/chat-widget.css?v=550f1dd2">
    <script src="../shared/adenosine-chat.js?v=64b96c03"></script>
    <script>const { ChatWidget } = AdChat;</script>
    <script>ChatWidget.connect();</script>

</body>
</html>
