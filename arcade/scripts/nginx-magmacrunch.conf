# /etc/nginx/sites-available/magmacrunch
# Reverse proxy for magmacrunch.duckdns.org with SSL termination
#
# The name -> port mapping below must agree with arcade/shared/services.json,
# which is what chat-server.py, start-all.sh and scripts/bot-check-services.sh
# read. The blocks stay written out here because each needs a full proxy stanza,
# but services.json is the list; adding a game means an entry there and a
# location block here.

server {
    listen 80;
    server_name magmacrunch.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name magmacrunch.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/magmacrunch.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magmacrunch.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # MCP server — no nginx auth (API key passed in header, server on Tailscale).
    # The auth_request gate that used to sit here was removed on purpose: it
    # include'd /home/jake/arcade/mcp-api-key.conf, which does not exist on the
    # Pi, so nginx -t fails on the include and the reload is refused. Do not
    # reintroduce it without shipping that file first.
    location /mcp {
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://100.75.220.87:8785/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 100.75.220.87:8785;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Score backend (MAGMA//OPS admin server, admin/server.py).
    # server.py serves its dashboard on 8780 and the WebSocket on 8780+1=8781,
    # neither with TLS. Games on https://magmacrunch.com can only open a wss:
    # socket, so the score socket has to arrive through this block:
    #   wss://magmacrunch.duckdns.org/scores  ->  ws://127.0.0.1:8781/scores
    # The trailing URI is deliberately omitted from proxy_pass so the original
    # /scores path is forwarded; the websockets library ignores the path.
    location /scores {
        proxy_pass http://127.0.0.1:8781;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Hit counter (counter/counter-server.py), behind assets/counter-client.js,
    # which nav.js loads on every page.
    #
    # This block was missing, and its absence was invisible: without it /counter
    # fell through to `location /` below and landed on the chat server, which
    # accepted the socket and dropped {"action":"increment"} on the floor because
    # the message carries no `type`. count.json sat at 0 from the day it was
    # created while arcade-counter ran happily with no clients at all.
    location /counter {
        proxy_pass http://127.0.0.1:8783;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Multiplayer game servers ──────────────────────────────────────────────
    # Same situation as /scores above: the game servers on 8765-8774 carry no TLS,
    # and a page on https://magmacrunch.com can only open a wss: socket. Routing
    # them by path here means one certificate covers every game — naming the Pi as
    # cribbage.magmacrunch.com fails the handshake, because this cert is
    # single-name (CN=magmacrunch.duckdns.org) and the SAN does not match.
    #
    # The trailing URI is omitted from proxy_pass on purpose so the original path
    # is forwarded; the websockets library ignores it.
    # Clients build these values via arcade/shared/mp-server.js.

    location /sorry {          # SORRY!
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /cribbage {          # Cribbage
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /stud {          # Scandinavian Stud
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /chess {          # Chess
        proxy_pass http://127.0.0.1:8769;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /checkers {          # Checkers
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /backgammon {          # Backgammon
        proxy_pass http://127.0.0.1:8771;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /chinese-checkers {          # Chinese Checkers
        proxy_pass http://127.0.0.1:8772;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /parchisi {          # Parchisi
        proxy_pass http://127.0.0.1:8773;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /aggravation {          # Aggravation
        proxy_pass http://127.0.0.1:8774;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Private locations ─────────────────────────────────────────────────────
    # Unlisted pages served off this Pi, one file each in /etc/nginx/private.d/
    # on the Pi and in no repository. This repository is public, and those
    # pages are private by their URL: a location written here would publish
    # the path it protects. The first is the Block Island Simulator test
    # build, whose template lives in that game's (private) repository under
    # tools/deploy/. A glob that matches nothing is not an error, so a Pi
    # without the directory still passes nginx -t.
    include /etc/nginx/private.d/*.conf;

    # This hostname exists so browsers can reach the Pi's game sockets over TLS:
    # magmacrunch.com is a GitHub Pages CNAME, and this is the name on the
    # single-name Let's Encrypt cert. Every real endpoint is a location above.
    #
    # The root used to proxy to 127.0.0.1:8768, which made the chat server the
    # catch-all for anything unmatched. That ended with the chat widget, retired
    # 2026-10-12: no page loads it, each multiplayer game carries its own chat
    # relayed by its own server, and the arcade's MULTIPLAYER ONLINE dot now
    # probes /chess rather than this root.
    #
    # Certbot's nginx plugin inserts its own challenge location at renewal
    # rather than reaching through this one, so HTTP-01 does not depend on it.
    # Prove that with `sudo certbot renew --dry-run` after changing this block.
    location / {
        return 404;
    }
}

# The private arcade: arcade/private/server.py, password-gated, on its own
# hostname because the server is written root-relative throughout (the login
# form posts to /login, redirects go to /, the session cookie is Path=/), and a
# hostname needs none of that rewritten. Linked from the arcade's PRIVATE card.
# Plain HTTP for this name lands on the port-80 block above, which redirects to
# https://$host, so only this block is needed. Added 2026-10-15; until then
# 8782 was firewalled and the card timed out for every visitor.
#
# server.py trusts X-Real-IP only from loopback, for per-visitor login lockout,
# and must bind 127.0.0.1 (its config.json "bind") so nothing reaches it except
# through here.
server {
    listen 443 ssl;
    server_name private.magmacrunch.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/private.magmacrunch.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/private.magmacrunch.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8782;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
