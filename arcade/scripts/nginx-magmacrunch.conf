# /etc/nginx/sites-available/magmacrunch
# Reverse proxy for magmacrunch.duckdns.org with SSL termination

server {
    listen 80;
    server_name magmacrunch.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name magmacrunch.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/magmacrunch.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magmacrunch.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # MCP server auth endpoint (internal)
    location = /mcp-auth {
        internal;
        include /home/jake/arcade/mcp-api-key.conf;

        # Extract Bearer token from Authorization header
        set $auth_token "";
        if ($http_authorization ~ "^Bearer (.+)$") {
            set $auth_token $1;
        }

        # Return 200 if token matches, 401 otherwise
        if ($auth_token = $mcp_api_key) {
            return 200 "ok";
        }
        return 401 '{"error":"Unauthorized"}';
    }

    # MCP server — proxied with auth
    location /mcp {
        auth_request /mcp-auth;
        auth_request_set $auth_status $upstream_status;

        proxy_pass http://127.0.0.1:8785/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8785;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
