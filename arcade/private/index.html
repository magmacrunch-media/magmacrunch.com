<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIVATE ARCADE</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔒</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
  <a href="../" class="mc-back">magmacrunch arcade</a>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="container">
    <!-- Lock icon -->
    <div class="lock-icon">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="12" y="28" width="40" height="32" rx="4" stroke="#ff3d6e" stroke-width="3" fill="none"/>
        <path d="M20 28V20C20 13.4 25.4 8 32 8C38.6 8 44 13.4 44 20V28" stroke="#ff3d6e" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="32" cy="42" r="4" fill="#ff3d6e"/>
        <line x1="32" y1="46" x2="32" y2="52" stroke="#ff3d6e" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Title -->
    <h1 class="title">PRIVATE</h1>
    <p class="subtitle">// access restricted //</p>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Login form -->
    <form class="login-form" action="/login" method="POST">
      <label class="input-label" for="password">ENTER ACCESS CODE:</label>
      <div class="input-wrap">
        <input
          type="password"
          id="password"
          name="password"
          class="password-input"
          autocomplete="off"
          autofocus
          spellcheck="false"
        />
        <button type="submit" class="submit-btn">»</button>
      </div>
      <!--ERROR_PLACEHOLDER-->
    </form>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Footer -->
    <p class="footer-text">MAGMACRUNCH PRIVATE ARCADE</p>
    <p class="footer-sub">AUTHORIZED PERSONNEL ONLY</p>
  </div>

  <script>
    // Focus password input on load
    document.getElementById('password').focus();
  </script>
</body>
</html>
