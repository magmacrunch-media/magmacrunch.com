<body>

<header>
    <div class="header-left">
        <h1 class="glitch" data-text="magnolia api">magnolia api</h1>
        <span class="header-stat">v<span>0.3.0</span></span>
    </div>
    <div class="header-right">
        <span class="header-stat">128 functions · 12 modules</span>
    </div>
</header>

<nav class="tool-nav">
    <a href="index.html" class="back-link">&larr; magnolia</a>
</nav>

<main>
    <div class="search-row">
        <input type="text" id="search-input" class="search-input" placeholder="$ grep -i function name...">
        <button id="search-clear" class="search-clear">CLEAR</button>
    </div>

    <div class="module-tabs">
        <button class="module-tab active" data-module="all">All</button>
        <button class="module-tab" data-module="core">core</button>
        <button class="module-tab" data-module="renderer">renderer</button>
        <button class="module-tab" data-module="sprite">sprite</button>
        <button class="module-tab" data-module="input">input</button>
        <button class="module-tab" data-module="clock">clock</button>
        <button class="module-tab" data-module="audio">audio</button>
        <button class="module-tab" data-module="scoring">scoring</button>
        <button class="module-tab" data-module="prefs">prefs</button>
        <button class="module-tab" data-module="gamestate">gamestate</button>
        <button class="module-tab" data-module="menu">menu</button>
        <button class="module-tab" data-module="theme">theme</button>
        <button class="module-tab" data-module="ui_utils">ui_utils</button>
    </div>

    <div class="stats-bar">
        <span class="stat-count" id="stats">loading...</span>
        <span class="stat-sep">|</span>
        <span>12 modules</span>
    </div>

    <div id="api-modules"></div>
</main>

<footer>

    <div class="footer-right"><span>magmacrunch</span> media</div>
