<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>adenosine playground — magmacrunch media</title>
  <meta property="og:title" content="adenosine playground — magmacrunch media">
  <meta property="og:description" content="live code editor for adenosine game engine packages">
  <meta property="og:image" content="https://magmacrunch.com/og/tools.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Courier+Prime:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><code>adenosine</code> playground</h1>
    <div class="controls">
      <select id="pkg-select">
        <option value="rpg">rpg</option>
        <option value="puzzle">puzzle</option>
        <option value="cards">cards</option>
        <option value="audio">audio</option>
        <option value="score-client">score-client</option>
        <option value="multiplayer">multiplayer</option>
        <option value="chat">chat</option>
      </select>
      <select id="example-select"></select>
      <button id="run" class="primary" title="Ctrl+Enter">&#9654; Run</button>
      <button id="reset" title="Reset editor to example default">Reset</button>
      <div class="source-toggle">
        <label><input type="radio" name="source" value="cdn" checked><span>CDN</span></label>
        <label><input type="radio" name="source" value="local"><span>Local</span></label>
      </div>
    </div>
  </header>

  <nav id="auto-nav" data-depth="../../../"></nav>

  <nav class="tool-nav">
    <a href="./" class="back-link">&larr; adenosine</a>
  </nav>

  <main>
    <div id="editor-panel"></div>
    <div id="divider"></div>
    <div id="output-panel">
      <div id="output-content">
        <div class="empty-state">Click &#9654; Run to execute the code</div>
      </div>
      <div id="console-log"></div>
    </div>
  </main>

  <footer>
    <span id="status-pkg">pkg: —</span>
    <span id="status-version">v: —</span>
    <span id="status-globals">globals: —</span>
    <span id="status-ready"><span class="dot ok"></span>ready</span>
  </footer>

  <script type="module" src="playground.js"></script>
  <script src="../../../nav.js"></script>
</body>
</html>
