<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media//search — magmacrunch media</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

    <header>
        <div class="header-left">
            <h1 class="glitch" data-text="MEDIA//SEARCH">MEDIA//SEARCH</h1>
        </div>
        <div class="header-right">
            <span class="sys-stat" id="resultCount">0 RESULTS</span>
            <button class="btn-settings" id="btnSettings" title="Settings">&#9881;</button>
        </div>
    </header>

    <div class="workspace">
        <!-- LEFT PANEL: Filters -->
        <aside class="panel filters-panel">
            <div class="panel-label">SOURCES</div>
            <div id="sourceToggles" class="source-toggles"></div>

            <div class="panel-divider"></div>

            <div class="panel-label">TYPE</div>
            <select id="filterType" class="select-retro">
                <option value="all">ALL</option>
                <option value="image">PHOTOS</option>
                <option value="illustration">ILLUSTRATIONS</option>
                <option value="video">VIDEO</option>
                <option value="audio">AUDIO</option>
            </select>

            <div class="panel-divider"></div>

            <div class="panel-label">LICENSE</div>
            <select id="filterLicense" class="select-retro">
                <option value="all">ALL</option>
                <option value="pd">PUBLIC DOMAIN</option>
                <option value="cc0">CC0</option>
                <option value="free">NO ATTRIBUTION</option>
            </select>

            <div class="panel-divider"></div>

            <div class="panel-label">ORIENTATION</div>
            <select id="filterOrientation" class="select-retro">
                <option value="all">ALL</option>
                <option value="horizontal">HORIZONTAL</option>
                <option value="vertical">VERTICAL</option>
                <option value="square">SQUARE</option>
            </select>
        </aside>

        <!-- CENTER: Search + Results -->
        <div class="center-area">
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="SEARCH FREE IMAGES, VIDEO, AUDIO..." autocomplete="off">
                <button id="btnSearch" class="btn btn-rose">GO</button>
            </div>

            <div id="resultsGrid" class="results-grid">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">&#9670;</div>
                    <div class="empty-text">SEARCH ACROSS FREE MEDIA SOURCES</div>
                    <div class="empty-sub">Pexels, Pixabay, Openverse, Met Museum, Smithsonian, Internet Archive</div>
                </div>
            </div>

            <div id="loadingBar" class="loading-bar hidden">
                <div class="loading-spinner"></div>
                <span>SEARCHING...</span>
            </div>

            <button id="btnLoadMore" class="btn btn-cyan load-more-btn hidden">LOAD MORE</button>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox hidden">
        <div class="lightbox-header">
            <div class="lightbox-nav">
                <button id="lbPrev" class="lb-nav-btn" title="Previous">&larr;</button>
                <button id="lbNext" class="lb-nav-btn" title="Next">&rarr;</button>
            </div>
            <span id="lbCounter" class="lb-counter"></span>
            <button id="lbClose" class="lb-close">&times;</button>
        </div>
        <div class="lightbox-body" id="lightboxBody"></div>
        <div class="lightbox-footer">
            <div class="lightbox-info">
                <div id="lbTitle" class="lb-title"></div>
                <div id="lbMeta" class="lb-meta"></div>
            </div>
            <div class="lightbox-actions">
                <a id="lbOpenTab" class="btn btn-cyan btn-sm" href="#" target="_blank" rel="noopener">OPEN IN TAB</a>
                <a id="lbDownload" class="btn btn-green btn-sm" href="#" download>DOWNLOAD</a>
                <button id="lbCopyUrl" class="btn btn-yellow btn-sm">COPY URL</button>
            </div>
        </div>
    </div>

    <!-- Settings modal -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">SETTINGS</div>
            <div class="setting-group">
                <label class="setting-label">MAGMA//OPS HOST</label>
                <input type="text" id="settingPiHost" class="setting-input" placeholder="http://192.168.1.16:8780">
                <p class="setting-hint">Used to fetch API keys. Leave blank to disable.</p>
            </div>
            <div class="setting-group">
                <label class="setting-label">RESULTS PER PAGE</label>
                <select id="settingPerPage" class="select-retro">
                    <option value="12">12</option>
                    <option value="24" selected>24</option>
                    <option value="48">48</option>
                </select>
            </div>
            <div class="modal-btns">
                <button id="settingsCancel" class="btn btn-rose btn-sm">CANCEL</button>
                <button id="settingsSave" class="btn btn-green btn-sm">SAVE</button>
            </div>
        </div>
    </div>

    <footer>
        <span class="footer-text">MEDIA//SEARCH v1.0 &mdash; MAGMACRUNCH MEDIA</span>
    </footer>

    <script src="js/cache.js"></script>
    <script src="js/providers/openverse.js"></script>
    <script src="js/providers/pexels.js"></script>
    <script src="js/providers/pixabay.js"></script>
    <script src="js/providers/met-museum.js"></script>
    <script src="js/providers/smithsonian.js"></script>
    <script src="js/providers/internet-archive.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
