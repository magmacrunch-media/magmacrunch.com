name: Backup MusicBrainz Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The repo's own script, not magmascript's Python port of it: the ports
      # drift, and no magmascript release from 3.2.2 can run a domain command.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run backup
        run: node scripts/backup-musicbrainz.mjs --skip-existing
        env:
          MAGMA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/_cache/
          git diff --cached --quiet || git commit -m "Update MusicBrainz cache"
          git push
