name: Generate Archive Stubs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/archive-stubs.json'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate stubs
        run: node scripts/generate-archive-stubs.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ templates/entity-map.js scripts/backup-musicbrainz.mjs scripts/archive-stubs.json
          git diff --cached --quiet || git commit -m "Generate archive stubs"
          git push
