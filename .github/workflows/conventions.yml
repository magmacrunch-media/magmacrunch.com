# Calls the house conventions check, which lives in magmacrunch-media/.github.
#
# That host is PUBLIC, and a public repo's reusable workflows are callable from
# every repo in the org with no token. A private host would need access granted
# per consumer, which is 42 settings pages.
#
# WHY THIS REPO WANTS IT. `em-dash-status.sh --install-all` refuses to clobber an
# existing pre-commit hook, and this repo has one of its own, the `?v=`
# cache-buster straddle guard. So nothing here has ever checked the house
# conventions, in the largest repo in the tree, and a hook would not have
# reached a collaborator's clone anyway.
#
# Public repo, so these minutes are free and this adds nothing to the
# 2,000-minute allowance the private repos share.
#
# NO exclude list, and that is a deliberate simplification rather than an
# oversight. An earlier version excluded nine generated paths so a strict em
# dash gate would not fail this repo's eleven self-committing workflows, whose
# output carries hundreds of dashes from MusicBrainz titles. The gate is a
# COUNT and a warning now, so there is nothing to exclude: those workflows
# report a number and carry on. The checks that actually fail are mechanical
# ones that generated content passes anyway.

name: conventions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    uses: magmacrunch-media/.github/.github/workflows/conventions-check.yml@main
