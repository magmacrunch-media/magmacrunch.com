name: Sync magmascript playground

# Keeps tools/magmascript/app.js (the browser playground's embedded interpreter)
# in step with the published magmascript package. The embedded copy drifts every
# time the language changes; this reinstalls the latest release and regenerates
# the block. Runs weekly, or on demand after a magmascript release.

on:
  schedule:
    - cron: "17 8 * * 1"   # Mondays 08:17 UTC (offset from other scheduled jobs)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest magmascript
        run: pip install --upgrade magmascript

      - name: Regenerate the embedded interpreter
        run: python scripts/sync-playground.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/magmascript/app.js
          if git diff --cached --quiet; then
            echo "Playground already up to date."
          else
            VERSION=$(python -c "import magmascript; print(magmascript.__version__)")
            git commit -m "chore(playground): sync interpreter to magmascript ${VERSION}"
            git push
          fi
