name: Sync magmascript playground

# Keeps ware/magmascript/app.js (the browser playground's embedded interpreter)
# in step with the published magmascript package. The embedded copy drifts every
# time the language changes; this reinstalls the latest release and regenerates
# the block. The magmascript release workflow dispatches this the moment a
# version lands on PyPI; the weekly schedule is a backstop in case that
# dispatch ever fails.

on:
  schedule:
    - cron: "17 8 * * 1"   # Mondays 08:17 UTC (offset from other scheduled jobs)
  workflow_dispatch:
  repository_dispatch:
    types: [magmascript-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A release dispatch names the version it just published — pin to it so a
      # stale PyPI CDN edge fails the job loudly instead of silently embedding
      # the previous release. Scheduled and manual runs take whatever is latest.
      - name: Install magmascript
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          if [ -n "$VERSION" ]; then
            pip install "magmascript==${VERSION}"
          else
            pip install --upgrade magmascript
          fi

      - name: Regenerate the embedded interpreter
        run: python scripts/sync-playground.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ware/magmascript/app.js
          if git diff --cached --quiet; then
            echo "Playground already up to date."
          else
            VERSION=$(python -c "import magmascript; print(magmascript.__version__)")
            git commit -m "chore(playground): sync interpreter to magmascript ${VERSION}"
            git push
          fi
