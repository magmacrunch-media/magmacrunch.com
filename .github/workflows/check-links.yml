name: Check Links

on:
  workflow_dispatch:

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >-
            --verbose
            --no-progress
            --cache
            --max-cache-age 1d
            --exclude-all-private
            --exclude '/login'
            --accept 200,202,204,403,429
            --max-retries 2
            --retry-wait-time 2
            --timeout 30
            --max-concurrency 64
            --format markdown
            './**/*.html'
            './**/*.md'

      - name: Save lychee cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.lychee.outputs.cache-primary-key }}

      - name: Create issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f ./lychee/out.md ]; then
            cp ./lychee/out.md /tmp/issue-body.md
          else
            echo "No details available." > /tmp/issue-body.md
          fi
          echo "" >> /tmp/issue-body.md
          echo "---" >> /tmp/issue-body.md
          echo "*Created by check-links workflow*" >> /tmp/issue-body.md
          gh issue create \
            --title "Broken links detected (${{ github.ref_name }})" \
            --body-file /tmp/issue-body.md \
            --label "automated issue,broken-links"

      - name: Post to Discord
        if: steps.lychee.outputs.exit_code != 0
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cat > discord-payload.json << ENDOFJSON
          {
            "embeds": [{
              "title": "Broken Links Detected",
              "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "Link checker found broken links in \`${{ github.ref_name }}\`.\n\nA GitHub issue has been created with the full report.",
              "color": 16750848,
              "footer": {
                "text": "Check Links · ${{ github.repository }}"
              }
            }]
          }
          ENDOFJSON
          curl -s -H "Content-Type: application/json" \
               -d @discord-payload.json \
               "$DISCORD_WEBHOOK_URL"

      - name: Fail on broken links
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
