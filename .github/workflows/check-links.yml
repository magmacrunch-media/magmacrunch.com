name: Check Links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >-
            --verbose
            --no-progress
            --cache
            --max-cache-age 1d
            --exclude-all-private
            --accept 200,202,204,403,429
            --max-retries 2
            --retry-wait-time 2
            --timeout 30
            --max-concurrency 64
            --format markdown
            './**/*.html'
            './**/*.md'

      - name: Save lychee cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.lychee.outputs.cache-primary-key }}

      - name: Create issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('./lychee/out.md', 'utf8');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.name,
              title: `Broken links detected (${{ github.ref_name }})`,
              body: body + '\n\n---\n*Created by check-links workflow*',
              labels: ['automated issue', 'broken-links']
            });

      - name: Fail on broken links
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
