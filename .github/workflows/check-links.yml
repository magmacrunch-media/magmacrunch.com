name: Check Links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >-
            --verbose
            --no-progress
            --cache
            --max-cache-age 1d
            --exclude-all-private
            --accept 200,204,403,429
            --max-retries 2
            --retry-wait-time 2
            --timeout 30
            --max-concurrency 64
            --format markdown
            './**/*.html'
            './**/*.md'

      - name: Save lychee cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.lychee.outputs.cache-primary-key }}

      - name: Post to Discussion
        if: steps.lychee.outputs.exit_code != 0
        uses: abirismyname/create-discussion@v2.1.0
        with:
          title: "Broken links detected (${{ github.ref_name }})"
          body-filepath: ./lychee/out.md
          category-name: "Link Reports"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on broken links
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
