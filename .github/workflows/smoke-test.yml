name: Arcade Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: arcade/tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: arcade/tests
        run: npx playwright install chromium

      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 8080 &
          sleep 1

      - name: Run smoke tests
        id: tests
        working-directory: arcade/tests
        shell: bash
        run: |
          node smoke-test.mjs 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Create issue on failure
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsPath = path.join(process.env.GITHUB_WORKSPACE, 'arcade/tests/results.md');
            const body = fs.readFileSync(resultsPath, 'utf8');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.name,
              title: `Smoke test failed — ${new Date().toISOString().split('T')[0]}`,
              body: body + '\n\n---\n*Created by smoke-test workflow*',
              labels: ['automated issue', 'bug']
            });

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
