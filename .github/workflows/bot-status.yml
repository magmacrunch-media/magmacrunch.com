name: Bot Status Report

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  discussions: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate status report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > status-report.md << 'REPORT'
          # Bot Status Report

          REPORT

          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> status-report.md
          echo "" >> status-report.md
          echo "| Bot | Last Run | Status | Trigger |" >> status-report.md
          echo "|---|---|---|---|" >> status-report.md

          # List of workflows to check
          WORKFLOWS=(
            "CI:ci.yml"
            "Deploy to Pi:deploy-pi.yml"
            "Check Links:check-links.yml"
            "Check Pi Services:check-services.yml"
            "Rebuild Search Index:rebuild-search-index.yml"
            "Generate Archive Stubs:generate-stubs.yml"
            "Bake Cache:bake-cache.yml"
            "Weekly High Scores:weekly-scores.yml"
            "MusicBrainz Backup:backup-musicbrainz.yml"
            "TMDB Backup:backup-tmdb.yml"
            "Bot Status Report:bot-status.yml"
          )

          for entry in "${WORKFLOWS[@]}"; do
            NAME="${entry%%:*}"
            FILE="${entry##*:}"

            # Get the most recent run
            RUN_JSON=$(gh run list --workflow="$FILE" --limit=1 --json=status,conclusion,createdAt,event,displayTitle -q '.[0]' 2>/dev/null || echo "")

            if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
              echo "| $NAME | never | — | — |" >> status-report.md
              continue
            fi

            STATUS=$(echo "$RUN_JSON" | jq -r '.conclusion // .status')
            CREATED=$(echo "$RUN_JSON" | jq -r '.createdAt')
            EVENT=$(echo "$RUN_JSON" | jq -r '.event')

            # Convert timestamp to relative time
            if [ "$STATUS" = "success" ]; then
              ICON="✓"
            elif [ "$STATUS" = "in_progress" ]; then
              ICON="⏳"
              STATUS="running"
            elif [ "$STATUS" = "queued" ]; then
              ICON="⏳"
              STATUS="queued"
            else
              ICON="✗"
            fi

            # Format relative time
            CREATED_TS=$(date -d "$CREATED" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            DIFF=$((NOW_TS - CREATED_TS))

            if [ "$DIFF" -lt 3600 ]; then
              REL_TIME="$((DIFF / 60))m ago"
            elif [ "$DIFF" -lt 86400 ]; then
              REL_TIME="$((DIFF / 3600))h ago"
            else
              REL_TIME="$((DIFF / 86400))d ago"
            fi

            # Map event to trigger description
            case "$EVENT" in
              push) TRIGGER="push to main" ;;
              schedule) TRIGGER="schedule" ;;
              workflow_dispatch) TRIGGER="manual" ;;
              workflow_run) TRIGGER="after backup" ;;
              pull_request) TRIGGER="PR" ;;
              *) TRIGGER="$EVENT" ;;
            esac

            echo "| $NAME | $REL_TIME | $ICON $STATUS | $TRIGGER |" >> status-report.md
          done

          echo "" >> status-report.md
          echo "---" >> status-report.md
          echo "*Generated by GitHub Actions*" >> status-report.md

      - name: Post to Discussion
        uses: abirismyname/create-discussion@v2.1.0
        with:
          title: "Bot Status — ${{ github.event.schedule || 'manual' }}"
          body-filepath: ./status-report.md
          category-name: "Bot Updates"
          github-token: ${{ secrets.GITHUB_TOKEN }}
