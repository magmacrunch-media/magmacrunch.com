name: Bot Status Report

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  discussions: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the Pi-bot section dates each bot by the last commit
          # it made, and the default shallow clone has no such history to read.
          fetch-depth: 0

      - name: Generate status report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > status-report.md << 'REPORT'
          # Bot Status Report

          REPORT

          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> status-report.md
          echo "" >> status-report.md
          echo "| Bot | Last Run | Status | Trigger |" >> status-report.md
          echo "|---|---|---|---|" >> status-report.md

          # List of GH Actions workflows to check
          # (Pi-managed bots run via cron on the Pi — not tracked here)
          WORKFLOWS=(
            "CI:ci.yml"
            "Deploy to Pi:deploy-pi.yml"
            "Check Archive Format:check-archive-format.yml"
            "Generate Archive Stubs:generate-stubs.yml"
            "Bake Cache:bake-cache.yml"
            "Bot Status Report:bot-status.yml"
          )

          # Pi-managed bots (crontab on the Pi — see arcade/scripts/bot-*.sh).
          #
          # These cannot be polled from here: the Pi answers only on Tailscale,
          # and a GitHub-hosted runner has no route to it. So report the
          # evidence that IS visible from the repo — the commit each bot makes
          # when it succeeds — and say so plainly for the bots that leave no
          # trace, rather than claiming they are healthy.
          #
          # This block previously printed "✓ active" for all eight bots
          # unconditionally, checking nothing. It did that straight through a
          # two-week outage (2026-08-22 → 2026-09-05) in which every Pi bot
          # exited before doing any work, and reported them all healthy on
          # 2026-08-24 and again on 2026-08-31.
          #
          # Format — name : the bot's own commit subject : stale after N days
          # An empty subject means success leaves no trace in this repo.
          #
          # Keyed on the commit SUBJECT, not on the paths the bot writes: a
          # human editing search-index.json makes a dead Search Index bot look
          # fresh, whereas these subjects are written by nothing but the bot.
          PI_BOTS=(
            "MusicBrainz Backup (Pi):Update MusicBrainz cache:8"
            "TMDB Backup (Pi):Update TMDB cache:8"
            "Play Counts (Pi):Update Last.fm play counts:8"
            "Weekly Scores (Pi):Update score data:8"
            "Search Index (Pi):Rebuild search index:2"
            "Link Checker (Pi)::"
            "Service Health (Pi)::"
            "Smoke Test (Pi)::"
          )

          for entry in "${WORKFLOWS[@]}"; do
            NAME="${entry%%:*}"
            FILE="${entry##*:}"

            # Get the most recent run
            RUN_JSON=$(gh run list --workflow="$FILE" --limit=1 --json=status,conclusion,createdAt,event,displayTitle -q '.[0]' 2>/dev/null || echo "")

            if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
              echo "| $NAME | never | — | — |" >> status-report.md
              continue
            fi

            STATUS=$(echo "$RUN_JSON" | jq -r '.conclusion // .status')
            CREATED=$(echo "$RUN_JSON" | jq -r '.createdAt')
            EVENT=$(echo "$RUN_JSON" | jq -r '.event')

            # Convert timestamp to relative time
            if [ "$STATUS" = "success" ]; then
              ICON="✓"
            elif [ "$STATUS" = "in_progress" ]; then
              ICON="⏳"
              STATUS="running"
            elif [ "$STATUS" = "queued" ]; then
              ICON="⏳"
              STATUS="queued"
            else
              ICON="✗"
            fi

            # Format relative time
            CREATED_TS=$(date -d "$CREATED" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            DIFF=$((NOW_TS - CREATED_TS))

            if [ "$DIFF" -lt 3600 ]; then
              REL_TIME="$((DIFF / 60))m ago"
            elif [ "$DIFF" -lt 86400 ]; then
              REL_TIME="$((DIFF / 3600))h ago"
            else
              REL_TIME="$((DIFF / 86400))d ago"
            fi

            # Map event to trigger description
            case "$EVENT" in
              push) TRIGGER="push to main" ;;
              schedule) TRIGGER="schedule" ;;
              workflow_dispatch) TRIGGER="manual" ;;
              workflow_run) TRIGGER="after backup" ;;
              pull_request) TRIGGER="PR" ;;
              *) TRIGGER="$EVENT" ;;
            esac

            echo "| $NAME | $REL_TIME | $ICON $STATUS | $TRIGGER |" >> status-report.md
          done

          echo "" >> status-report.md
          echo "---" >> status-report.md
          echo "" >> status-report.md
          echo "## Pi-Managed Bots" >> status-report.md
          echo "" >> status-report.md
          echo "These run via cron on the Raspberry Pi (see \`arcade/scripts/bot-*.sh\`)." >> status-report.md
          echo "The Pi is not reachable from this runner, so each bot is dated by the" >> status-report.md
          echo "last commit it made. A bot that leaves no artifact on success cannot be" >> status-report.md
          echo "verified from here and is reported as such — not as healthy." >> status-report.md
          echo "" >> status-report.md
          echo "| Bot | Last Commit | Status | Trigger |" >> status-report.md
          echo "|---|---|---|---|" >> status-report.md

          NOW_TS=$(date +%s)
          for entry in "${PI_BOTS[@]}"; do
            NAME="${entry%%:*}"
            REST="${entry#*:}"
            SUBJECT="${REST%:*}"
            MAX_AGE="${REST##*:}"

            if [ -z "$SUBJECT" ]; then
              echo "| $NAME | — | ? no signal | cron |" >> status-report.md
              continue
            fi

            LAST=$(git log -1 --format=%cI --grep="^${SUBJECT}\$" 2>/dev/null || echo "")
            if [ -z "$LAST" ]; then
              echo "| $NAME | never | ✗ has never committed | cron |" >> status-report.md
              PI_PROBLEM=1
              continue
            fi

            LAST_TS=$(date -d "$LAST" +%s 2>/dev/null || echo 0)
            AGE_D=$(( (NOW_TS - LAST_TS) / 86400 ))

            if [ "$AGE_D" -gt "$MAX_AGE" ]; then
              echo "| $NAME | ${AGE_D}d ago | ✗ STALE (expected < ${MAX_AGE}d) | cron |" >> status-report.md
              PI_PROBLEM=1
            else
              echo "| $NAME | ${AGE_D}d ago | ✓ fresh | cron |" >> status-report.md
            fi
          done

          if [ "${PI_PROBLEM:-0}" = "1" ]; then
            echo "" >> status-report.md
            echo "> **A Pi bot is stale.** Check that the cron bots are still running:" >> status-report.md
            echo "> \`ssh jake@100.74.172.4 'tail -30 ~/arcade/logs/services.log'\`" >> status-report.md
            echo "> A bot that dies in \`pi-bot-env.sh\` produces no output at all." >> status-report.md
          fi

          echo "" >> status-report.md
          echo "---" >> status-report.md
          echo "*Generated by GitHub Actions*" >> status-report.md

      - name: Post to Discussion
        uses: abirismyname/create-discussion@v2.1.0
        with:
          title: "Bot Status — ${{ github.event.schedule || 'manual' }}"
          body-filepath: ./status-report.md
          category-name: "General"
          github-token: ${{ secrets.GITHUB_TOKEN }}
