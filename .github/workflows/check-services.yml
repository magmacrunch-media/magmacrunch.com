name: Check Pi Services

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    permissions:
      discussions: write
    steps:
      - name: Check service health
        id: health
        run: |
          PI=192.168.1.16
          FAILED=""
          for entry in \
            "8765:SORRY" "8766:Cribbage" "8767:Stud" "8768:Chat" \
            "8769:Chess" "8770:Checkers" "8771:Backgammon" \
            "8772:ChineseCheckers" "8773:Parchisi" "8774:Aggravation" \
            "8783:Counter"; do
            PORT="${entry%%:*}"
            NAME="${entry##*:}"
            if nc -z -w2 "$PI" "$PORT" 2>/dev/null; then
              echo "✓ $NAME (:$PORT)"
            else
              echo "✗ $NAME (:$PORT)"
              FAILED="$FAILED $NAME"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Down services:$FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### All services healthy ✓" >> "$GITHUB_STEP_SUMMARY"

      - name: Write failure report
        if: failure()
        run: |
          cat > ./service-report.md << 'EOF'
          # Pi Service Health Check Failed

          Some services on the Pi are not responding.

          ## Check the workflow run

          [View run details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ## Quick diagnosis

          ```bash
          ssh jake@192.168.1.16 "sudo systemctl status 'arcade-*' --no-pager"
          ```

          ## Restart a service

          ```bash
          ssh jake@192.168.1.16 "sudo systemctl restart arcade-<name>"
          ```
          EOF

      - name: Post to Discussion
        if: failure()
        uses: abirismyname/create-discussion@v2.1.0
        with:
          title: "Pi services down — ${{ github.run_id }}"
          body-filepath: ./service-report.md
          category-name: "Service Health"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FAILED="${{ steps.health.outputs.failed }}"
          SERVICE_LIST=$(echo "$FAILED" | sed 's/^[[:space:]]*//' | sed 's/ /\\n- /g')
          cat > discord-payload.json << ENDOFJSON
          {
            "embeds": [{
              "title": "⚠️ Arcade Services Down",
              "description": "**The following services are not responding:**\n- ${SERVICE_LIST}",
              "fields": [
                {
                  "name": "Diagnose",
                  "value": "\`\`\`bash\nssh jake@192.168.1.16 'sudo systemctl status arcade-* --no-pager'\n\`\`\`"
                },
                {
                  "name": "Restart all",
                  "value": "\`\`\`bash\nssh jake@192.168.1.16 'sudo systemctl restart arcade-*'\n\`\`\`"
                }
              ],
              "color": 16750848,
              "footer": {
                "text": "Service Health Check · every 30 min"
              }
            }]
          }
          ENDOFJSON
          curl -s -H "Content-Type: application/json" \
               -d @discord-payload.json \
               "$DISCORD_WEBHOOK_URL"
