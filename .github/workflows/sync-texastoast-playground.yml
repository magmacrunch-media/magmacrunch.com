name: Sync texastoast playground

# Keeps tools/texastoast/app.js (the browser playground's embedded engine) in
# step with the published texastoast package. The embedded copy drifts every
# time the engine changes, and a playground demonstrating behaviour the
# installed package no longer has is worse than none; this reinstalls the
# latest release and regenerates the block. Runs weekly, or on demand after a
# texastoast release.

on:
  schedule:
    - cron: "29 8 * * 1"   # Mondays 08:29 UTC (offset from other scheduled jobs)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest texastoast
        run: pip install --upgrade texastoast

      - name: Regenerate the embedded engine
        run: python scripts/sync-texastoast-playground.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/texastoast/app.js
          if git diff --cached --quiet; then
            echo "Playground already up to date."
          else
            VERSION=$(python -c "import texastoast; print(texastoast.__version__)")
            git commit -m "chore(playground): sync engine to texastoast ${VERSION}"
            git push
          fi
