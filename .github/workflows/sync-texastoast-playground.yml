name: Sync texastoast playground

# Keeps ware/texastoast/app.js (the browser playground's embedded engine) in
# step with the published texastoast package. The embedded copy drifts every
# time the engine changes, and a playground demonstrating behaviour the
# installed package no longer has is worse than none; this reinstalls the
# latest release and regenerates the block. The texastoast release workflow
# dispatches this the moment a version lands on PyPI; the weekly schedule is a
# backstop in case that dispatch ever fails.

on:
  schedule:
    - cron: "29 8 * * 1"   # Mondays 08:29 UTC (offset from other scheduled jobs)
  workflow_dispatch:
  repository_dispatch:
    types: [texastoast-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A release dispatch names the version it just published — pin to it so a
      # stale PyPI CDN edge fails the job loudly instead of silently embedding
      # the previous release. Scheduled and manual runs take whatever is latest.
      - name: Install texastoast
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          if [ -n "$VERSION" ]; then
            pip install "texastoast==${VERSION}"
          else
            pip install --upgrade texastoast
          fi

      - name: Regenerate the embedded engine
        run: python scripts/sync-texastoast-playground.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ware/texastoast/app.js
          if git diff --cached --quiet; then
            echo "Playground already up to date."
          else
            VERSION=$(python -c "import texastoast; print(texastoast.__version__)")
            git commit -m "chore(playground): sync engine to texastoast ${VERSION}"
            git push
          fi
