name: Weekly High Scores

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate summary
        run: node scripts/weekly-scores.mjs > scores-report.md

      - name: Post to Discussion
        uses: abirismyname/create-discussion@v2.1.0
        with:
          title: "Weekly High Scores — ${{ github.event.schedule || 'manual' }}"
          body-filepath: ./scores-report.md
          category-name: "High Scores"
          github-token: ${{ secrets.GITHUB_TOKEN }}
