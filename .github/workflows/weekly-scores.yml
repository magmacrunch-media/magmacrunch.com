name: Weekly High Scores

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install magmascript
        run: pip install magmascript

      - name: Generate and post to Discussion
        run: magmascript scores report --post-discussion
        env:
          MAGMA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(magmascript scores report --discord)
          echo "$PAYLOAD" | jq '{flags: 4096, embeds: .embeds}' > discord-payload.json
          curl -s -H "Content-Type: application/json" \
               -d @discord-payload.json \
               "$DISCORD_WEBHOOK_URL"
