name: Fetch Play Counts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The repo's own script, not magmascript's Python port of it: the ports
      # drift, and no magmascript release from 3.2.2 can run a domain command.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch play counts from Last.fm
        run: node scripts/fetch-play-counts.mjs --skip-existing
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arcade/admin/stats/lastfm/ scripts/play-counts.json
          git diff --cached --quiet || git commit -m "Update Last.fm play counts"
          git push
