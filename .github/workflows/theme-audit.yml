name: Theme Audit

on:
  push:
    branches: [main]
    paths:
      - '**/*.css'
      - '**/*.html'
      - 'arcade/admin/static/theme.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install canvas dependency
        run: npm install @napi-rs/canvas

      - name: Generate theme audit
        run: node scripts/generate-theme-audit.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add og/theme-audit.png theme-audit.json
          git diff --cached --quiet || git commit -m "Update theme color audit"
          git push
