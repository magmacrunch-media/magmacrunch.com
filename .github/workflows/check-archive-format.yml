name: Check Archive Format

on:
  push:
    branches: [main]
    paths: ['archive/**']
  pull_request:
    branches: [main]
    paths: ['archive/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install magmascript
        run: pip install magmascript

      - name: Run checker
        id: check
        run: |
          magmascript archive check-format --json > /tmp/check-result.json || true
          COUNT=$(python3 -c "
          import json
          d = json.load(open('/tmp/check-result.json'))
          if isinstance(d, list):
              print(len(d))
          elif isinstance(d, dict):
              print(d.get('count', 0))
          else:
              print(0)
          ")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Build issue body
        if: steps.check.outputs.count != '0'
        id: body
        run: |
          COUNT=${{ steps.check.outputs.count }}
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          WARNINGS=$(python3 -c "
          import json
          d = json.load(open('/tmp/check-result.json'))
          if isinstance(d, list):
              warnings = d
          elif isinstance(d, dict):
              warnings = d.get('warnings', [])
          else:
              warnings = []
          lines = ['WARN  ' + w['file'] + ':' + str(w['line']) + '\n      ' + w['msg'] for w in warnings]
          print('\n\n'.join(lines))
          ")

          cat > /tmp/issue-body.md << BODY
          ## Archive format warnings

          **${COUNT}** warning${COUNT == 1 ? '' : 's'} found on \`${BRANCH}\` (${SHA})

          \`\`\`
          ${WARNINGS}
          \`\`\`

          ---
          [View workflow run](${RUN_URL})
          BODY

      - name: Find existing issue
        if: steps.check.outputs.count != '0'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --search "Archive format warnings in:title" --state open --json number --limit 1)
          NUMBER=$(echo "$ISSUE" | python3 -c "import json,sys; a=json.load(sys.stdin); print(a[0]['number'] if a else '')")
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create or update issue
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER=${{ steps.existing.outputs.number }}
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file /tmp/issue-body.md
            gh issue comment "$NUMBER" --body "Updated with latest scan results."
          else
            gh issue create \
              --title "Archive format warnings" \
              --body-file /tmp/issue-body.md \
              --label "bug"
          fi

      - name: Close issue if clean
        if: steps.check.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --search "Archive format warnings in:title" --state open --json number --limit 1)
          NUMBER=$(echo "$ISSUE" | python3 -c "import json,sys; a=json.load(sys.stdin); print(a[0]['number'] if a else '')")
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "All checks passing — closing."
          fi

      - name: Fail if warnings
        if: steps.check.outputs.count != '0'
        run: exit 1
