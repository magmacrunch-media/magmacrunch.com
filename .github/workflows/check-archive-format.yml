name: Check Archive Format

on:
  push:
    branches: [main]
    paths: ['archive/**']
  pull_request:
    branches: [main]
    paths: ['archive/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      # The repo's own checker, not `magmascript archive check-format`. That
      # command has not run since magmascript 3.2.2 (2026-08-31): its domain
      # commands are never registered, so every run of this workflow died on
      # "Unknown domain: 'archive'" and checked nothing. Its Python port had
      # also drifted -- it still expected the 'music videos' nav label.
      # python3 below is the runner's own, used only to read the JSON.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run checker
        id: check
        run: |
          # check-format exits non-zero when it FINDS something, which is the
          # ordinary case this workflow exists to turn into an Issue — so its
          # exit status must not fail the step, hence the `|| true`.
          #
          # That used to make a checker which broke outright indistinguishable
          # from one which found nothing: the redirect left an empty file, the
          # json.load below raised, and the job died on a Python traceback that
          # named neither magmascript nor the real error, which `|| true` had
          # already thrown away. It failed that way on 2026-09-09 and read as
          # "the archive has formatting problems", which it did not say at all.
          #
          # So keep swallowing the exit status, but check the OUTPUT, and keep
          # stderr to say what went wrong when there is none.
          node scripts/check-archive-format.js --json \
            > /tmp/check-result.json 2> /tmp/check-err.txt || true

          if ! python3 -c "import json; json.load(open('/tmp/check-result.json'))" 2>/dev/null; then
            echo "::error::check-archive-format.js produced no usable JSON — the archive was NOT checked"
            echo "--- stderr ---"
            cat /tmp/check-err.txt
            echo "--- stdout ---"
            cat /tmp/check-result.json
            exit 1
          fi

          COUNT=$(python3 -c "
          import json
          d = json.load(open('/tmp/check-result.json'))
          if isinstance(d, list):
              print(len(d))
          elif isinstance(d, dict):
              print(d.get('count', 0))
          else:
              print(0)
          ")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Build issue body
        if: steps.check.outputs.count != '0'
        id: body
        run: |
          COUNT=${{ steps.check.outputs.count }}
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          WARNINGS=$(python3 -c "
          import json
          d = json.load(open('/tmp/check-result.json'))
          if isinstance(d, list):
              warnings = d
          elif isinstance(d, dict):
              warnings = d.get('warnings', [])
          else:
              warnings = []
          lines = ['WARN  ' + w['file'] + ':' + str(w['line']) + '\n      ' + w['msg'] for w in warnings]
          print('\n\n'.join(lines))
          ")

          cat > /tmp/issue-body.md << BODY
          ## Archive format warnings

          **${COUNT}** warning${COUNT == 1 ? '' : 's'} found on \`${BRANCH}\` (${SHA})

          \`\`\`
          ${WARNINGS}
          \`\`\`

          ---
          [View workflow run](${RUN_URL})
          BODY

      - name: Find existing issue
        if: steps.check.outputs.count != '0'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --search "Archive format warnings in:title" --state open --json number --limit 1)
          NUMBER=$(echo "$ISSUE" | python3 -c "import json,sys; a=json.load(sys.stdin); print(a[0]['number'] if a else '')")
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create or update issue
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER=${{ steps.existing.outputs.number }}
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file /tmp/issue-body.md
            gh issue comment "$NUMBER" --body "Updated with latest scan results."
          else
            gh issue create \
              --title "Archive format warnings" \
              --body-file /tmp/issue-body.md \
              --label "bug"
          fi

      - name: Close issue if clean
        if: steps.check.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE=$(gh issue list --search "Archive format warnings in:title" --state open --json number --limit 1)
          NUMBER=$(echo "$ISSUE" | python3 -c "import json,sys; a=json.load(sys.stdin); print(a[0]['number'] if a else '')")
          if [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "All checks passing — closing."
          fi

      - name: Fail if warnings
        if: steps.check.outputs.count != '0'
        run: exit 1
