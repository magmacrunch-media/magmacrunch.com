name: Rebuild Search Index

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The repo's own builder, as the Pi bot uses -- not magmascript's Python
      # port, which drifted from it (see arcade/scripts/bot-rebuild-search-index.sh).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build search index
        run: node scripts/build-search-index.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          git diff --cached --quiet || git commit -m "Rebuild search index"
          git push
