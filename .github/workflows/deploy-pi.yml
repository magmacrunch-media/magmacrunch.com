name: Deploy to Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}

      - name: Deploy arcade/ to Pi
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '*.pyc' \
            --exclude '__pycache__' \
            --exclude 'scores/*.json' \
            --exclude 'venv' \
            arcade/ jake@192.168.1.16:~/arcade/

          ssh -o StrictHostKeyChecking=no \
            jake@192.168.1.16 "sudo systemctl restart 'arcade-*'"

      - name: Install magmascript on Pi
        run: |
          # Build wheel from local magmascript repo
          cd ~/Documents/magmascript
          .venv/bin/python -m build --wheel -o dist/

          # Copy wheel to Pi
          scp -o StrictHostKeyChecking=no \
            dist/magmascript-*.whl jake@192.168.1.16:~/

          # Install in Pi's venv and symlink CLI
          ssh -o StrictHostKeyChecking=no jake@192.168.1.16 \
            "~/arcade/venv/bin/pip install --upgrade ~/magmascript-*.whl && \
             ln -sf ~/arcade/venv/bin/magmascript ~/bin/magmascript && \
             rm ~/magmascript-*.whl"

          # Restart MCP server to pick up new tools
          ssh -o StrictHostKeyChecking=no \
            jake@192.168.1.16 "sudo systemctl restart arcade-mcp"
