name: Deploy to Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          npm config set script-shell "C:\Program Files\Git\bin\bash.exe"
          npm ci

      - name: Build adenosine bundles
        shell: bash
        run: npm run build:adenosine

      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 100.74.172.4 >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_KEY=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"

      - name: Deploy arcade/ to Pi
        shell: bash
        run: |
          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no jake@100.74.172.4 "rm -rf ~/arcade/node_modules ~/arcade/.git ~/arcade/__pycache__ ~/arcade/venv"
          scp -i "$SSH_KEY" -o StrictHostKeyChecking=no -r arcade/ jake@100.74.172.4:~/arcade/

      - name: Deploy mcp-server/ to Pi
        shell: bash
        run: |
          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no jake@100.74.172.4 "rm -rf ~/arcade/mcp-server/__pycache__ ~/arcade/mcp-server/.venv"
          scp -i "$SSH_KEY" -o StrictHostKeyChecking=no -r mcp-server/ jake@100.74.172.4:~/arcade/mcp-server/

      - name: Restart Pi services
        shell: bash
        run: |
          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no jake@100.74.172.4 "sudo systemctl restart 'arcade-*'"


