name: Deploy to Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          npm config set script-shell "C:\Program Files\Git\bin\bash.exe"
          npm ci

      - name: Build adenosine bundles
        shell: bash
        run: npm run build:adenosine

      - name: Deploy arcade/ to Pi
        shell: powershell
        run: |
          ssh -o StrictHostKeyChecking=no jake@100.74.172.4 "rm -rf ~/arcade/node_modules ~/arcade/.git ~/arcade/__pycache__ ~/arcade/venv"
          scp -o StrictHostKeyChecking=no -r arcade/ jake@100.74.172.4:~/arcade/

      - name: Deploy mcp-server/ to Pi
        shell: powershell
        run: |
          ssh -o StrictHostKeyChecking=no jake@100.74.172.4 "rm -rf ~/arcade/mcp-server/__pycache__ ~/arcade/mcp-server/.venv"
          scp -o StrictHostKeyChecking=no -r mcp-server/ jake@100.74.172.4:~/arcade/mcp-server/

      - name: Restart Pi services
        shell: powershell
        run: |
          ssh -o StrictHostKeyChecking=no jake@100.74.172.4 "sudo systemctl restart 'arcade-*'"
