name: Deploy to Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy arcade/ to Pi
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          echo "$PI_SSH_KEY" | base64 -d > /tmp/pi_key
          chmod 600 /tmp/pi_key

          rsync -avz --delete \
            -e "ssh -i /tmp/pi_key -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '*.pyc' \
            --exclude '__pycache__' \
            --exclude 'scores/*.json' \
            arcade/ jake@192.168.1.16:~/arcade/

          ssh -i /tmp/pi_key -o StrictHostKeyChecking=no \
            jake@192.168.1.16 "sudo systemctl restart 'arcade-*'"

          rm /tmp/pi_key
