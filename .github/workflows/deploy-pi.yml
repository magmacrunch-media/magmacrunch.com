name: Deploy to Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: "C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -e -o pipefail {0}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm config delete script-shell 2>/dev/null || true
          npm ci

      - name: Build adenosine bundles
        run: npm run build:adenosine

      - name: Deploy arcade/ to Pi
        run: |
          SSH_CMD="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /c/Users/magma/.ssh/id_ed25519"
          $SSH_CMD jake@100.74.172.4 "rm -rf ~/arcade/node_modules ~/arcade/.git ~/arcade/__pycache__ ~/arcade/venv"
          tar czf - \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='scores/*.json' \
            --exclude='venv' \
            arcade/ | $SSH_CMD jake@100.74.172.4 "cd ~ && tar xzf -"

      - name: Deploy mcp-server/ to Pi
        run: |
          SSH_CMD="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /c/Users/magma/.ssh/id_ed25519"
          tar czf - \
            --exclude='__pycache__' \
            --exclude='.venv' \
            mcp-server/ | $SSH_CMD jake@100.74.172.4 "cd ~/arcade && tar xzf -"

      - name: Recreate Pi venv and install dependencies
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /c/Users/magma/.ssh/id_ed25519 jake@100.74.172.4 \
            "python3 -m venv ~/arcade/venv && ~/arcade/venv/bin/pip install -r ~/arcade/requirements.txt"

      - name: Restart Pi services
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /c/Users/magma/.ssh/id_ed25519 \
            jake@100.74.172.4 "sudo systemctl restart 'arcade-*'"

      - name: Post to Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cat > discord-payload.json << ENDOFJSON
          {
            "flags": 4096,
            "embeds": [{
              "title": "Deploy to Pi Failed",
              "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "Workflow run \`${{ github.run_id }}\` failed on push to \`${{ github.ref_name }}\`.",
              "fields": [
                {
                  "name": "Commit",
                  "value": "`${{ github.sha }}` — ${{ github.event.head_commit.message }}"
                },
                {
                  "name": "Diagnose",
                  "value": "\`\`\`bash\nssh jake@100.74.172.4 'sudo systemctl status arcade-* --no-pager'\n\`\`\`"
                }
              ],
              "color": 16711680,
              "footer": {
                "text": "Deploy to Pi · ${{ github.repository }}"
              }
            }]
          }
          ENDOFJSON
          curl -s -H "Content-Type: application/json" \
               -d @discord-payload.json \
               "$DISCORD_WEBHOOK_URL"
