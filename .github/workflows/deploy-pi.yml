name: Deploy to Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}

      - name: Deploy arcade/ to Pi
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '*.pyc' \
            --exclude '__pycache__' \
            --exclude 'scores/*.json' \
            arcade/ jake@192.168.1.16:~/arcade/

          ssh -o StrictHostKeyChecking=no \
            jake@192.168.1.16 "sudo systemctl restart 'arcade-*'"
