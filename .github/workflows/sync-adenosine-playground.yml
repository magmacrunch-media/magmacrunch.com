name: Sync adenosine playground

# Keeps ware/adenosine/{playground,theme,tiles}.js and the install snippet in
# ware/adenosine/index.html pinned to the published adenosine packages. Unlike
# the magmascript and texastoast playgrounds these embed nothing — they load
# each package from jsDelivr at runtime, off a version written into the source
# by hand. A release bumps none of them, so the site keeps serving the previous
# build to every visitor, with no error, because the old version is still on
# the CDN and still works.
#
# The weekly schedule is the normal path. Unlike the magmascript and texastoast
# syncs, no release workflow dispatches this — that would mean a cross-repo PAT
# living on the adenosine repo, and the cost of keeping one more token alive is
# not worth shortening a lag nobody can see. Run it by hand from the Actions tab
# after a release to skip the wait. The repository_dispatch trigger stays wired
# so a sender can be added later without touching this file.

on:
  schedule:
    - cron: "41 8 * * 1"   # Mondays 08:41 UTC (offset from other scheduled jobs)
  workflow_dispatch:
  repository_dispatch:
    types: [adenosine-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A release dispatch names the seven versions it just published — pin to
      # them so a stale npm edge fails the job loudly instead of silently
      # leaving the previous release in place. Scheduled and manual runs take
      # whatever is latest. Either way the script confirms every version
      # resolves on npm before writing.
      - name: Repin the tools
        env:
          ADENOSINE_VERSIONS: ${{ toJSON(github.event.client_payload.versions) }}
        run: |
          # toJSON of a missing payload yields "null", which is not a version map.
          if [ "$ADENOSINE_VERSIONS" = "null" ]; then
            unset ADENOSINE_VERSIONS
          fi
          node scripts/sync-adenosine-pins.mjs

      # Repinning rewrites playground.js and theme.js, which changes the bytes
      # the .html beside them stamp with ?v=. A stale stamp means visitors keep
      # the cached old bundle, so the repin above reaches nobody — the exact
      # failure this job exists to prevent, reintroduced one step later.
      #
      # The plain check afterwards is the gate: --fix reporting what it fixed is
      # not the same as nothing being left stale, and pushing a half-restamped
      # tree is worse than not pushing.
      - name: Restamp what the repin changed
        run: |
          node scripts/check-cache-busters.mjs --fix
          node scripts/check-cache-busters.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The directory, not a list of files. The steps above write the four
          # pinned files and restamp the .html beside them, and it was a list
          # that let index.html be rewritten and then thrown away.
          git add ware/adenosine/
          # Nothing should have been written outside it. Fail rather than push
          # part of a change and drop the rest on the floor.
          if ! git diff --quiet; then
            echo "Unexpected changes outside ware/adenosine/:"
            git status --porcelain
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Tools already pinned to the published versions."
          else
            git commit -m "chore(ware): repin adenosine tools to the published packages"
            git push
          fi
