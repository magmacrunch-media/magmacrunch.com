name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install ESLint
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      # app-shell.css reads six custom properties and defines none, so a page
      # that forgets one silently drops those declarations and still deploys.
      - name: Check ware shell token contract
        run: npm run check:shell

      # Every ?v= stamp is the first 8 hex of its file's sha256. A stamp left
      # behind by an edit means visitors keep the cached old file forever, which
      # deploys green and shows no symptom but the fix not arriving. Three had
      # already drifted when this was added.
      - name: Check asset cache-busters
        run: npm run check:cachebust

  # arcade/moonlight-drift/, george-boole/, solitaire_THLD/ and
  # very-long-boards/ are copies of another repo's web/, and `make sync-<game>`
  # recopies them verbatim, cache-buster stamps included. So a stale `?v=` that
  # check:cachebust repairs here is reverted by the next sync, and the fix has
  # to land in the game repo. This checks the stamps in those repos.
  #
  # It runs here, not there, because here is where they break. A stamp on
  # ../shared/* goes stale the moment this repo takes a new adenosine bundle,
  # and the game repo's own CI does not run then — nothing was pushed to it. It
  # would fire whenever somebody next touched that game, which could be months,
  # and "nobody noticed" is the entire failure mode. Failing on the commit that
  # causes it is the point.
  #
  # The four checkouts are shallow and public, and nothing is installed: the
  # check uses node builtins only, so there is no npm ci here.
  game-stamps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check out moonlight-drift
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/moonlight-drift
          path: game-repos/moonlight-drift

      - name: Check out george-boole
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/george-boole
          path: game-repos/george-boole

      - name: Check out texas-holdem-lava-dome
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/texas-holdem-lava-dome
          path: game-repos/texas-holdem-lava-dome

      # GAME_REPOS is also the assertion that the repos are there. Without it the
      # check skips when it finds none, which is right for a clone that was never
      # given them and wrong here — with it set, a checkout step that silently
      # failed makes this job fail rather than pass over nothing.
      #
      # GAME_REPOS_OPTIONAL is the one hole, and it is spelled out rather than
      # tolerated. very-long-boards is a private repo and a workflow's
      # GITHUB_TOKEN reaches only the repo it runs in, so there is no checkout
      # step for it above. The check names it in the log on every run and says it
      # is not covered. Delete this line and restore the checkout once the repo is
      # public, or once a token that can read it is available here.
      #
      # It is still covered where all four are on disk: `npm run check` on the dev
      # box checks it like any other.
      - name: Check the game repos' cache-busters
        env:
          GAME_REPOS: ${{ github.workspace }}/game-repos
          GAME_REPOS_OPTIONAL: very-long-boards
        run: npm run check:gamestamps

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: |
          failures=0
          for dir in $(find arcade -name 'test_*.py' -exec dirname {} \; | sort -u); do
            echo "=== Testing in $dir ==="
            if ! (cd "$dir" && python3 -m pytest -v --tb=short 2>&1); then
              echo "WARN: Tests in $dir failed (pre-existing issues)"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "$failures test suite(s) had failures"
            exit 1
          fi

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run JS tests
        run: |
          for test_file in $(find arcade -name 'test-*.js' -path '*/tests/*'); do
            echo "=== Running $test_file ==="
            node "$test_file" || exit 1
          done

  # The checks that need a live server behind them. Clicks MULTIPLAYER on the
  # games whose lobby opens client-side and asserts the overlay actually becomes
  # visible, and confirms the chat widget gets a name back from chat-server.py.
  # A dead lobby button, and a chat widget that never connects, both used to pass
  # every check here because the page still loaded and logged nothing.
  lobby-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install test dependencies
        working-directory: arcade/tests
        run: npm ci

      - name: Install Playwright chromium
        working-directory: arcade/tests
        run: npx playwright install --with-deps chromium

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install server dependencies
        run: pip install -r requirements.txt

      - name: Serve the repo
        run: |
          python3 -m http.server 8080 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && exit 0
            sleep 1
          done
          echo "static server did not come up"; exit 1

      # aggravation, parchisi and SORRY only reveal their lobby once a join
      # round-trips, so their lobby check needs a real server. The test loads
      # them with ?server=localhost:<port>; without these it would skip them.
      #
      # chat-server.py is here for the same reason: the chat check asserts the
      # widget got a name back from the server, which no amount of page loading
      # produces on its own. Without it the check skips rather than fails, so a
      # missing server here would quietly cost the coverage.
      - name: Start game servers
        run: |
          python3 arcade/aggravation/server.py --port 8774 &
          python3 arcade/parchisi/server.py --port 8773 &
          python3 arcade/SORRY/server.py --port 8765 &
          python3 arcade/chat-server.py --port 8768 &
          for port in 8774 8773 8765 8768; do
            for _ in $(seq 1 30); do
              python3 -c "import socket,sys; s=socket.create_connection(('127.0.0.1', $port), 1); s.close()" 2>/dev/null && break
              sleep 1
            done
            python3 -c "import socket,sys; s=socket.create_connection(('127.0.0.1', $port), 1); s.close()" \
              || { echo "game server on $port did not come up"; exit 1; }
          done

      - name: Check multiplayer lobbies
        working-directory: arcade/tests
        env:
          BASE_URL: http://localhost:8080
        run: node smoke-test.mjs --lobby-only
