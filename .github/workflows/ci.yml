name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ESLint
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: |
          failures=0
          for dir in $(find arcade -name 'test_*.py' -exec dirname {} \; | sort -u); do
            echo "=== Testing in $dir ==="
            if ! (cd "$dir" && python3 -m pytest -v --tb=short 2>&1); then
              echo "WARN: Tests in $dir failed (pre-existing issues)"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "$failures test suite(s) had failures"
            exit 1
          fi

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run JS tests
        run: |
          for test_file in $(find arcade -name 'test-*.js' -path '*/tests/*'); do
            echo "=== Running $test_file ==="
            node "$test_file" || exit 1
          done

  # Clicks MULTIPLAYER on the games whose lobby opens client-side and asserts the
  # overlay actually becomes visible. A dead lobby button used to pass every check
  # here, because the page still loaded and logged nothing.
  lobby-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        working-directory: arcade/tests
        run: npm ci

      - name: Install Playwright chromium
        working-directory: arcade/tests
        run: npx playwright install --with-deps chromium

      - name: Serve the repo
        run: |
          python3 -m http.server 8080 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && exit 0
            sleep 1
          done
          echo "server did not come up"; exit 1

      - name: Check multiplayer lobbies
        working-directory: arcade/tests
        env:
          BASE_URL: http://localhost:8080
        run: node smoke-test.mjs --lobby-only
