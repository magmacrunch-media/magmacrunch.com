name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install ESLint
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      # app-shell.css reads six custom properties and defines none, so a page
      # that forgets one silently drops those declarations and still deploys.
      - name: Check ware shell token contract
        run: npm run check:shell

      # Every ?v= stamp is the first 8 hex of its file's sha256. A stamp left
      # behind by an edit means visitors keep the cached old file forever, which
      # deploys green and shows no symptom but the fix not arriving. Three had
      # already drifted when this was added.
      - name: Check asset cache-busters
        run: npm run check:cachebust

  # arcade/moonlight-drift/, george-boole/, solitaire_THLD/ and
  # very-long-boards/ are copies of another repo's web/, and `make sync-<game>`
  # recopies them verbatim, cache-buster stamps included. So a stale `?v=` that
  # check:cachebust repairs here is reverted by the next sync, and the fix has
  # to land in the game repo. This checks the stamps in those repos.
  #
  # It runs here, not there, because here is where they break. A stamp on
  # ../shared/* goes stale the moment this repo takes a new adenosine bundle,
  # and the game repo's own CI does not run then — nothing was pushed to it. It
  # would fire whenever somebody next touched that game, which could be months,
  # and "nobody noticed" is the entire failure mode. Failing on the commit that
  # causes it is the point.
  #
  # The game checkouts are shallow and public, and nothing is installed: the
  # check uses node builtins only, so there is no npm ci here.
  game-stamps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # ONE CHECKOUT STEP LEFT, and that is not an accident. A workflow's
      # GITHUB_TOKEN reaches only the repo it runs in, so a step here can only
      # fetch a PUBLIC game repo; a private one fails the step outright rather
      # than skipping it. Five games were privatised on 2026-10-03 and their
      # steps went with them, to GAME_REPOS_OPTIONAL below:
      #
      #   makemecookies  moonlight-drift  texas-holdem-lava-dome
      #   jovian-humanitarian-conflict  roderick-tron
      #
      # george-boole is the exception, and from 2026-10-03 it is an exception
      # that survives its own flip: it has a read-only DEPLOY KEY here, so this
      # step keeps working whether that repo is public or private. That is the
      # answer to the question this comment used to leave open, and it is the
      # better one. The five above lost their coverage; this one does not have
      # to.
      - name: Check out george-boole
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/george-boole
          path: game-repos/george-boole
          # Read-only deploy key. Every game below has one too, which is what
          # lets this job check all eight whether they are public or private.
          ssh-key: ${{ secrets.GEORGE_BOOLE_DEPLOY_KEY }}

      - name: Check out makemecookies
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/makemecookies
          path: game-repos/makemecookies
          ssh-key: ${{ secrets.MAKEMECOOKIES_DEPLOY_KEY }}
      - name: Check out moonlight-drift
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/moonlight-drift
          path: game-repos/moonlight-drift
          ssh-key: ${{ secrets.MOONLIGHT_DRIFT_DEPLOY_KEY }}
      - name: Check out texas-holdem-lava-dome
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/texas-holdem-lava-dome
          path: game-repos/texas-holdem-lava-dome
          ssh-key: ${{ secrets.TEXAS_HOLDEM_LAVA_DOME_DEPLOY_KEY }}
      - name: Check out jovian-humanitarian-conflict
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/jovian-humanitarian-conflict
          path: game-repos/jovian-humanitarian-conflict
          ssh-key: ${{ secrets.JOVIAN_HUMANITARIAN_CONFLICT_DEPLOY_KEY }}
      - name: Check out roderick-tron
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/roderick-tron
          path: game-repos/roderick-tron
          ssh-key: ${{ secrets.RODERICK_TRON_DEPLOY_KEY }}
      - name: Check out very-long-boards
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/very-long-boards
          path: game-repos/very-long-boards
          ssh-key: ${{ secrets.VERY_LONG_BOARDS_DEPLOY_KEY }}
      - name: Check out pay2play
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/pay2play
          path: game-repos/pay2play
          ssh-key: ${{ secrets.PAY2PLAY_DEPLOY_KEY }}

      # GAME_REPOS is also the assertion that the repos are there. Without it the
      # check skips when it finds none, which is right for a clone that was never
      # given them and wrong here — with it set, a checkout step that silently
      # failed makes this job fail rather than pass over nothing.
      #
      # GAME_REPOS_OPTIONAL IS EMPTY, AND THAT IS THE POINT. It is the declared
      # hole for a game this job cannot read, and as of 2026-10-03 there is no
      # such game: all eight have a read-only deploy key held here, so every one
      # is checked out above whether it is public or private. Eight of eight
      # covered, which is better than this job has ever managed.
      #
      # The mechanism is kept rather than deleted. If a game ever loses its key
      # or gains a consumer that cannot hold one, put its name here and remove
      # its checkout step, and the check will say in the log that it is not
      # covered instead of passing silently over it.
      #
      # IT GOT TO 1 OF 8 FIRST, which is the thing worth remembering. Five games
      # were privatised that morning, their checkout steps were deleted and
      # their names added to this line, because a workflow's GITHUB_TOKEN reaches
      # only the repo it runs in and a private checkout fails outright. Two more
      # had been sitting here uncovered for longer. george-boole then showed that
      # a deploy key keeps the step working through a flip, and the same trick
      # closed the rest. The hole was never the only option; it was the first one
      # anybody reached for.
      #
      # Note the dev box is NOT the fallback it sounds like: `npm run check` with
      # every repo on disk does cover them, and is also the thing nobody runs on
      # a schedule. That is why getting this back into CI was worth eight keys.
      #
      # Every other entry in scripts/games.mjs needs a checkout step above, and
      # check-game-stamps.mjs reads this file to enforce that. Adding a game
      # there without adding one here used to turn this job red on main with a
      # message blaming a missing web/ rather than a missing step, which is how
      # four games in a row landed before anyone connected the two.
      - name: Check the game repos' cache-busters
        env:
          GAME_REPOS: ${{ github.workspace }}/game-repos
          GAME_REPOS_OPTIONAL: ''
        run: npm run check:gamestamps

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: |
          failures=0
          for dir in $(find arcade -name 'test_*.py' -exec dirname {} \; | sort -u); do
            echo "=== Testing in $dir ==="
            if ! (cd "$dir" && python3 -m pytest -v --tb=short 2>&1); then
              echo "WARN: Tests in $dir failed (pre-existing issues)"
              failures=$((failures + 1))
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "$failures test suite(s) had failures"
            exit 1
          fi

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Roots must match JS_ROOTS in scripts/run-tests.mjs. This loop is the
      # second of the two places that decide whether a suite runs at all, and a
      # find that matches nothing would run no tests and report success -- so the
      # count is asserted rather than assumed.
      - name: Run JS tests
        run: |
          test_files=$(find arcade ware -name 'test-*.js' -path '*/tests/*' | sort)
          count=$(printf '%s\n' "$test_files" | grep -c . || true)
          echo "Found $count JS suite(s)."
          if [ "$count" -lt 1 ]; then
            echo "No tests/test-*.js found under arcade/ or ware/ -- the search is broken, not the tree." >&2
            exit 1
          fi
          for test_file in $test_files; do
            echo "=== Running $test_file ==="
            node "$test_file" || exit 1
          done

  # The checks that need a live server behind them. Clicks MULTIPLAYER on the
  # games whose lobby opens client-side and asserts the overlay actually becomes
  # visible, and confirms the chat widget gets a name back from chat-server.py.
  # A dead lobby button, and a chat widget that never connects, both used to pass
  # every check here because the page still loaded and logged nothing.
  lobby-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install test dependencies
        working-directory: arcade/tests
        run: npm ci

      - name: Install Playwright chromium
        working-directory: arcade/tests
        run: npx playwright install --with-deps chromium

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install server dependencies
        run: pip install -r requirements.txt

      - name: Serve the repo
        run: |
          python3 -m http.server 8080 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && exit 0
            sleep 1
          done
          echo "static server did not come up"; exit 1

      # aggravation, parchisi and SORRY only reveal their lobby once a join
      # round-trips, so their lobby check needs a real server. The test loads
      # them with ?server=localhost:<port>; without these it would skip them.
      #
      # chat-server.py is here for the same reason: the chat check asserts the
      # widget got a name back from the server, which no amount of page loading
      # produces on its own. Without it the check skips rather than fails, so a
      # missing server here would quietly cost the coverage.
      - name: Start game servers
        run: |
          python3 arcade/aggravation/server.py --port 8774 &
          python3 arcade/parchisi/server.py --port 8773 &
          python3 arcade/SORRY/server.py --port 8765 &
          python3 arcade/chat-server.py --port 8768 &
          for port in 8774 8773 8765 8768; do
            for _ in $(seq 1 30); do
              python3 -c "import socket,sys; s=socket.create_connection(('127.0.0.1', $port), 1); s.close()" 2>/dev/null && break
              sleep 1
            done
            python3 -c "import socket,sys; s=socket.create_connection(('127.0.0.1', $port), 1); s.close()" \
              || { echo "game server on $port did not come up"; exit 1; }
          done

      - name: Check multiplayer lobbies
        working-directory: arcade/tests
        env:
          BASE_URL: http://localhost:8080
        run: node smoke-test.mjs --lobby-only

      # A failing game writes a full-page screenshot and a results.md naming what
      # went wrong, and until now CI threw both away: they land in the runner's
      # filesystem, nothing uploaded them, and the job ended. All a red run left
      # was the one-line console output.
      #
      # That was masked for a while by arcade/tests/screenshots/ holding fourteen
      # committed screenshots, so there was always *a* picture to look at — just
      # never of the run that failed. Both paths are gitignored now, which is
      # right, and makes this the only way the evidence survives.
      #
      # if: failure() rather than always(), since a green run writes no
      # screenshot at all; if-no-files-found: ignore because the job can fail
      # before the suite runs, when a server does not come up, and an upload
      # warning would be noise on top of the real error.
      - name: Keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lobby-smoke-failure
          path: |
            arcade/tests/screenshots/
            arcade/tests/results.md
          if-no-files-found: ignore
          retention-days: 14
