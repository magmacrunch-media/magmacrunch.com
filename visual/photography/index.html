/* ── RENDER SERIES ── */
const container = document.getElementById('series-container');

function renderArchiveLink(href, text) {
    return '<a href="' + href + '" style="color:var(--dim);text-decoration:none;border-bottom:1px solid var(--dim);transition:color 0.15s,border-color 0.15s;" onmouseover="this.style.color=\'var(--mintteal)\';this.style.borderColor=\'var(--mintteal)\'" onmouseout="this.style.color=\'var(--dim)\';this.style.borderColor=\'var(--dim)\'">' + text + '</a>';
}

SERIES_DATA.forEach((s, si) => {
    const el = document.createElement('div');
    el.className = 'series';
    el.id = 'series-' + s.id;
    if (s.noAnimation) el.style.cssText = 'animation:none!important;opacity:1!important;';

    let metaHTML = s.meta;
    if (s.metaLink) metaHTML += renderArchiveLink(s.metaLink.href, s.metaLink.text);

    let html = '<div class="series-header">' +
        '<span class="series-title">' + s.title + '</span>' +
        '<span class="series-meta">' + metaHTML + '</span>' +
        '</div>';

    if (s.desc) html += '<p class="series-desc">' + s.desc + '</p>';

    html += '<div class="photo-strip-wrap">' +
        '<div class="photo-strip">';

    s.photos.forEach((p, i) => {
        const cls = p.aspect || 'landscape';
        html += '<div class="photo-item ' + cls + '" data-series="' + s.id + '" data-index="' + i + '">' +
            '<img src="' + p.src + '" alt="' + p.alt + '" loading="lazy">' +
            '<div class="photo-caption">' + p.caption + '</div>' +
            '</div>';
    });

    html += '</div><div class="strip-scroll-hint">scroll → </div></div>';
    el.innerHTML = html;
    container.appendChild(el);

    if (s.divider !== false) {
        const divider = document.createElement('div');
        divider.className = 'section-divider';
        container.appendChild(divider);
    }
});

    strip.addEventListener('mousedown', e => {
        isDown = true; strip.classList.add('dragging');
        startX = e.pageX - strip.offsetLeft;
        scrollLeft = strip.scrollLeft;
    });
    strip.addEventListener('mouseleave', () => { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mouseup', () => { isDown = false; strip.classList.remove('dragging'); });
    strip.addEventListener('mousemove', e => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - strip.offsetLeft;
        strip.scrollLeft = scrollLeft - (x - startX) * 1.2;
    });
    const wrap = strip.closest('.photo-strip-wrap');
    strip.addEventListener('scroll', () => { if (strip.scrollLeft > 30) wrap.classList.add('scrolled'); }, { passive: true });
});

/* ── LIGHTBOX ── */
const SERIES = {};
SERIES_DATA.forEach(s => {
    SERIES[s.id] = s.photos.map(p => ({ src: p.src, alt: p.alt, caption: p.caption }));
});

const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lbImg');
const lbCap    = document.getElementById('lbCaption');
const lbCount  = document.getElementById('lbCounter');
let currentSeries = null, currentIndex = 0;

function openLightbox(series, index) {
    currentSeries = series;
    currentIndex  = index;
    showLbPhoto();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
}
function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
}
function showLbPhoto() {
    const photos = SERIES[currentSeries];
    const p = photos[currentIndex];
    lbImg.src = p.src;
    lbImg.alt = p.alt;
    lbCap.textContent = p.caption;
    lbCount.textContent = (currentIndex + 1) + ' / ' + photos.length;
}
function lbNav(dir) {
    const len = SERIES[currentSeries].length;
    currentIndex = (currentIndex + dir + len) % len;
    showLbPhoto();
}

document.querySelectorAll('.photo-item').forEach(item => {
    item.addEventListener('click', () => {
        if (!item.closest('.photo-strip').classList.contains('dragging')) {
            openLightbox(item.dataset.series, parseInt(item.dataset.index));
        }
    });
});
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => lbNav(-1));
document.getElementById('lbNext').addEventListener('click', () => lbNav(1));
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
if (window.__photoKeyAbort) window.__photoKeyAbort.abort();
window.__photoKeyAbort = new AbortController();
document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
}, { signal: window.__photoKeyAbort.signal });
</script>
</body>
