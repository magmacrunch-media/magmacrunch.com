<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>photography — magmacrunch media</title>
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../visual.css">
    <style>
        /* ── CITY POP PALETTE ── */
        :root {
            --cp-night-sky:      #0D0D2B;
            --cp-deep-navy:      #141438;
            --cp-twilight:       #1E1E4A;
            --cp-smoked-glass:   #2A2A5A;
            --cp-soft-white:     #F0EEF8;
            --cp-sakura-pink:    #FF8FB0;
            --cp-coral-sunrise:  #FF6E6E;
            --cp-peach-glow:     #FFB48A;
            --cp-butter-neon:    #FFE97A;
            --cp-mint-flash:     #7AFFD4;
            --cp-aqua-haze:      #5EEEF0;
            --cp-periwinkle:     #A0A8FF;
            --cp-lavender-mist:  #C8AEFF;
            --cp-blush-lilac:    #E8B0FF;
            --cp-horizon-pink:   #FF4FA0;
            --cp-electric-teal:  #00E5CC;
            --cp-neon-periwinkle:#6B6BFF;
            --cp-chrome-silver:  #C0C8E0;
            --cp-rose-gold:      #E8A0B0;
            --cp-cassette-gold:  #E8C86A;
        }

        /* ── NAV OVERRIDES ── */
        :root {
            --nav-accent: #FF4FA0;
            --nav-glow: rgba(255,79,160,0.4);
            --nav-brand: #C0C8E0;
            --nav-brand-glow: rgba(192,200,224,0.7);
        }

        /* ── SHARED PATTERN VARS ── */
        :root {
            --bc-accent: #00E5CC;
            --footer-border: #2A2A5A;
            --footer-accent: #FF8FB0;
            --dd-1: #FF8FB0;
            --dd-2: #00E5CC;
            --dd-3: #C8AEFF;
            --dd-4: #FFB48A;
            --dd-5: #6B6BFF;
            --dd-hover-color: #0D0D2B;
            --dd-hover-bg: #00E5CC;
        }

        /* ── PAGE OVERRIDES ── */
        body.city-pop {
            --black: #0D0D2B;
            --deep: #141438;
            --white: #F0EEF8;
            --rose: #FF8FB0;
            --yellow: #E8C86A;
            --cyan: #5EEEF0;
            --dim: #C0C8E0;
            --orange: #FF6E6E;
            --mintteal: #00E5CC;
            background: #0D0D2B;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(107,107,255,0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255,79,160,0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 80%, rgba(0,229,204,0.12) 0%, transparent 45%),
                linear-gradient(180deg, #0D0D2B 0%, #141438 40%, #1E1E4A 100%);
            background-attachment: fixed;
        }

        /* ── DROPDOWN OVERRIDES ── */
        body.city-pop .dropdown {
            border-color: #FF4FA0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7), 0 0 12px rgba(255,79,160,0.3);
        }

        /* ── PAGE TITLE / SUBTITLE ── */
        .page-title { font-size:clamp(13px,2.8vw,22px); color:#FF8FB0; text-shadow:0 0 20px rgba(255,143,176,0.5); letter-spacing:0.08em; }
        .page-subtitle { color:#FFB48A; letter-spacing:0.12em; }

        .ascii-camera {
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            color: #FF8FB0;
            line-height: 1.2;
            margin: 16px 0;
            text-shadow: 0 0 8px rgba(255,143,176,0.4);
            animation: fadeUp 0.5s 0.03s ease both;
            white-space: pre;
            overflow-x: auto;
        }

        .section-divider { width:100%; max-width:900px; background:linear-gradient(90deg,transparent,#FF8FB0,#5EEEF0,#C8AEFF,transparent); margin:0 20px 56px; opacity:0.3; animation:fadeUp 0.5s 0.05s ease both; }

        /* ── SERIES BLOCK ── */
        .series { width:100%; max-width:960px; padding:0 20px; margin-bottom:72px; animation:fadeUp 0.5s ease both; }
        .series-header { display:flex; align-items:baseline; gap:20px; margin-bottom:6px; }
        .series-title { font-family:'Press Start 2P',monospace; font-size:clamp(9px,1.6vw,13px); color:#F0EEF8; letter-spacing:0.08em; }
        .series-meta { font-family:'Press Start 2P',monospace; font-size:6px; color:#A0A8FF; letter-spacing:0.12em; opacity:0.7; }
        .series-desc { font-family:'Courier Prime',monospace; font-size:13px; color:#C0C8E0; line-height:1.7; letter-spacing:0.02em; margin-bottom:20px; max-width:600px; opacity:0.8; }

        /* ── HORIZONTAL SCROLL STRIP ── */
        .photo-strip-wrap { position: relative; width: 100%; }
        .photo-strip { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #00E5CC #141438; padding-bottom: 10px; cursor: grab; }
        .photo-strip:active { cursor: grabbing; }
        .photo-strip::-webkit-scrollbar { height: 3px; }
        .photo-strip::-webkit-scrollbar-track { background: #141438; }
        .photo-strip::-webkit-scrollbar-thumb { background: #00E5CC; opacity: 0.5; }

        .photo-item { flex-shrink: 0; position: relative; height: clamp(220px, 38vw, 420px); scroll-snap-align: start; overflow: hidden; border: 1px solid #2A2A5A; transition: border-color 0.2s; cursor: pointer; }
        .photo-item:hover { border-color: #00E5CC; }
        .photo-item.landscape { aspect-ratio: 4/3; }
        .photo-item.portrait  { aspect-ratio: 3/4; }
        .photo-item.wide      { aspect-ratio: 16/9; }

        .photo-item img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; transition: transform 0.4s ease, filter 0.3s ease; filter: saturate(1.1) brightness(1.0); }
        .photo-item:hover img { transform: scale(1.03); filter: saturate(1.0) brightness(1.0); }

        .photo-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 12px 10px; background: linear-gradient(to top, rgba(13,13,43,0.85) 0%, transparent 100%); font-family: 'Press Start 2P', monospace; font-size: 5px; color: #F0EEF8; letter-spacing: 0.1em; opacity: 0; transition: opacity 0.25s ease; }
        .photo-item:hover .photo-caption { opacity: 1; }

        .strip-scroll-hint { font-family: 'Press Start 2P', monospace; font-size: 6px; color: #C0C8E0; letter-spacing: 0.15em; margin-top: 10px; opacity: 0.4; text-align: right; padding-right: 4px; transition: opacity 0.3s; }
        .photo-strip-wrap.scrolled .strip-scroll-hint { opacity: 0; }

        /* ── LIGHTBOX ── */
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(13,13,43,0.97); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
        .lightbox.open { display: flex; }
        .lightbox-img-wrap { position: relative; max-width: 90vw; max-height: 82vh; display: flex; align-items: center; justify-content: center; }
        .lightbox-img-wrap img { max-width: 90vw; max-height: 82vh; object-fit: contain; display: block; border: 1px solid #2A2A5A; }
        .lightbox-nav { display: flex; align-items: center; gap: 32px; margin-top: 18px; }
        .lb-btn { font-family: 'Press Start 2P', monospace; font-size: 8px; color: #A0A8FF; background: none; border: 1px solid #2A2A5A; padding: 8px 16px; cursor: pointer; letter-spacing: 0.1em; transition: color 0.15s, border-color 0.15s; }
        .lb-btn:hover { color: #00E5CC; border-color: #00E5CC; }
        .lb-close { font-family: 'Press Start 2P', monospace; font-size: 7px; color: #C0C8E0; background: none; border: none; cursor: pointer; letter-spacing: 0.1em; transition: color 0.15s; padding: 8px; }
        .lb-close:hover { color: #FF8FB0; }
        .lb-counter { font-family: 'Press Start 2P', monospace; font-size: 6px; color: #C0C8E0; letter-spacing: 0.12em; opacity: 0.6; min-width: 60px; text-align: center; }
        .lb-caption { font-family: 'Press Start 2P', monospace; font-size: 6px; color: #FFB48A; letter-spacing: 0.1em; margin-top: 10px; opacity: 0.5; min-height: 14px; }

        @media (max-width: 640px) {
            .photo-item { height: clamp(160px, 55vw, 260px); }
            .series-header { flex-direction: column; gap: 6px; }
        }
    </style>
</head>

<nav id="auto-nav" data-depth="../../"></nav>

<main>

    <div class="breadcrumb">

        <a href="../">visual</a><span class="sep">›</span>
        <span class="current">photography</span>
    </div>

    <div class="page-header centered">
        <h1 class="page-title">photography</h1>
        <pre class="ascii-camera">
 _______ 
 |__/-\[]|
 |  (_)  |
 |_______|
    /|\   
        </pre>
        <p class="page-subtitle">visual archive</p>
    </div>

    <div class="section-divider"></div>

    <div id="series-container"></div>

    <!-- ══ LIGHTBOX ══ -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
        <button class="lb-close" id="lbClose">[ close ]</button>
        <div class="lightbox-img-wrap">
            <img id="lbImg" src="" alt="">
        </div>
        <div class="lb-caption" id="lbCaption"></div>
        <div class="lightbox-nav">
            <button class="lb-btn" id="lbPrev">← prev</button>
            <span class="lb-counter" id="lbCounter"></span>
            <button class="lb-btn" id="lbNext">next →</button>
        </div>
    </div>

</main>

<script src="../../nav.js"></script>
<script src="main.js"></script>
</body>
</html>
