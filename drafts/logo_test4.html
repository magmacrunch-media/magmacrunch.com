<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>magmacrunch media — unbounded retro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    /* Deep dark void background to let the volcano pop */
    --bg-color: #0a0508; 
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    overflow: hidden;
    padding: 20px;
  }

  /* ── EXAGGERATED 3D RETRO TITLE ── */
  .title {
    font-size: clamp(28px, 4vw, 56px); /* Scales with screen size */
    text-align: center;
    text-transform: lowercase;
    color: #ff3d6e; /* Primary logo red */
    /* Stacked shadows create a chunky 3D extrusion effect */
    text-shadow: 
      4px 4px 0px #110000,
      8px 8px 0px #ff7c1f,
      12px 12px 0px #110000,
      16px 16px 0px #ffe03a,
      20px 20px 0px #000000;
    letter-spacing: 0.05em;
    margin-bottom: 2rem;
    line-height: 1.4;
    z-index: 10;
  }

  /* Canvas Container - Unbounded */
  .canvas-container {
    position: relative;
    width: 100%;
    max-width: 512px;
    aspect-ratio: 1 / 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* Forces chunky, unblurred pixels */
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
  }

  /* Arcade Taglines */
  .tagline-container {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }

  .est {
    font-size: 14px;
    color: #ff3d6e;
    text-shadow: 2px 2px 0 #000;
  }

  .tagline {
    font-size: 12px;
    color: #ffe03a;
    text-align: center;
    line-height: 2.2;
    text-shadow: 2px 2px 0 #000;
    text-transform: lowercase;
  }

  .blink {
    animation: blink-step 1.2s step-end infinite;
    color: #00f5ff;
  }

  @keyframes blink-step {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

  <div class="title">magmacrunch<br>media</div>

  <div class="canvas-container">
    <canvas id="volcano" width="64" height="64"></canvas>
  </div>

  <div class="tagline-container">
    <div class="est">est. 2023</div>
    <div class="tagline">
      sometimes it's quite melodious;<br>
      <span class="blink">other times it's noise</span>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('volcano');
  const ctx    = canvas.getContext('2d');
  
  ctx.imageSmoothingEnabled = false;

  // Tiny internal resolution
  const W = 64, H = 64;
  const CENTER = 32;

  // ── PALETTE ──
  const C = {
    mount:  '#1a0505', // Dark red/black mountain
    mountOut:'#ff3d6e',// Red outline from logo
    lava0:  '#ffe03a', // Bright yellow lava
    lava1:  '#ffad1f', // Orange lava shading
    bolt:   '#ffe03a',
    cereal: ['#ff3d6e', '#00f5ff', '#c45fff', '#39ff14', '#ffffff'] // Candy colors
  };

  const CRATER_TOP = 28;

  let cerealBits = [];
  let bolts      = [];
  let frame      = 0;

  // ── SPAWNERS ──
  function spawnCereal() {
    cerealBits.push({
      x: CENTER + (Math.random() - 0.5) * 10,
      y: CRATER_TOP + 2,
      vx: (Math.random() - 0.5) * 3,
      vy: -(Math.random() * 3.5 + 1.5),
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      col: C.cereal[Math.floor(Math.random() * C.cereal.length)],
      gravity: 0.18,
      size: Math.random() < 0.6 ? 1 : 2 
    });
  }

  function spawnBolt() {
    const isLeft = Math.random() < 0.5;
    const startX = isLeft ? (2 + Math.random() * 12) : (50 + Math.random() * 12);
    const startY = 4 + Math.random() * 16;
    
    bolts.push({
      x: startX,
      y: startY,
      life: 1,
      decay: 0.2 + Math.random() * 0.1, 
      segs: 4 + Math.floor(Math.random() * 4),
      angle: (Math.PI/2) + (Math.random()-0.5)*1.2,
    });
  }

  // ── DRAWING FUNCTIONS ──
  function drawMountain() {
    for (let y = CRATER_TOP; y < H; y++) {
      // Wider angle for an unbounded base
      const widthAtY = (y - CRATER_TOP) * 1.2;
      const l = Math.floor(CENTER - 8 - widthAtY);
      const r = Math.floor(CENTER + 8 + widthAtY);

      const leftFlow = Math.floor(CENTER - 3 - (y - CRATER_TOP) * 0.5 + Math.sin(y * 0.3 + frame * 0.1) * 2);
      const rightFlow = Math.floor(CENTER + 3 + (y - CRATER_TOP) * 0.5 + Math.sin(y * 0.4 - frame * 0.1) * 2);

      for (let x = 0; x <= W; x++) {
        if (x >= l && x <= r) {
          // Draw mountain outline
          if (x === l || x === r || y === CRATER_TOP) {
            ctx.fillStyle = C.mountOut;
            ctx.fillRect(x, y, 1, 1);
            continue;
          }

          const distLeft = Math.abs(x - leftFlow);
          const distRight = Math.abs(x - rightFlow);
          const flowWidth = 1 + (y - CRATER_TOP) * 0.08;

          // Draw Lava or Rock
          if (distLeft <= flowWidth || distRight <= flowWidth) {
            const t = (frame * 0.2 + y * 0.3) % 1;
            ctx.fillStyle = t > 0.5 ? C.lava0 : C.lava1;
          } else {
            // Slight noise in the mountain rock
            ctx.fillStyle = (Math.sin(x*y) > 0.8) ? '#2a0a0a' : C.mount;
          }
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
  }

  function drawCereal() {
    for (const c of cerealBits) {
      if (c.y < H) {
        ctx.fillStyle = c.col;
        ctx.fillRect(Math.floor(c.x), Math.floor(c.y), c.size, c.size);
      }
    }
  }

  function drawBolts() {
    for (const b of bolts) {
      ctx.globalAlpha = Math.max(0, b.life);
      let x = b.x, y = b.y;
      const segLen = 5; 
      
      for (let i = 0; i < b.segs; i++) {
        const nx = Math.floor(x + Math.cos(b.angle + (Math.random()-0.5)*2) * segLen);
        const ny = Math.floor(y + Math.sin(b.angle) * segLen);
        
        ctx.strokeStyle = C.bolt;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
        
        x = nx; y = ny;
      }
    }
    ctx.globalAlpha = 1;
  }

  // ── UPDATE & LOOP ──
  function update() {
    if (frame % 2 === 0) spawnCereal();
    if (Math.random() > 0.90) spawnBolt();

    for (const b of bolts) { b.life -= b.decay; }
    bolts = bolts.filter(b => b.life > 0);

    for (const c of cerealBits) {
      c.x  += c.vx;
      c.y  += c.vy;
      c.vy += c.gravity;
      c.life -= c.decay;
    }
    cerealBits = cerealBits.filter(c => c.life > 0 && c.y < H + 5);
  }

  function render() {
    // Clear canvas completely to make it transparent/unbounded against the page body
    ctx.clearRect(0, 0, W, H);
    drawBolts();
    drawMountain();
    drawCereal();
  }

  const TARGET_FPS = 15; 
  const FRAME_MS   = 1000 / TARGET_FPS;
  let lastTime = 0;
  let rafId;

  function loop(ts) {
    rafId = requestAnimationFrame(loop);
    if (ts - lastTime < FRAME_MS) return;
    lastTime = ts;
    update();
    render();
    frame++;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(rafId);
    else { lastTime = 0; rafId = requestAnimationFrame(loop); }
  });

  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
