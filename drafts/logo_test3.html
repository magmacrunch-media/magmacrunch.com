<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>magmacrunch media — retro cereal preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    /* Candy shoppe / dark cherry retro background */
    --bg-color: #1a0808; 
    --text-glow: rgba(255, 61, 110, 0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    overflow: hidden;
  }

  /* ── ARCADE / CANDY SHOPPE WRAPPER ── */
  .arcade-screen {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    background: radial-gradient(circle at center, #2a0a10 0%, #0a0000 100%);
    border: 4px solid #ff3d6e;
    border-radius: 16px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 10px 30px rgba(0,0,0,0.8);
  }

  /* Retro Chunky Title - Now lowercase per request */
  .title {
    font-size: 24px;
    margin-bottom: 30px;
    text-align: center;
    text-transform: lowercase;
    background: linear-gradient(to bottom, #ff3d6e 0%, #ff7c1f 60%, #ffe03a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(4px 4px 0px #220000);
    letter-spacing: 0.05em;
  }

  /* Canvas Container & Scaled Rendering */
  .canvas-container {
    position: relative;
    width: 384px; /* Display size */
    height: 384px;
    border-radius: 50%;
    box-shadow: 0 0 0 8px #ff3d6e, 0 0 30px rgba(255, 61, 110, 0.5); /* Chunky red border like the logo */
    background: #000;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* This forces the chunky, unblurred pixels */
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
  }

  /* Arcade Taglines */
  .tagline-container {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .est {
    font-size: 14px;
    color: #ff3d6e;
    text-shadow: 3px 3px 0 #000;
  }

  .tagline {
    font-size: 10px;
    color: #ffe03a;
    text-align: center;
    line-height: 2;
    text-shadow: 2px 2px 0 #000;
  }

  .blink {
    animation: blink-step 1s step-end infinite;
    color: #00f5ff;
  }

  @keyframes blink-step {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<div class="arcade-screen">
  <div class="title">magmacrunch media</div>

  <div class="canvas-container">
    <canvas id="volcano" width="64" height="64"></canvas>
  </div>

  <div class="tagline-container">
    <div class="est">est. 2023</div>
    <div class="tagline">
      PART VOLCANO. PART BREAKFAST.<br>
      <span class="blink">100% CHUNKY.</span>
    </div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('volcano');
  const ctx    = canvas.getContext('2d');
  
  // Turn off smoothing for strict 8-bit look
  ctx.imageSmoothingEnabled = false;

  // Tiny internal resolution
  const W = 64, H = 64;
  const CENTER = 32;

  // ── PALETTE (Logo match + Cereal bits) ──
  const C = {
    bg:     '#050000',
    ring1:  '#fdfbf7', // White inner ring
    mount:  '#1a0505', // Dark red/black mountain
    mountOut:'#ff3d6e',// Red outline from logo
    lava0:  '#ffe03a', // Bright yellow lava
    lava1:  '#ffad1f', // Orange lava shading
    bolt:   '#ffe03a',
    cereal: ['#ff3d6e', '#00f5ff', '#c45fff', '#39ff14', '#ffffff'] // Candy shoppe colors
  };

  const CRATER_TOP = 24;
  const CRATER_L   = 22;
  const CRATER_R   = 42;

  let cerealBits = [];
  let bolts      = [];
  let frame      = 0;

  // ── SPAWNERS ──
  function spawnCereal() {
    // Sugary cereal chunks erupting
    cerealBits.push({
      x: CENTER + (Math.random() - 0.5) * 8,
      y: CRATER_TOP + 2,
      vx: (Math.random() - 0.5) * 2.5,
      vy: -(Math.random() * 3 + 1.5),
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      col: C.cereal[Math.floor(Math.random() * C.cereal.length)],
      gravity: 0.15,
      size: Math.random() < 0.5 ? 1 : 2 // 1x1 or 2x2 chunky pixels
    });
  }

  function spawnBolt() {
    const isLeft = Math.random() < 0.5;
    // Keep bolts on the sides like the logo
    const startX = isLeft ? (6 + Math.random() * 8) : (48 + Math.random() * 8);
    const startY = 10 + Math.random() * 10;
    
    bolts.push({
      x: startX,
      y: startY,
      life: 1,
      decay: 0.15 + Math.random() * 0.1, // Faster decay for snappier lightning
      segs: 4 + Math.floor(Math.random() * 3),
      angle: (Math.PI/2) + (Math.random()-0.5)*0.8,
    });
  }

  // ── DRAWING FUNCTIONS ──
  function drawBackground() {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    // Chunky white inner ring (logo style)
    ctx.strokeStyle = C.ring1;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, 30, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawMountain() {
    for (let y = CRATER_TOP; y < H; y++) {
      // Steeper angle for the chunky mountain
      const widthAtY = (y - CRATER_TOP) * 0.8;
      const l = Math.floor(CENTER - 8 - widthAtY);
      const r = Math.floor(CENTER + 8 + widthAtY);

      // Lava flow centers (wobbly)
      const leftFlow = Math.floor(CENTER - 2 - (y - CRATER_TOP) * 0.4 + Math.sin(y * 0.3 + frame * 0.1) * 2);
      const rightFlow = Math.floor(CENTER + 2 + (y - CRATER_TOP) * 0.4 + Math.sin(y * 0.4 - frame * 0.1) * 2);

      for (let x = 0; x <= W; x++) {
        // Keep inside the circle
        if (Math.hypot(x - CENTER, y - CENTER) > 29) continue;

        if (x >= l && x <= r) {
          // Draw mountain outline
          if (x === l || x === r || y === CRATER_TOP) {
            ctx.fillStyle = C.mountOut;
            ctx.fillRect(x, y, 1, 1);
            continue;
          }

          const distLeft = Math.abs(x - leftFlow);
          const distRight = Math.abs(x - rightFlow);
          const flowWidth = 1 + (y - CRATER_TOP) * 0.05;

          // Draw Lava or Rock
          if (distLeft <= flowWidth || distRight <= flowWidth) {
            // Animating lava texture
            const t = (frame * 0.2 + y * 0.3) % 1;
            ctx.fillStyle = t > 0.5 ? C.lava0 : C.lava1;
          } else {
            ctx.fillStyle = C.mount;
          }
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
  }

  function drawCereal() {
    for (const c of cerealBits) {
      if (c.y < H) {
        ctx.fillStyle = c.col;
        ctx.fillRect(Math.floor(c.x), Math.floor(c.y), c.size, c.size);
      }
    }
  }

  function drawBolts() {
    for (const b of bolts) {
      ctx.globalAlpha = Math.max(0, b.life);
      let x = b.x, y = b.y;
      const segLen = 4; // Shorter segments for chunkier canvas
      
      for (let i = 0; i < b.segs; i++) {
        const nx = Math.floor(x + Math.cos(b.angle + (Math.random()-0.5)*2) * segLen);
        const ny = Math.floor(y + Math.sin(b.angle) * segLen);
        
        ctx.strokeStyle = C.bolt;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
        
        x = nx; y = ny;
      }
    }
    ctx.globalAlpha = 1;
  }

  // ── UPDATE & LOOP ──
  function update() {
    // Erupt cereal chunks constantly
    if (frame % 2 === 0) spawnCereal();
    
    // Random lightning flashes
    if (Math.random() > 0.92) spawnBolt();

    for (const b of bolts) { b.life -= b.decay; }
    bolts = bolts.filter(b => b.life > 0);

    for (const c of cerealBits) {
      c.x  += c.vx;
      c.y  += c.vy;
      c.vy += c.gravity;
      c.life -= c.decay;
    }
    cerealBits = cerealBits.filter(c => c.life > 0 && c.y < H + 5);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawBolts();
    drawMountain();
    drawCereal();
  }

  // Lower framerate for that authentic old-school game feel
  const TARGET_FPS = 15; 
  const FRAME_MS   = 1000 / TARGET_FPS;
  let lastTime = 0;
  let rafId;

  function loop(ts) {
    rafId = requestAnimationFrame(loop);
    if (ts - lastTime < FRAME_MS) return;
    lastTime = ts;
    update();
    render();
    frame++;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(rafId);
    else { lastTime = 0; rafId = requestAnimationFrame(loop); }
  });

  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
