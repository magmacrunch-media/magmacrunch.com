<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>magmacrunch media — unbounded retro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    /* Deep dark void background to let the volcano pop */
    --bg-color: #0a0508; 
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    overflow: hidden;
    padding: 20px;
  }

  /* ── EXAGGERATED 3D RETRO TITLE ── */
  .title {
    font-size: clamp(28px, 4vw, 56px); /* Scales with screen size */
    text-align: center;
    text-transform: lowercase;
    color: #ff3d6e; /* Primary logo red */
    /* Stacked shadows create a chunky 3D extrusion effect */
    text-shadow: 
      4px 4px 0px #110000,
      8px 8px 0px #ff7c1f,
      12px 12px 0px #110000,
      16px 16px 0px #ffe03a,
      20px 20px 0px #000000;
    letter-spacing: 0.05em;
    margin-bottom: 2rem;
    line-height: 1.4;
    z-index: 10;
  }

  /* Canvas Container - Unbounded */
  .canvas-container {
    position: relative;
    width: 100%;
    max-width: 512px;
    aspect-ratio: 1 / 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    /* Forces chunky, unblurred pixels */
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
  }

  /* Arcade Taglines */
  .tagline-container {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }

  .est {
    font-size: 14px;
    color: #ff3d6e;
    text-shadow: 2px 2px 0 #000;
  }

  .tagline {
    font-size: 12px;
    color: #ffe03a;
    text-align: center;
    line-height: 2.2;
    text-shadow: 2px 2px 0 #000;
    text-transform: lowercase;
  }

  .blink {
    animation: blink-step 1.2s step-end infinite;
    color: #00f5ff;
  }

  @keyframes blink-step {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

  <div class="title">magmacrunch<br>media</div>

  <div class="canvas-container">
    <canvas id="volcano" width="64" height="64"></canvas>
  </div>

  <div class="tagline-container">
    <div class="est">est. 2023</div>
    <div class="tagline">
      sometimes it's quite melodious;<br>
      <span class="blink">other times it's noise</span>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('volcano');
  const ctx    = canvas.getContext('2d');
  
  ctx.imageSmoothingEnabled = false;

  // Tiny internal resolution
  const W = 64, H = 64;
  const CENTER = 32;

  // ── PALETTE ──
  const C = {
    mount:   '#2b0a12', // Dark, warm mountain base
    mountDark:'#110206',// Rock texture shading
    mountOut:'#ff3d6e', // Red outline from logo
    lava0:   '#ffe03a', // Bright yellow lava
    lava1:   '#ffad1f', // Orange lava shading
    bolt:    '#ffe03a',
    // Pastel marshmallows and toasted oat loops
    cereal:  ['#ff85a2', '#70ffea', '#d694ff', '#8aff75', '#ffffff'], 
    toast:   '#d4a373' 
  };

  const CRATER_TOP = 32;

  let cerealBits = [];
  let bolts      = [];
  let frame      = 0;

  // ── SPAWNERS ──
  function spawnCereal() {
    const isMarshmallow = Math.random() < 0.35; // 35% chance for marshmallow
    
    cerealBits.push({
      x: CENTER + (Math.random() - 0.5) * 14, // Spawns within the wider crater
      y: CRATER_TOP - 2, 
      vx: (Math.random() - 0.5) * 3,
      vy: -(Math.random() * 3.5 + 1.5),
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      col: isMarshmallow ? C.cereal[Math.floor(Math.random() * C.cereal.length)] : C.toast,
      gravity: 0.18,
      type: isMarshmallow ? 'marshmallow' : 'loop'
    });
  }

  function spawnBolt() {
    const isLeft = Math.random() < 0.5;
    const startX = isLeft ? (2 + Math.random() * 12) : (50 + Math.random() * 12);
    const startY = 4 + Math.random() * 16;
    
    bolts.push({
      x: startX,
      y: startY,
      life: 1,
      decay: 0.2 + Math.random() * 0.1, 
      segs: 4 + Math.floor(Math.random() * 4),
      angle: (Math.PI/2) + (Math.random()-0.5)*1.2,
    });
  }

  // ── DRAWING FUNCTIONS ──
  function drawMountain() {
    // 1. Draw glowing lava pool at the top (The Caldera)
    const rx = 10; 
    const ry = 4;
    for (let y = CRATER_TOP - ry; y <= CRATER_TOP; y++) {
      for (let x = CENTER - rx - 2; x <= CENTER + rx + 2; x++) {
        const dx = (x - CENTER) / rx;
        const dy = (y - CRATER_TOP) / ry;
        if (dx * dx + dy * dy <= 1) {
          // Inner glow vs outer lip
          if (dx * dx + dy * dy < 0.6) {
             ctx.fillStyle = C.lava0; // Hot core
          } else if (y < CRATER_TOP - ry + 1.5) {
            ctx.fillStyle = C.mountOut; // Back rim
          } else {
            ctx.fillStyle = C.lava1; // Cooling edge
          }
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }

    // 2. Draw the main mountain body with a curved, sweeping silhouette
    for (let y = CRATER_TOP; y < H; y++) {
      const depth = y - CRATER_TOP;
      // Exponential curve for classic volcano sweeping base
      const widthAtY = Math.pow(depth, 1.2) * 0.5 + 10; 
      const l = Math.floor(CENTER - widthAtY);
      const r = Math.floor(CENTER + widthAtY);

      // Thicker, dynamic lava flows
      const flow1 = Math.floor(CENTER - 5 - depth * 0.4 + Math.sin(depth * 0.2 - frame * 0.1) * 3);
      const flow2 = Math.floor(CENTER + 5 + depth * 0.4 + Math.sin(depth * 0.25 - frame * 0.15) * 3);
      const flow3 = Math.floor(CENTER + Math.sin(depth * 0.15 - frame * 0.05) * 2); // Center flow

      for (let x = 0; x <= W; x++) {
        if (x >= l && x <= r) {
          // Draw Neon Outline
          if (x === l || x === r) {
            ctx.fillStyle = C.mountOut;
            ctx.fillRect(x, y, 1, 1);
            continue;
          }

          // Distance to lava flows
          const dist1 = Math.abs(x - flow1);
          const dist2 = Math.abs(x - flow2);
          const dist3 = Math.abs(x - flow3);
          const flowWidth = 1.5 + depth * 0.06;

          // Render Lava or Rock
          if (dist1 <= flowWidth || dist2 <= flowWidth || dist3 <= flowWidth) {
            const t = (frame * 0.15 + y * 0.2) % 1;
            ctx.fillStyle = t > 0.5 ? C.lava0 : C.lava1; // Pulsing lava
          } else {
             // Stable pseudo-random rocky texture
            const isDark = (Math.sin(x * 12.3 + y * 45.6) > 0.7);
            ctx.fillStyle = isDark ? C.mountDark : C.mount; 
          }
          
          // Hide lava behind the front lip of the crater rim
          if (y === CRATER_TOP && Math.abs(x - CENTER) < rx) {
              ctx.fillStyle = C.mountOut;
          }

          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
  }

  function drawCereal() {
    for (const c of cerealBits) {
      if (c.y < H) {
        ctx.fillStyle = c.col;
        const x = Math.floor(c.x);
        const y = Math.floor(c.y);
        
        if (c.type === 'loop') {
          // Draw a 3x3 hollow square to look like an oat loop
          ctx.fillRect(x, y, 3, 3);
          ctx.clearRect(x + 1, y + 1, 1, 1); 
        } else {
          // Draw a chunky cross shape for marshmallows
          ctx.fillRect(x + 1, y, 2, 4);
          ctx.fillRect(x, y + 1, 4, 2);
        }
      }
    }
  }

  function drawBolts() {
    for (const b of bolts) {
      ctx.globalAlpha = Math.max(0, b.life);
      let x = b.x, y = b.y;
      const segLen = 5; 
      
      for (let i = 0; i < b.segs; i++) {
        const nx = Math.floor(x + Math.cos(b.angle + (Math.random()-0.5)*2) * segLen);
        const ny = Math.floor(y + Math.sin(b.angle) * segLen);
        
        ctx.strokeStyle = C.bolt;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
        
        x = nx; y = ny;
      }
    }
    ctx.globalAlpha = 1;
  }

  // ── UPDATE & LOOP ──
  function update() {
    if (frame % 3 === 0) spawnCereal(); // Slightly slower spawn rate for clarity
    if (Math.random() > 0.92) spawnBolt();

    for (const b of bolts) { b.life -= b.decay; }
    bolts = bolts.filter(b => b.life > 0);

    for (const c of cerealBits) {
      c.x  += c.vx;
      c.y  += c.vy;
      c.vy += c.gravity;
      c.life -= c.decay;
    }
    cerealBits = cerealBits.filter(c => c.life > 0 && c.y < H + 5);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBolts();
    drawMountain();
    drawCereal();
  }

  const TARGET_FPS = 15; 
  const FRAME_MS   = 1000 / TARGET_FPS;
  let lastTime = 0;
  let rafId;

  function loop(ts) {
    rafId = requestAnimationFrame(loop);
    if (ts - lastTime < FRAME_MS) return;
    lastTime = ts;
    update();
    render();
    frame++;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(rafId);
    else { lastTime = 0; rafId = requestAnimationFrame(loop); }
  });

  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
