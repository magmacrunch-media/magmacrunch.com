<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>magmacrunch — arcade preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg-color: #0c0811;
    --text-glow: rgba(0, 245, 255, 0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    overflow: hidden;
  }

  /* ── ARCADE SCREEN WRAPPER ── */
  .arcade-screen {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
    background: radial-gradient(circle at center, #1a1025 0%, #000000 100%);
    border-radius: 20px;
    box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
    animation: crt-flicker 0.15s infinite;
  }

  /* 16-bit Gradient Title */
  .title {
    font-size: 32px;
    margin-bottom: 24px;
    text-align: center;
    background: linear-gradient(to bottom, #ff3d6e 0%, #ff7c1f 50%, #ffe03a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(4px 4px 0px #000) drop-shadow(0px 0px 8px rgba(255,61,110,0.4));
    letter-spacing: 0.05em;
  }

  /* Canvas Container & Scaled Rendering */
  .canvas-container {
    position: relative;
    width: 384px;
    height: 384px;
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.1), inset 0 0 20px rgba(0,0,0,0.8);
    background: #000;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated; /* Crucial for the retro SNES look */
    border-radius: 50%;
  }

  /* CRT Scanlines Overlay */
  .scanlines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.15),
      rgba(0, 0, 0, 0.15) 2px,
      transparent 2px,
      transparent 4px
    );
    pointer-events: none;
  }

  /* Arcade Taglines */
  .tagline-container {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .est {
    font-size: 12px;
    color: #ff3d6e;
    text-shadow: 2px 2px 0 #000;
  }

  .tagline {
    font-size: 10px;
    color: #00f5ff;
    text-align: center;
    line-height: 1.8;
    text-shadow: 2px 2px 0 #000, 0 0 8px var(--text-glow);
  }

  .blink {
    animation: blink-step 1.5s step-end infinite;
  }

  @keyframes blink-step {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes crt-flicker {
    0% { opacity: 0.98; }
    50% { opacity: 1; }
    100% { opacity: 0.99; }
  }
</style>
</head>
<body>

<div class="arcade-screen">
  <div class="title">MAGMACRUNCH</div>

  <div class="canvas-container">
    <canvas id="volcano" width="128" height="128"></canvas>
    <div class="scanlines"></div>
  </div>

  <div class="tagline-container">
    <div class="est">EST. 2023</div>
    <div class="tagline">
      SOMETIMES IT'S QUITE MELODIOUS;<br>
      <span class="blink" style="color: #ffe03a;">OTHER TIMES IT'S NOISE</span>
    </div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('volcano');
  const ctx    = canvas.getContext('2d');
  
  // Internal resolution increased for more detailed pixel art
  const W = 128, H = 128;
  const CENTER = 64;

  // ── PALETTE (SNES / 16-bit Era) ──
  const C = {
    skyTop: '#1a0524',
    skyBot: '#3a1144',
    ring:   '#fdfbf7',
    mount0: '#1c0818',
    mount1: '#2d1425',
    milk0:  '#ffffff', // Core milk lava
    milk1:  '#ffe8ee', // Shaded milk lava
    bolt:   '#ffe03a',
    bolthi: '#ffffff',
    cereal: ['#ff3d6e', '#ffe03a', '#00f5ff', '#ff7c1f', '#c45fff'] // Fruity loops
  };

  const CRATER_TOP = 48;
  const CRATER_L   = 48;
  const CRATER_R   = 80;

  let particles = [];
  let bolts     = [];
  let cerealBits = [];
  let frame     = 0;

  // ── SPAWNERS ──
  function spawnMilk() {
    // Drops of milk shooting out
    particles.push({
      x: CRATER_L + 4 + Math.random() * (CRATER_R - CRATER_L - 8),
      y: CRATER_TOP,
      vx: (Math.random() - 0.5) * 2,
      vy: -(Math.random() * 3.0 + 1.0),
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      r: Math.random() < 0.5 ? 2 : 3,
      col: Math.random() < 0.7 ? C.milk0 : C.milk1,
      gravity: 0.15,
    });
  }

  function spawnBolt() {
    const isLeft = Math.random() < 0.5;
    const startX = isLeft ? (16 + Math.random() * 16) : (96 + Math.random() * 16);
    const startY = 20 + Math.random() * 15;
    
    bolts.push({
      x: startX,
      y: startY,
      life: 1,
      decay: 0.08 + Math.random() * 0.1,
      segs: 5 + Math.floor(Math.random() * 4),
      angle: (Math.PI/2) + (Math.random()-0.5)*0.6,
    });
  }

  function spawnCereal() {
    // Torus-shaped cereal loops shooting out
    cerealBits.push({
      x: CENTER + (Math.random() - 0.5) * 16,
      y: CRATER_TOP,
      vx: (Math.random() - 0.5) * 3,
      vy: -(Math.random() * 4 + 2),
      life: 1,
      decay: 0.008 + Math.random() * 0.01,
      col: C.cereal[Math.floor(Math.random()*C.cereal.length)],
      gravity: 0.18,
    });
  }

  // ── DRAWING FUNCTIONS ──
  function drawBackground() {
    // 16-bit smooth sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, C.skyTop);
    grad.addColorStop(1, C.skyBot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Hand-drawn style circular ring outline
    ctx.strokeStyle = C.ring;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, 60, 0, Math.PI * 2);
    ctx.stroke();
    
    // Mask out the corners to keep it perfectly round
    ctx.globalCompositeOperation = 'destination-in';
    ctx.beginPath();
    ctx.arc(CENTER, CENTER, 62, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawMountain() {
    for (let y = CRATER_TOP; y < H; y++) {
      const widthAtY = (y - CRATER_TOP) * 1.1;
      const l = CENTER - 16 - widthAtY;
      const r = CENTER + 16 + widthAtY;

      // Calculate winding paths for the two milk/cereal flows
      const leftFlowCenter = CENTER - 4 - (y - CRATER_TOP) * 0.6 + Math.sin(y * 0.15 + frame * 0.05) * 4;
      const rightFlowCenter = CENTER + 4 + (y - CRATER_TOP) * 0.6 + Math.sin(y * 0.2 - frame * 0.06) * 4;

      for (let x = 0; x <= W; x++) {
        // Only draw inside the main ring
        if (Math.hypot(x - CENTER, y - CENTER) > 58) continue;

        if (x >= l && x <= r) {
          const distLeftFlow = Math.abs(x - leftFlowCenter);
          const distRightFlow = Math.abs(x - rightFlowCenter);
          const flowWidth = 2.5 + (y - CRATER_TOP) * 0.08; 

          // Milk lava rivers
          if (distLeftFlow < flowWidth || distRightFlow < flowWidth) {
            const t = (frame * 0.08 + x * 0.1 + y * 0.2) % 1;
            ctx.fillStyle = t > 0.4 ? C.milk0 : C.milk1;
          } else {
            // Dark purple mountain rock
            const noise = (Math.sin(x * 45.2 + y * 12.1) * 10000) % 1;
            ctx.fillStyle = (noise > 0.3) ? C.mount0 : C.mount1;
          }
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }

    // Crater Rim highlight
    ctx.fillStyle = C.milk1;
    ctx.fillRect(CRATER_L, CRATER_TOP, CRATER_R - CRATER_L, 2);
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.r, p.r);
    }
    ctx.globalAlpha = 1;
  }

  function drawCereal() {
    for (const c of cerealBits) {
      ctx.globalAlpha = c.life;
      const px = Math.round(c.x);
      const py = Math.round(c.y);
      
      // Draw pixel-art torus (3x3 or 4x4 loops)
      ctx.fillStyle = c.col;
      // Top/Bottom
      ctx.fillRect(px + 1, py, 2, 1);
      ctx.fillRect(px + 1, py + 3, 2, 1);
      // Sides
      ctx.fillRect(px, py + 1, 1, 2);
      ctx.fillRect(px + 3, py + 1, 1, 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawBolts() {
    for (const b of bolts) {
      ctx.globalAlpha = b.life;
      let x = b.x, y = b.y;
      const segLen = 8;
      
      for (let i = 0; i < b.segs; i++) {
        const nx = x + Math.cos(b.angle + (Math.random()-0.5)*1.5) * segLen;
        const ny = y + Math.sin(b.angle) * segLen;
        
        ctx.strokeStyle = C.bolt;
        ctx.lineWidth = 3;
        ctx.globalAlpha = b.life * 0.4;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
        
        ctx.strokeStyle = C.bolthi;
        ctx.lineWidth = 1;
        ctx.globalAlpha = b.life;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(nx, ny); ctx.stroke();
        x = nx; y = ny;
      }
    }
    ctx.globalAlpha = 1;
  }

  // ── UPDATE & LOOP ──
  function update() {
    if (frame % 3 === 0) spawnMilk();
    if (frame % 25 === 0 && Math.random() > 0.2) spawnBolt();
    if (frame % 8 === 0) spawnCereal();

    // Move milk drops
    for (const p of particles) {
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += p.gravity;
      p.life -= p.decay;
    }
    particles = particles.filter(p => p.life > 0 && p.y < H + 10);

    // Fade bolts
    for (const b of bolts) { b.life -= b.decay; }
    bolts = bolts.filter(b => b.life > 0);

    // Move cereal loops
    for (const c of cerealBits) {
      c.x  += c.vx;
      c.y  += c.vy;
      c.vy += c.gravity;
      c.life -= c.decay;
    }
    cerealBits = cerealBits.filter(c => c.life > 0 && c.y < H + 10);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawBolts();
    drawMountain();
    drawParticles();
    drawCereal();
  }

  const TARGET_FPS = 30; // Slightly higher framerate for SNES feel
  const FRAME_MS   = 1000 / TARGET_FPS;
  let lastTime = 0;
  let rafId;

  function loop(ts) {
    rafId = requestAnimationFrame(loop);
    if (ts - lastTime < FRAME_MS) return;
    lastTime = ts;
    update();
    render();
    frame++;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(rafId);
    else { lastTime = 0; rafId = requestAnimationFrame(loop); }
  });

  rafId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
