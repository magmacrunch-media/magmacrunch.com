<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>magmacrunch media — the breakfast of champions</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg-color: #0b0b0e; 
    --hot-pink: #FF2D9B;
    --slate:    #666670;
    --cyan:     #00D4FF;
    --yellow:   #ffe03a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    overflow: hidden;
    padding: 20px;
  }

  .canvas-container {
    position: relative;
    width: 100%;
    max-width: 700px;
    aspect-ratio: 300 / 256;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
  }

  .tagline-container {
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }

  .tagline {
    font-size: 14px;
    color: var(--yellow);
    text-align: center;
    line-height: 2.2;
    text-shadow: 2px 2px 0 rgba(255,224,58,0.3);
    text-transform: lowercase;
  }

  .blink {
    animation: blink-step 1.2s step-end infinite;
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(0,212,255,0.4);
  }

  @keyframes blink-step {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

  <div class="canvas-container">
    <canvas id="cereal-scene" width="300" height="256"></canvas>
  </div>

  <div class="tagline-container">
    <div class="tagline">
      part of a complete digital breakfast;<br>
      <span class="blink">insert coin to crunch</span>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('cereal-scene');
  const ctx    = canvas.getContext('2d');
  
  ctx.imageSmoothingEnabled = false;

  const W = 300, H = 256;
  
  // Layout geometry 
  const BOWL_CENTER_X = 224;
  const BOWL_TOP = 195;
  const SPOUT_X = 145;
  const SPOUT_Y = 85;

  const C = {
    pink:     '#FF2D9B',
    darkPink: '#b8166b',
    slate:    '#666670',
    cyan:     '#00D4FF',
    yellow:   '#ffe03a',
    dark:     '#111116',
    milk:     '#ffe03a'
  };

  let cerealBits = [];
  let splashes   = [];
  let frame      = 0;

  // ── SPAWNERS ──
  function spawnCereal() {
    const types = ['loop', 'star', 'rock'];
    const type = types[Math.floor(Math.random() * types.length)];
    
    let color = C.yellow;
    if (type === 'loop') color = C.pink;
    if (type === 'star') color = C.cyan;

    cerealBits.push({
      x: SPOUT_X + (Math.random() - 0.5) * 16, 
      y: SPOUT_Y + (Math.random() - 0.5) * 8,
      vx: Math.random() * 2.5 + 2.0, 
      vy: Math.random() * -1.5 - 0.5,
      col: color,
      type: type,
      targetY: BOWL_TOP + 2 + Math.random() * 10, 
      floating: false,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.25
    });
  }

  function spawnSplash(x, y, color) {
    for(let i=0; i<5; i++) {
      splashes.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 4.5,
        vy: -(Math.random() * 3.5 + 2),
        col: color,
        life: 1,
        decay: 0.07 + Math.random() * 0.05
      });
    }
  }

  // ── DRAWING FUNCTIONS ──

  function drawVolcanoBoxArt(cx, cy) {
    ctx.save();
    ctx.translate(cx, cy);

    // 1. Circular Backdrop Badge
    ctx.fillStyle = C.cyan;
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.dark;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();

    // 2. Volcano Mountain (Sweeping Mascot Style)
    ctx.fillStyle = C.slate;
    ctx.beginPath();
    ctx.moveTo(-22, 16); 
    ctx.quadraticCurveTo(-10, 0, -8, -10); // Left outer slope
    ctx.lineTo(-4, -4); // Jagged crater dip
    ctx.lineTo(0, -1);  // Center dip
    ctx.lineTo(4, -4);  // Right jagged dip
    ctx.lineTo(8, -10); // Right peak
    ctx.quadraticCurveTo(10, 0, 22, 16); // Right outer slope
    ctx.fill();

    // 3. Thick Magma Cap (Gooey lava frosting)
    ctx.fillStyle = C.pink;
    ctx.beginPath();
    // Trace the top jagged rim
    ctx.moveTo(-8, -10);
    ctx.lineTo(-4, -4);
    ctx.lineTo(0, -1);
    ctx.lineTo(4, -4);
    ctx.lineTo(8, -10);
    // Draw thick outer drips using smooth curves
    ctx.quadraticCurveTo(12, -5, 8, 4);   // Right side & drip
    ctx.quadraticCurveTo(6, -2, 4, 0);    // Gap
    ctx.quadraticCurveTo(2, 6, 0, 8);     // Center thick drip
    ctx.quadraticCurveTo(-2, 6, -4, 0);   // Gap
    ctx.quadraticCurveTo(-6, -2, -8, 4);  // Left drip
    ctx.quadraticCurveTo(-12, -5, -8, -10); // Left side
    ctx.fill();

    // 4. Magma Core Highlights (Bright yellow center drips)
    ctx.fillStyle = C.yellow;
    ctx.beginPath();
    ctx.moveTo(-4, -4);
    ctx.lineTo(0, -1);
    ctx.lineTo(4, -4);
    ctx.quadraticCurveTo(6, -3, 5, 1);
    ctx.quadraticCurveTo(3, -1, 2, 0);
    ctx.quadraticCurveTo(0, 4, -1, 5);
    ctx.quadraticCurveTo(-3, -1, -4, 0);
    ctx.quadraticCurveTo(-6, -3, -5, 1);
    ctx.fill();

    // 5. Erupting Plume (Bubbling cartoon explosion)
    const toggle = (frame % 16 < 8);
    const t2 = (frame % 12 < 6);

    // Center yellow/pink blasts
    ctx.fillStyle = toggle ? C.yellow : C.pink;
    ctx.beginPath(); ctx.arc(0, -14, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -22, toggle ? 4 : 2, 0, Math.PI*2); ctx.fill();

    // Outer cyan/pink particles
    ctx.fillStyle = t2 ? C.pink : C.cyan;
    ctx.beginPath(); ctx.arc(-7, -18, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -16, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, -10, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-11, -8, 1.5, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }

  function drawBox() {
    ctx.save();
    ctx.translate(110, 130); 
    ctx.rotate(Math.PI / 6); // 30-degree box pour angle

    const w = 90;
    const h = 135;
    const fx = -w/2; // Face X origin
    const fy = -h/2; // Face Y origin
    const dx = -20;  // 3D Depth X projection
    const dy = -15;  // 3D Depth Y projection

    // 1. Inside Back of Box (visible through the top opening)
    ctx.fillStyle = '#09090c';
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + w, fy);
    ctx.lineTo(fx + w + dx, fy + dy);
    ctx.lineTo(fx + dx, fy + dy);
    ctx.fill();

    // 2. 3D Left Side Panel 
    ctx.fillStyle = C.darkPink; 
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx, fy + h);
    ctx.lineTo(fx + dx, fy + h + dy);
    ctx.lineTo(fx + dx, fy + dy);
    ctx.fill();

    // 3. Main Cardboard Face - pure pink, no weird middle shadows
    ctx.fillStyle = C.pink;
    ctx.fillRect(fx, fy, w, h);

    // Minor Left edge highlight for crisp 3D separation
    ctx.fillStyle = '#ff6cb2';
    ctx.fillRect(fx, fy, 2, h);

    // 4. Accent Geometry
    ctx.fillStyle = C.cyan;
    ctx.fillRect(fx, fy + 12, w, 16); 
    ctx.fillStyle = C.darkPink;
    ctx.fillRect(fx, fy + h - 22, w, 22);

    // 5. Upgraded Volcano Mascot Logo
    drawVolcanoBoxArt(0, -2);

    // 6. Typography Layout (Widened the gap between MAGMA and CRUNCH)
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    
    // Shadow Layer
    ctx.fillStyle = '#110006';
    ctx.fillText('MAGMA', 2, 42);   
    ctx.fillText('CRUNCH', 2, 58);  

    // Cyan Outline Layer
    ctx.fillStyle = C.cyan;
    ctx.fillText('MAGMA', 1, 41);
    ctx.fillText('CRUNCH', 1, 57);
    
    // Main Yellow Face
    ctx.fillStyle = C.yellow;
    ctx.fillText('MAGMA', 0, 40);
    ctx.fillText('CRUNCH', 0, 56);

    // 7c. Top-Back Perimeter "Hinge" Line
    // Use a different color here first to confirm it hits the back corner
    ctx.strokeStyle = '#FF2D9B'; 
    ctx.lineWidth = 0.75;
    ctx.beginPath();    

    // Move to the back-left corner (shifted up and left)
    ctx.moveTo(fx - 18, fy - 15);     

    // Line to the back-right corner (also shifted up and left)
    ctx.lineTo(fx + w - 18, fy - 15);   

    ctx.stroke();

    // 7. Open Top Flap - Restored to your preferred dark pink/pink style
    ctx.fillStyle = C.darkPink; 
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + w, fy);
    ctx.lineTo(fx + w - 8, fy - 20);
    ctx.lineTo(fx - 5, fy - 22);
    ctx.fill();

    // 7b. Top Back Perimeter Line
    ctx.strokeStyle = '#FFFFFF'; // Use a contrasting color to test/see it
    ctx.lineWidth = 1;
    ctx.beginPath();    

    // This connects the 'back-left' corner of the box 
    // to the 'back-right' corner of the opening.
    // You need to adjust these to match your specific (fx, fy) offsets:
    ctx.moveTo(fx, fy);             // The rear corner of the box body
    ctx.lineTo(fx + w, fy);         // The rear corner of the top opening
    ctx.stroke();    

//    // Add this immediately after the flap fill() call
//    ctx.strokeStyle = '#110006'; // Or your desired outline color
//    ctx.lineWidth = 0.5;
//    ctx.beginPath();
//    ctx.moveTo(fx, fy);
//    ctx.lineTo(fx + w, fy);
//    ctx.lineTo(fx + w + 10, fy - 20);
//    ctx.lineTo(fx - 5, fy - 25);
//    ctx.closePath();
//    ctx.stroke();
    
    ctx.restore();
  }

  function drawBowlAndLiquid() {
    const cx = BOWL_CENTER_X; 
    const cy = BOWL_TOP;      
    const bw = 55; // Bowl half-width (radius)
    const ry = 14; // Bowl vertical perspective radius

    // 1. Back inner wall of bowl
    ctx.fillStyle = C.dark;
    ctx.beginPath();
    ctx.ellipse(cx, cy, bw, ry, 0, Math.PI, Math.PI * 2);
    ctx.fill();

    // 2. Magma Liquid Pool (Masked safely inside the bowl)
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy + 2, bw - 2, ry - 2, 0, 0, Math.PI * 2);
    ctx.clip();

    // Draw chunky boiling pixel waves
    for (let y = cy - ry; y <= cy + ry + 10; y += 2) {
      for (let x = cx - bw; x <= cx + bw; x += 2) {
        const wave = Math.sin(x * 0.15 + frame * 0.1) + Math.cos(y * 0.2 - frame * 0.08);
        if (wave > 0.5) ctx.fillStyle = C.pink;
        else if (wave < -0.4) ctx.fillStyle = C.cyan;
        else ctx.fillStyle = C.milk;
        ctx.fillRect(x, y, 2, 2);
      }
    }
    ctx.restore();

    // 3. Front outer wall of bowl (Curved geometry)
    ctx.fillStyle = C.slate;
    ctx.beginPath();
    ctx.moveTo(cx + bw, cy); 
    // Curve down to right base
    ctx.bezierCurveTo(cx + bw, cy + 30, cx + 30, cy + 45, cx + 20, cy + 45);
    ctx.lineTo(cx - 20, cy + 45); // Flat base
    // Curve up to left rim
    ctx.bezierCurveTo(cx - 30, cy + 45, cx - bw, cy + 30, cx - bw, cy);
    // Trace the bottom curve of the top rim opening back to the right
    ctx.ellipse(cx, cy, bw, ry, 0, Math.PI, 0, true);
    ctx.fill();

    // 4. Cyan Rim Stroke
    ctx.strokeStyle = C.cyan;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, bw, ry, 0, 0, Math.PI * 2);
    ctx.stroke();

    // 5. Bowl specular glossy highlight 
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.moveTo(cx - bw + 6, cy + 10);
    ctx.bezierCurveTo(cx - bw + 6, cy + 30, cx - 20, cy + 35, cx - 20, cy + 35);
    ctx.lineTo(cx - 10, cy + 35);
    ctx.bezierCurveTo(cx - 10, cy + 35, cx - bw + 15, cy + 30, cx - bw + 15, cy + 10);
    ctx.fill();
  }

  function drawCereal() {
    for (const c of cerealBits) {
      ctx.save();
      const x = Math.floor(c.x);
      const y = Math.floor(c.y + (c.floating ? Math.sin(frame * 0.15 + c.x) * 2 : 0)); 
      
      ctx.translate(x, y);
      if (!c.floating) ctx.rotate(c.angle);
      
      ctx.fillStyle = c.col;
      if (c.type === 'loop') {
        ctx.fillRect(-3, -3, 6, 6);
        ctx.clearRect(-1, -1, 2, 2); 
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(1, 1, 1, 1);
      } else if (c.type === 'star') {
        ctx.fillRect(-1, -3, 2, 6);
        ctx.fillRect(-3, -1, 6, 2);
        ctx.fillRect(-2, -2, 1, 1);
        ctx.fillRect(1, 1, 1, 1);
        ctx.fillRect(1, -2, 1, 1);
        ctx.fillRect(-2, 1, 1, 1);
      } else {
        ctx.fillRect(-2, -2, 4, 4);
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 1.5, 1.5);
      }
      ctx.restore();
    }
  }

  function drawSplashes() {
    for (const s of splashes) {
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillStyle = s.col;
      ctx.fillRect(Math.floor(s.x), Math.floor(s.y), 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  // ── UPDATE & LOOP ──
  function update() {
    if (frame % 3 === 0) spawnCereal();

    for (const s of splashes) {
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.42; 
      s.life -= s.decay;
    }
    splashes = splashes.filter(s => s.life > 0);

    for (const c of cerealBits) {
      if (!c.floating) {
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.35; 
        c.angle += c.spin; 
        
        if (c.y >= c.targetY && c.x > BOWL_CENTER_X - 55 && c.x < BOWL_CENTER_X + 55) {
          c.floating = true;
          c.y = c.targetY;
          c.vx = 0;
          c.vy = 0;
          spawnSplash(c.x, c.y, Math.random() > 0.5 ? C.pink : C.cyan);
        } else if (c.y > H + 20) {
          c.life = 0;
        }
      } else {
        c.x += (BOWL_CENTER_X - c.x) * 0.005;
      }
    }
    
    cerealBits = cerealBits.filter(c => c.y <= H + 20 && c.life !== 0);
    if(cerealBits.length > 55) {
       const floaters = cerealBits.filter(c => c.floating);
       if (floaters.length > 32) cerealBits.splice(cerealBits.indexOf(floaters[0]), 1);
    }
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBowlAndLiquid();
    drawCereal();
    drawSplashes();
    drawBox(); 
  }

  const TARGET_FPS = 24; 
  const FRAME_MS   = 1000 / TARGET_FPS;
  let lastTime = 0;
  let rafId;

  function loop(ts) {
    rafId = requestAnimationFrame(loop);
    if (ts - lastTime < FRAME_MS) return;
    lastTime = ts;
    update();
    render();
    frame++;
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(rafId);
    else { lastTime = 0; rafId = requestAnimationFrame(loop); }
  });

  document.fonts.ready.then(() => {
    rafId = requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
