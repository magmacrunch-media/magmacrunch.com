<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>c.p. rutledge — lyrics — press — magmacrunch media</title>
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="stylesheet" href="../../../style.css">
    <style>
        :root {
            --nav-accent: #f05a5a;
            --nav-glow: rgba(240,90,90,0.4);
            --nav-brand: #f08080;
            --nav-brand-glow: rgba(240,128,128,0.7);
        }

        body {
            background-color: #070612;
            color: #f5e8c0;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 72px 20px 60px;
        }

        .breadcrumb {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #a02020;
            letter-spacing: 0.1em;
            margin-top: -8px;
            margin-bottom: 24px;
            align-self: flex-start;
        }
        .breadcrumb a { color: #f05a5a; text-decoration: none; transition: color 0.15s; }
        .breadcrumb a:hover { color: #f08080; }
        .breadcrumb .sep { margin: 0 8px; color: #a02020; }
        .breadcrumb .current { color: #f05a5a; }

        .page-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(14px, 3vw, 24px);
            color: #f05a5a;
            text-shadow: 2px 2px 0 rgba(240,90,90,0.3);
            margin-bottom: 10px;
            letter-spacing: 0.08em;
            animation: fadeUp 0.5s ease both;
        }

        .page-subtitle {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #f08080;
            letter-spacing: 0.12em;
            margin-bottom: 32px;
            animation: fadeUp 0.5s 0.05s ease both;
        }

        .section-divider {
            width: min(640px, 90vw);
            height: 2px;
            background: #a02020;
            margin-bottom: 48px;
            position: relative;
            animation: fadeUp 0.5s 0.15s ease both;
        }
        .section-divider::after {
            content: '✦';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #070612;
            padding: 0 12px;
            color: #f05a5a;
            font-size: 10px;
        }

        .pieces-wrap {
            width: min(640px, 90vw);
            display: flex;
            flex-direction: column;
            gap: 0;
            animation: fadeUp 0.5s 0.18s ease both;
        }

        .pieces-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #a02020;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
        }

        .piece-card {
            display: flex;
            gap: 0;
            border: 2px solid #a02020;
            border-bottom: none;
            background: #1a1840;
            text-decoration: none;
            transition: border-color 0.15s, background 0.15s;
            position: relative;
            overflow: hidden;
        }
        .piece-card:last-child { border-bottom: 2px solid #a02020; }
        .piece-card:hover {
            border-color: #f05a5a;
            background: #2a2060;
        }

        .piece-card::before {
            content: '';
            display: block;
            width: 4px;
            flex-shrink: 0;
            background: #f05a5a;
            transition: width 0.15s;
        }
        .piece-card:hover::before { width: 7px; }

        .piece-card-info {
            padding: 16px 20px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .piece-card-text { flex: 1; }

        .piece-card-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(8px, 1.4vw, 10px);
            color: #f05a5a;
            letter-spacing: 0.06em;
            line-height: 1.7;
            margin-bottom: 5px;
        }

        .piece-card-arrow {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #f05a5a;
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.15s, transform 0.15s;
            flex-shrink: 0;
        }
        .piece-card:hover .piece-card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        footer {
            background: #070612 !important;
            border-top-color: #a02020 !important;
            color: #f05a5a !important;
        }
        footer span { color: #f05a5a !important; }

        @media (max-width: 640px) {
            .page-title { font-size: 14px; }
        }
    </style>
</head>
<body>

<nav id="auto-nav" data-depth="../../../"></nav>

<main>

    <div class="breadcrumb">
        <a href="../../../">home</a>
        <span class="sep">›</span>
        <a href="../../../press/">press</a>
        <span class="sep">›</span>
        <a href="../">lyrics</a>
        <span class="sep">›</span>
        <span class="current">c.p. rutledge</span>
    </div>

    <h1 class="page-title">// lyrics //</h1>
    <p class="page-subtitle">c.p. rutledge</p>

    <div class="section-divider"></div>

    <div class="pieces-wrap">
        <div class="pieces-label">// pieces //</div>

        <a href="i-only-feel-the-rain.html" class="piece-card">
            <div class="piece-card-info">
                <div class="piece-card-text">
                    <div class="piece-card-title">i only feel the rain</div>
                </div>
                <span class="piece-card-arrow">▶</span>
            </div>
        </a>

        <a href="somewhere.html" class="piece-card">
            <div class="piece-card-info">
                <div class="piece-card-text">
                    <div class="piece-card-title">somewhere</div>
                </div>
                <span class="piece-card-arrow">▶</span>
            </div>
        </a>

    </div>

</main>

<footer>
    &copy; 2026 <span>magmacrunch media</span>
</footer>

<script src="../../../nav.js"></script>
<script>window.addEventListener("pageshow",function(e){if(e.persisted)location.reload();});</script>
</body>
</html>
