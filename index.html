<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>magmacrunch media</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Courier+Prime:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── PAGE-SPECIFIC: homepage ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 72px 20px 60px;
        }

        /* ── VOLCANO ANIMATION ── */
        .volcano-wrap {
            animation: fadeUp 0.6s ease both;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
        }

        .volcano-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(20px, 3.5vw, 48px);
            text-align: center;
            text-transform: lowercase;
            color: var(--mc-crater);
            text-shadow:
                4px 4px 0px var(--mc-mount-mid),
                8px 8px 0px var(--mc-lava-deep),
                12px 12px 0px var(--mc-mount-dark),
                16px 16px 0px var(--mc-lava-amber),
                20px 20px 0px #000000;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .volcano-canvas-wrap {
            width: min(340px, 72vw);
            aspect-ratio: 1 / 1;
        }
        .volcano-canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .volcano-tagline {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .volcano-est {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--mc-lava-amber);
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 0.12em;
        }
        .volcano-quote {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(6px, 1vw, 9px);
            color: var(--mc-text-dim);
            text-align: center;
            line-height: 2.2;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 0.06em;
        }
        .volcano-quote .blink-cyan {
            color: var(--mc-cereal-cyan);
            animation: blink 1.2s step-end infinite;
        }

        /* Insert coin */
        .insert-coin {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: var(--mc-lava-bright);
            letter-spacing: 0.15em;
            margin-bottom: 32px;
            text-shadow: 0 0 12px rgba(255,224,58,0.8);
            animation: blink 1s step-end infinite, fadeUp 0.6s 0.3s ease both;
            animation-fill-mode: both;
        }

        /* Nav cards animation delay */
        .nav-cards { animation: fadeUp 0.6s 0.4s ease both; }

        @media (max-width: 640px) {
            .insert-coin { font-size: 8px; }
            .volcano-title {
                text-shadow:
                    1px 1px 0px var(--mc-mount-mid),
                    2px 2px 0px var(--mc-lava-deep),
                    3px 3px 0px var(--mc-mount-dark),
                    4px 4px 0px var(--mc-lava-amber),
                    5px 5px 0px #000000;
            }
        }
    </style>
</head>
<body>

<nav id="auto-nav" data-depth="./"></nav>

<main>

    <!-- VOLCANO ANIMATION -->
    <div class="volcano-wrap">
        <div class="volcano-title">magmacrunch<br>media</div>
        <div class="volcano-canvas-wrap">
            <canvas id="volcano" width="64" height="64"></canvas>
        </div>
        <div class="volcano-tagline">
            <div class="volcano-est">est. 2023</div>
            <div class="volcano-quote">
                sometimes it's quite melodious;<br>
                <span class="blink-cyan">other times it's noise</span>
            </div>
        </div>
    </div>

</main>

<footer>
    &copy; 2026 <span>magmacrunch media</span>
</footer>

<script src="nav.js"></script>
<script>
(function () {
  const canvas = document.getElementById('volcano');
  const ctx    = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = 64, H = 64, CENTER = 32;

  const C = {
    mount:    '#1a0505',  /* --mc-mount */
    mountDark:'#110206',  /* --mc-mount-dark */
    mountOut: '#ff3d6e',  /* --mc-crater */
    lava0:    '#ffe03a',  /* --mc-lava-bright */
    lava1:    '#ffad1f',  /* --mc-lava-amber */
    bolt:     '#ffe03a',  /* --mc-lava-bright */
    cereal:   ['#ff3d6e','#00f5ff','#c45fff','#39ff14','#ffffff']
                          /* mc-cereal-rose, mc-cereal-cyan, mc-cereal-purple, mc-cereal-green, mc-cereal-white */
  };
  const CRATER_TOP = 28;
  let cerealBits = [], bolts = [], frame = 0;

  function spawnCereal() {
    const isMarshmallow = Math.random() < 0.35;
    cerealBits.push({
      x: CENTER + (Math.random()-0.5)*14, y: CRATER_TOP-2,
      vx: (Math.random()-0.5)*3, vy: -(Math.random()*3.5+1.5),
      life: 1, decay: 0.015+Math.random()*0.02,
      col: isMarshmallow ? C.cereal[Math.floor(Math.random()*C.cereal.length)] : C.cereal[0],
      gravity: 0.18,
      type: isMarshmallow ? 'marshmallow' : 'loop'
    });
  }

  function spawnBolt() {
    const isLeft = Math.random()<0.5;
    bolts.push({
      x: isLeft?(2+Math.random()*12):(50+Math.random()*12),
      y: 4+Math.random()*16,
      life:1, decay:0.2+Math.random()*0.1,
      segs:4+Math.floor(Math.random()*4),
      angle:(Math.PI/2)+(Math.random()-0.5)*1.2
    });
  }

  function drawMountain() {
    // Glowing lava pool (caldera)
    const rx = 8, ry = 3;
    for (let y = CRATER_TOP-ry; y <= CRATER_TOP; y++) {
      for (let x = CENTER-rx-2; x <= CENTER+rx+2; x++) {
        const dx = (x-CENTER)/rx, dy = (y-CRATER_TOP)/ry;
        if (dx*dx+dy*dy <= 1) {
          if (dx*dx+dy*dy < 0.6) {
            ctx.fillStyle = C.lava0;
          } else if (y < CRATER_TOP-ry+1.5) {
            ctx.fillStyle = C.mountOut;
          } else {
            ctx.fillStyle = C.lava1;
          }
          ctx.fillRect(x,y,1,1);
        }
      }
    }

    // Mountain body with curved silhouette
    for (let y = CRATER_TOP; y < H; y++) {
      const depth = y - CRATER_TOP;
      const widthAtY = Math.pow(depth, 1.2) * 0.5 + 8;
      const l = Math.floor(CENTER - widthAtY);
      const r = Math.floor(CENTER + widthAtY);

      const flow1 = Math.floor(CENTER - 4 - depth*0.35 + Math.sin(depth*0.3-frame*0.1)*2);
      const flow2 = Math.floor(CENTER + 4 + depth*0.35 + Math.sin(depth*0.4-frame*0.1)*2);
      const flow3 = Math.floor(CENTER + Math.sin(depth*0.15 - frame*0.05)*2);

      for (let x = 0; x <= W; x++) {
        if (x >= l && x <= r) {
          if (x === l || x === r) { ctx.fillStyle = C.mountOut; ctx.fillRect(x,y,1,1); continue; }

          const dist1 = Math.abs(x-flow1), dist2 = Math.abs(x-flow2), dist3 = Math.abs(x-flow3);
          const flowWidth = 1.2 + depth*0.06;

          if (dist1<=flowWidth || dist2<=flowWidth || dist3<=flowWidth) {
            const t = (frame*0.15+y*0.2) % 1;
            ctx.fillStyle = t > 0.5 ? C.lava0 : C.lava1;
          } else {
            const isDark = (Math.sin(x*12.3+y*45.6) > 0.7);
            ctx.fillStyle = isDark ? C.mountDark : C.mount;
          }

          if (y === CRATER_TOP && Math.abs(x-CENTER) < rx) {
            ctx.fillStyle = C.mountOut;
          }

          ctx.fillRect(x,y,1,1);
        }
      }
    }
  }

  function drawCereal() {
    for (const c of cerealBits) {
      if (c.y < H) {
        ctx.fillStyle = c.col;
        const x = Math.floor(c.x), y = Math.floor(c.y);
        if (c.type === 'loop') {
          ctx.fillRect(x,y,3,3);
          ctx.clearRect(x+1,y+1,1,1);
        } else {
          ctx.fillRect(x+1,y,2,4);
          ctx.fillRect(x,y+1,4,2);
        }
      }
    }
  }

  function drawBolts() {
    for (const b of bolts) {
      ctx.globalAlpha = Math.max(0,b.life);
      let x=b.x, y=b.y;
      for (let i=0; i<b.segs; i++) {
        const nx=Math.floor(x+Math.cos(b.angle+(Math.random()-0.5)*2)*5);
        const ny=Math.floor(y+Math.sin(b.angle)*5);
        ctx.strokeStyle=C.bolt; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(nx,ny); ctx.stroke();
        x=nx; y=ny;
      }
    }
    ctx.globalAlpha=1;
  }

  function update() {
    if (frame%3===0) spawnCereal();
    if (Math.random()>0.92) spawnBolt();
    for (const b of bolts) b.life-=b.decay;
    bolts=bolts.filter(b=>b.life>0);
    for (const c of cerealBits) { c.x+=c.vx; c.y+=c.vy; c.vy+=c.gravity; c.life-=c.decay; }
    cerealBits=cerealBits.filter(c=>c.life>0&&c.y<H+5);
  }

  function render() {
    ctx.clearRect(0,0,W,H);
    drawBolts();
    drawMountain();
    drawCereal();
  }

  const FRAME_MS=1000/15;
  let lastTime=0, rafId;
  function loop(ts){
    rafId=requestAnimationFrame(loop);
    if(ts-lastTime<FRAME_MS)return;
    lastTime=ts;update();render();frame++;
  }
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)cancelAnimationFrame(rafId);
    else{lastTime=0;rafId=requestAnimationFrame(loop);}
  });
  rafId=requestAnimationFrame(loop);

  window.__pageCleanup = function () {
    cancelAnimationFrame(rafId);
  };
})();
</script>
</body>
</html>
