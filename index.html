<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>magmacrunch media</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Courier+Prime:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── PAGE-SPECIFIC: homepage ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 72px 20px 60px;
        }

        /* ── VOLCANO ANIMATION ── */
        .volcano-wrap {
            animation: fadeUp 0.6s ease both;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
        }

        .volcano-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(20px, 3.5vw, 48px);
            text-align: center;
            text-transform: lowercase;
            color: var(--mc-crater);
            text-shadow:
                4px 4px 0px var(--mc-mount-mid),
                8px 8px 0px var(--mc-lava-deep),
                12px 12px 0px var(--mc-mount-dark),
                16px 16px 0px var(--mc-lava-amber),
                20px 20px 0px #000000;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .volcano-canvas-wrap {
            width: min(340px, 72vw);
            aspect-ratio: 1 / 1;
        }
        .volcano-canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .volcano-tagline {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .volcano-est {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--mc-lava-amber);
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 0.12em;
        }
        .volcano-quote {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(6px, 1vw, 9px);
            color: var(--mc-text-dim);
            text-align: center;
            line-height: 2.2;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 0.06em;
        }
        .volcano-quote .blink-cyan {
            color: var(--mc-cereal-cyan);
            animation: blink 1.2s step-end infinite;
        }

        /* Insert coin */
        .insert-coin {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: var(--mc-lava-bright);
            letter-spacing: 0.15em;
            margin-bottom: 32px;
            text-shadow: 0 0 12px rgba(255,224,58,0.8);
            animation: blink 1s step-end infinite, fadeUp 0.6s 0.3s ease both;
            animation-fill-mode: both;
        }

        /* Nav cards animation delay */
        .nav-cards { animation: fadeUp 0.6s 0.4s ease both; }

        @media (max-width: 640px) {
            .insert-coin { font-size: 8px; }
            .volcano-title {
                text-shadow:
                    1px 1px 0px var(--mc-mount-mid),
                    2px 2px 0px var(--mc-lava-deep),
                    3px 3px 0px var(--mc-mount-dark),
                    4px 4px 0px var(--mc-lava-amber),
                    5px 5px 0px #000000;
            }
        }
    </style>
</head>
<body>

<nav id="auto-nav" data-depth="./"></nav>

<main>

    <!-- VOLCANO ANIMATION -->
    <div class="volcano-wrap">
        <div class="volcano-title">magmacrunch<br>media</div>
        <div class="volcano-canvas-wrap">
            <canvas id="volcano" width="64" height="64"></canvas>
        </div>
        <div class="volcano-tagline">
            <div class="volcano-est">est. 2023</div>
            <div class="volcano-quote">
                sometimes it's quite melodious;<br>
                <span class="blink-cyan">other times it's noise</span>
            </div>
        </div>
    </div>

</main>

<footer>
    &copy; 2026 <span>magmacrunch media</span>
</footer>

<script src="nav.js"></script>
<script src="animations/volcano.js"></script>
</body>
</html>
